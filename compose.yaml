name: net-top-next
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nettop
      POSTGRES_USER: nettop
      POSTGRES_PASSWORD: nettop-local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - nettop-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nettop -d nettop"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  nettop-data:
