# Serves the built frontend. /api is routed to the API by Traefik before a
# request reaches this server, so nothing here proxies.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The page itself is never cached, so an update reaches every browser.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Vite puts a content hash in every asset name, so they can be kept long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
