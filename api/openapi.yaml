openapi: 3.1.0
security: []
info:
  title: Net-Top Next API
  version: 0.6.0
  description: Current prototype contract for PostgreSQL-backed installed topology, saved drafts, and physical tracing (point-to-point and Find AGG / BB). Network membership, the backbone role, and stored HDF subpanel structure are readable in snapshots. HDFs are created in drafts with the atomic add_hdf command; see docs/architecture.md and docs/implementation-plan.md. Networks can be created and renamed, and Physical site-screen node positions are saved and shared; both are presentation or reference data and never change a topology revision. The only way installed topology changes is recording a draft (POST /plans/{id}/record). Names and detail fields of installed objects can be corrected directly (PATCH /installed/{kind}/{id}); each changed field is written to the change log, and the topology revision does not change.
servers:
  - url: http://127.0.0.1:8080/api
paths:
  /health:
    get:
      operationId: health
      summary: Check API and database health
      responses:
        '200':
          description: Process health, storage mode and the environment the API was started with (APP_ENV)
          content:
            application/json:
              schema:
                type: object
                required: [status, storage, environment]
                properties:
                  status: {type: string}
                  storage: {type: string}
                  environment:
                    type: string
                    enum: [dev, test, prod]
                    description: The header shows DEV or TEST for these and nothing for prod.
        '503': {$ref: '#/components/responses/Error'}
  /topology:
    get:
      operationId: getTopology
      summary: Read an installed or planned topology snapshot
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/PlanID'
      responses:
        '200':
          description: Consistent topology snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Snapshot'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /traces:
    post:
      operationId: trace
      summary: Trace exact physical continuity, or find AGG / BB destinations
      description: |
        Two modes. `point_to_point` returns the shortest physical route between two exact endpoints (identical endpoints give a zero-hop route; cable order carries no direction).

        `distribution` ("Find AGG / BB") searches from every port of one active device (`device`), or from one exact device, panel, or HDF port (`start`). Exactly one of the two is allowed; `end` is rejected; a `device` must be a switch. Each starting endpoint is searched independently over cables and same-position front/rear bridges and stops at the first active endpoint, so it never transits through a device's sibling ports (including AGG to BB).

        A destination is an endpoint of an `aggregation` or `backbone` device other than the starting device. A destination on the source network is a **route**; one on another network is a **mismatch**, listed separately and never as a route. The source network of a device or device-port start is the device's network. For a panel/HDF start it is the network of the access device on the same circuit (either direction); it is never taken from the panel or a name. With no access device on the circuit (or access devices on different networks) it is unresolved: every reached destination is a route carrying its own network, `sourceNetworkId` is omitted, and the start outcome is `unresolved_network`.

        Routes are ordered by destination role (`aggregation` before `backbone`), then start endpoint ID, then destination endpoint ID; mismatches by start then destination; `starts` by endpoint ID. Distinct start/destination pairs are never merged. At most 1,000 routes plus mismatches are returned (routes are kept first); `truncated` is true only when results were dropped, and a limit is never reported as unreachable. `status` is `reached` when any route exists, otherwise `unreachable`, with a `reason` derived from the start outcomes.

        Malformed JSON, unknown fields, and extra JSON values return 400. Invalid requests for a mode return 422 with a stable message: unknown or non-switch device, unknown endpoint, both or neither of `device`/`start`, `end` given to `distribution`, or an unsupported mode. The `aggregation` mode no longer exists and returns 422.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/PlanID'
        - in: query
          name: expectedRevision
          description: Optional topology revision from the loaded snapshot. A mismatch returns 409 rather than tracing unseen changes. The result's `revision` is always the revision that was traced.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [mode, start, end]
                  properties:
                    mode: {const: point_to_point}
                    start: {type: string, description: Exact start endpoint ID.}
                    end: {type: string, description: Exact destination endpoint ID.}
                - type: object
                  additionalProperties: false
                  required: [mode, device]
                  properties:
                    mode: {const: distribution}
                    device: {type: string, description: Equipment ID of a switch; every one of its ports is searched.}
                - type: object
                  additionalProperties: false
                  required: [mode, start]
                  properties:
                    mode: {const: distribution}
                    start: {type: string, description: Exact endpoint ID of a device port or a panel/HDF port.}
      responses:
        '200':
          description: Reached or unreachable; an unreachable result is not an HTTP error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TraceResult'}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /plans:
    get:
      operationId: listPlans
      summary: List saved plans, or the recorded plans that changed one object
      description: Without parameters, every plan (drafts and recorded) ordered by creation. With objectId, only the recorded plans that added, moved or removed that site, node, rack, equipment or cable, newest first (the object's history). An empty objectId is 400.
      parameters:
        - name: objectId
          in: query
          required: false
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Saved plans ordered by creation, or recorded plans newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Plan'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      operationId: createPlan
      summary: Create an empty draft against an installed revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, expectedBaseRevision]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                expectedBaseRevision: {type: string, minLength: 1}
      responses:
        '201':
          description: Empty draft pinned to the current installed revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /plans/{id}:
    parameters:
      - $ref: '#/components/parameters/PlanPathID'
    get:
      operationId: getPlan
      summary: Read one saved draft
      responses:
        '200':
          description: Draft metadata and additions, including stale drafts for review
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /plans/{id}/commands:
    parameters:
      - $ref: '#/components/parameters/PlanPathID'
    post:
      operationId: applyPlanCommand
      summary: Validate and atomically save a draft command
      description: Locks the draft, checks both draft and base revisions, validates the complete overlay, and saves additions atomically. Failed commands leave the draft revision unchanged. This does not change installed infrastructure. The body may be up to 1 MB so that a batch of 500 commands fits (other endpoints take 16 KB).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanCommand'}
      responses:
        '200':
          description: Saved draft with incremented revision. For remove_change the body is {plan, removed} and for batch {plan, ids} instead.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Plan'
                  - $ref: '#/components/schemas/RemoveChangeResult'
                  - $ref: '#/components/schemas/BatchResult'
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /plans/{id}/record:
    parameters:
      - $ref: '#/components/parameters/PlanPathID'
    post:
      operationId: recordPlan
      summary: Record a draft as installed
      description: In one transaction, locks the installed topology and then the draft, requires a draft (not recorded) whose revision equals expectedRevision and whose base is the current installed revision, applies the overlay, and writes the difference (by ID) to the installed tables. The installed revision changes once, to a new opaque value. The plan becomes read-only with its time and note kept as the record. Any failure leaves installed and the draft unchanged. A recorded plan refuses commands, record and rebase with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, note, recordedBy]
              properties:
                expectedRevision: {type: string, minLength: 1}
                note: {type: string, minLength: 1, maxLength: 500, description: Trimmed; says what was physically done.}
                recordedBy: {type: string, minLength: 1, maxLength: 100, description: "Trimmed free-text name until identities exist (M7). Stored with the plan."}
      responses:
        '200':
          description: The recorded plan and the new installed revision
          content:
            application/json:
              schema:
                type: object
                required: [plan, installedRevision]
                properties:
                  plan: {$ref: '#/components/schemas/Plan'}
                  installedRevision: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /plans/{id}/check:
    parameters:
      - $ref: '#/components/parameters/PlanPathID'
    post:
      operationId: checkPlan
      summary: Check a draft against the current installed topology (read-only)
      description: Takes no body and changes nothing. Returns whether the draft's base is stale and every change that cannot apply to the current installed topology, as Update draft and record would find them. Used by the review step before the note is written.
      responses:
        '200':
          description: The check result
          content:
            application/json:
              schema:
                type: object
                required: [stale, conflicts]
                properties:
                  stale: {type: boolean}
                  conflicts:
                    type: array
                    items: {$ref: '#/components/schemas/PlanConflict'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /plans/{id}/rebase:
    parameters:
      - $ref: '#/components/parameters/PlanPathID'
    post:
      operationId: rebasePlan
      summary: Update draft to the current installed topology
      description: Locks the installed topology (shared) and the draft, then re-checks every change of the draft against the current installed topology. With no conflicts the draft's base becomes the current installed revision and its revision increases by one; a draft that is already current is returned unchanged. Otherwise 409 lists every conflicting change and nothing changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision: {type: string, minLength: 1}
      responses:
        '200':
          description: The draft on the current base
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: The draft changed or is recorded (error only), or some changes conflict (error and conflicts)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
                  conflicts:
                    type: array
                    items: {$ref: '#/components/schemas/PlanConflict'}
        '500': {$ref: '#/components/responses/Error'}
  /sites/{siteId}/layout:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
    get:
      operationId: getSiteLayout
      summary: Read the saved node positions of a site
      description: Presentation data for the Physical site screen, shared by everyone. Only nodes the user has moved have a position; the client places the others by default. Positions are an arrangement, never physical coordinates, and are not part of installed topology, plans, or revisions.
      responses:
        '200':
          description: Saved positions of this site's nodes, ordered by node ID; empty when none were saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteLayout'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    delete:
      operationId: resetSiteLayout
      summary: Remove the saved node positions of a site
      description: Removes only this site's positions. Succeeds when there are none.
      responses:
        '204': {description: Positions removed}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /sites/{siteId}/layout/nodes/{nodeId}:
    parameters:
      - $ref: '#/components/parameters/SitePathID'
      - in: path
        name: nodeId
        required: true
        schema: {type: string}
    put:
      operationId: saveNodePosition
      summary: Save one node's position
      description: Upserts the position. Concurrency is last write wins per node, with no revision check; two people moving different nodes never conflict, and the same node ends where it was last dropped. Saving a position never changes a topology revision or a plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [x, y]
              properties:
                x: {type: number, minimum: -1000000, maximum: 1000000}
                y: {type: number, minimum: -1000000, maximum: 1000000}
      responses:
        '200':
          description: The saved position
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodePosition'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /networks:
    post:
      operationId: createNetwork
      summary: Create a network
      description: Networks are reference data, not physical topology. The server generates a permanent ID and the network takes the next place in the creation order (snapshots list networks in that order). Creating a network never changes a topology revision, so it never makes a draft stale. There is no delete.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NetworkName'}
      responses:
        '201':
          description: The new network
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Network'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /networks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    patch:
      operationId: renameNetwork
      summary: Rename a network
      description: Changes only the display name. The ID, device membership, circuits, drafts, and creation order are unchanged, and no topology revision changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NetworkName'}
      responses:
        '200':
          description: The renamed network
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Network'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /installed/{kind}/{id}:
    parameters:
      - in: path
        name: kind
        required: true
        schema: {type: string, enum: [equipment, endpoints, links, sites, nodes, racks]}
      - in: path
        name: id
        required: true
        schema: {type: string}
    patch:
      operationId: fixInstalled
      summary: Correct an installed object's name or details (a direct fix)
      description: "Changes only names and detail fields, never topology: a field such as rackId, unit, networkId or role is 422 (use a plan); an unknown field is 400. Fixable: equipment name and details; a switch port's label (only ports with a position; panel and HDF positions are named by their place) and port details; a cable's label, status and notes (a cable has no name; an internal bridge has no details); site and node name, location and description; rack name, location, rack type and description. Names follow the plan commands' rules (1–100 characters, a port label 1–64; equipment unique in Installed, nodes within their site, racks within their node, port labels on their switch, all ignoring case: 409). One change-log row is written per changed field, in one transaction; the topology revision does not change, so drafts stay current. Same values answer an empty list."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DirectFix'}
      responses:
        '200':
          description: The change-log rows written, in field order
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items: {$ref: '#/components/schemas/ChangeLogEntry'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /change-log:
    get:
      operationId: getChangeLog
      summary: An installed object's direct fixes, newest first
      parameters:
        - in: query
          name: entityKind
          required: true
          schema: {type: string, enum: [equipment, endpoint, link, site, node, rack]}
        - in: query
          name: entityId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Newest first; empty when the object has none
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ChangeLogEntry'}
        '400': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
components:
  parameters:
    SitePathID:
      in: path
      name: siteId
      required: true
      schema: {type: string}
    Context:
      in: query
      name: context
      schema: {type: string, enum: [installed, planned], default: installed}
    PlanID:
      in: query
      name: planId
      description: Required for context=planned; forbidden for installed context.
      schema: {type: string}
    PlanPathID:
      in: path
      name: id
      required: true
      schema: {type: string}
  responses:
    Error:
      description: 400 malformed request or unknown field; 404 missing plan, site, or network, or unknown installed object or kind; 409 stale revision or duplicate network or object name; 422 invalid domain operation, node of another site, bad coordinates, bad network name, or a topology field in a direct fix; 500 persistence failure; 503 unhealthy database.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
  schemas:
    DirectFix:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, description: The display name; a switch port's label for an endpoint.}
        details: {$ref: '#/components/schemas/Details'}
        note: {type: string, maxLength: 500}
    ChangeLogEntry:
      type: object
      required: [id, at, entityKind, entityId, field, oldValue, newValue]
      properties:
        id: {type: integer}
        at: {type: string, format: date-time}
        entityKind: {type: string, enum: [equipment, endpoint, link, site, node, rack]}
        entityId: {type: string}
        field: {type: string, description: '"name" or a detail field name.'}
        oldValue: {type: string}
        newValue: {type: string, description: Empty when the field was cleared.}
        note: {type: string}
    Details:
      type: object
      additionalProperties: false
      description: "The `details` payload of a command: any subset of the optional detail fields, trimmed. An empty string clears a field. An unknown field name is 400; a field that does not apply to the object (rackType on equipment, portType on a rack, cable fields on a port) is 422 in names, as are invalid values: 'EDGE-30: status must be active, inactive or maintenance, not \"broken\"', 'sn-0042 is already the serial number of AGG-03'. The fields are descriptive data: a port's state never changes a trace."
      properties:
        manufacturer: {type: string, maxLength: 200, description: Equipment.}
        model: {type: string, maxLength: 200, description: Equipment.}
        serialNumber: {type: string, maxLength: 200, description: "Equipment. Unique among filled values, ignoring case, in Installed and in a plan's proposed topology."}
        ipAddress: {type: string, maxLength: 200, description: "Equipment. IPv4 or IPv6; not unique."}
        status: {type: string, enum: [active, inactive, maintenance, testing, ''], description: "Equipment (active, inactive, maintenance) or cable (active, inactive, testing)."}
        description: {type: string, maxLength: 1000, description: "Equipment, port, site, node or rack."}
        portType: {type: string, enum: [copper, fiber, ''], description: Port.}
        connector: {type: string, maxLength: 200, description: "Port. Free text; RJ45, LC, SC, ST, SFP, SFP+ and QSFP are suggestions."}
        speed: {type: string, maxLength: 200, description: "Port. Free text such as 10G."}
        state: {type: string, enum: [available, reserved, disabled, faulty, ''], description: Port.}
        label: {type: string, maxLength: 200, description: Cable.}
        notes: {type: string, maxLength: 1000, description: Cable.}
        location: {type: string, maxLength: 200, description: "Site, node or rack."}
        rackType: {type: string, enum: [standard, wall-mount, open-frame, ''], description: Rack.}
    DetailUpdate:
      type: object
      required: [id, details]
      description: One update_details change of a draft (several updates to one object are one change, update_details:<id>).
      properties:
        id: {type: string}
        details: {$ref: '#/components/schemas/Details'}
    Rename:
      type: object
      required: [id, name]
      description: The name of one piece of equipment the plan adds, in the proposed topology (rename_equipment).
      properties:
        id: {type: string}
        name: {type: string, minLength: 1, maxLength: 100}
    Site:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        location: {type: string, maxLength: 200}
        description: {type: string, maxLength: 1000}
    LocationNode:
      type: object
      description: Physical room or network location, not a canvas node.
      required: [id, name, siteId]
      properties:
        id: {type: string}
        name: {type: string}
        siteId: {type: string}
        location: {type: string, maxLength: 200}
        description: {type: string, maxLength: 1000}
    Plan:
      type: object
      required: [id, name, baseRevision, revision, status, equipment, subpanels, endpoints, links]
      properties:
        id: {type: string}
        name: {type: string}
        baseRevision: {type: string}
        revision: {type: string, pattern: '^[1-9][0-9]*$'}
        status:
          type: string
          enum: [draft, recorded]
          description: A recorded plan is read-only; it stays listed as the record of the change.
        recordedAt: {type: string, format: date-time, description: Present only when recorded.}
        recordNote: {type: string, description: Present only when recorded.}
        recordedBy: {type: string, description: Present only when recorded.}
        labels:
          type: object
          additionalProperties: {type: string}
          description: "Names of the objects the plan touches, by ID: equipment, racks, nodes and sites by name, an endpoint as \"Equipment · label\", a removed cable as \"A ↔ B\". Commands fill it; a record adds what Installed lost. It lets a draft or a recorded plan read in names after its objects are gone from Installed. Absent (empty) on plans saved before labels."
        equipment:
          type: array
          items: {$ref: '#/components/schemas/Equipment'}
        sites:
          type: array
          description: Proposed sites. Omitted when empty. Containers are added before equipment.
          items: {$ref: '#/components/schemas/Site'}
        nodes:
          type: array
          description: Proposed physical nodes. Omitted when empty.
          items: {$ref: '#/components/schemas/LocationNode'}
        racks:
          type: array
          description: Proposed racks. Omitted when empty.
          items: {$ref: '#/components/schemas/Rack'}
        placements:
          type: array
          description: Moves of installed equipment, by IDs only (a later rename of the equipment cannot invalidate the draft). Proposed equipment is moved in the equipment additions array. Omitted when empty.
          items: {$ref: '#/components/schemas/Placement'}
        removals:
          $ref: '#/components/schemas/Removals'
        updates:
          type: array
          deprecated: true
          description: Legacy, read-only. Plans saved before placements carry full equipment entries here; each is read as a placement (only rackId and unit count). The API never writes new entries; the next command folds them into placements and returns an empty list.
          items: {$ref: '#/components/schemas/Equipment'}
        subpanels:
          type: array
          description: Proposed HDF subpanels. Plans saved before subpanels existed have no such key and are read as an empty list; an overlay containing an HDF chassis without its complete grid is never served.
          items: {$ref: '#/components/schemas/Subpanel'}
        endpoints:
          type: array
          items: {$ref: '#/components/schemas/Endpoint'}
        links:
          type: array
          items: {$ref: '#/components/schemas/Link'}
        details:
          type: array
          description: update_details changes on objects the plan adds, one entry per object, layered over the additions (undo with remove_change update_details:<id>). The additions' own details are inside the equipment, cable, site, node and rack entries. Omitted when empty.
          items: {$ref: '#/components/schemas/DetailUpdate'}
        renames:
          type: array
          description: rename_equipment changes on equipment the plan adds, one entry per equipment, holding its proposed name (undo with remove_change rename_equipment:<id>). The equipment entry keeps the name it was added with. Omitted when empty.
          items: {$ref: '#/components/schemas/Rename'}
    HDFInput:
      type: object
      additionalProperties: false
      required: [name, rackId, unit, height, rows]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        rackId: {type: string}
        unit: {type: integer, minimum: 1, maximum: 100, description: Starting rack unit.}
        height: {type: integer, minimum: 1, maximum: 100, description: Chassis height in rack units. Independent of rows.}
        rows:
          type: integer
          minimum: 1
          maximum: 32
          description: Grid rows (columns A-D in each). Creates the chassis, 4N subpanels, 24N positions as 48N side endpoints, and 24N internal bridges in one atomic revision (at most 128 / 768 / 1,536).
        details: {$ref: '#/components/schemas/Details', description: Details of the HDF itself.}
    EquipmentInput:
      type: object
      additionalProperties: false
      required: [name, kind, role, rackId, unit, height]
      description: A switch needs portCount or portGroups (not both unless portCount equals their total); a panel needs portCount.
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {type: string, enum: [switch, panel]}
        role:
          type: string
          enum: [access, aggregation, backbone, passive]
          description: Switches allow access, aggregation, or backbone; panels require passive.
        networkId:
          type: string
          description: Required for switches and must reference an existing network. Rejected for panels, which are shared passive equipment.
        rackId: {type: string}
        unit: {type: integer, minimum: 1, maximum: 100}
        height: {type: integer, minimum: 1, maximum: 100}
        portCount:
          type: integer
          minimum: 1
          maximum: 96
          description: "Switch ports (1–96) or panel positions (1–48; each creates front/rear endpoints and one internal bridge). A switch made this way has one port group, \"Port {n}\". Leave it out when portGroups is given, or give their total."
        portGroups:
          type: array
          minItems: 1
          maxItems: 8
          description: "Switches only: 1–8 groups of ports (such as 24 × Gi1/0/{n} copper and 4 × Te1/1/{n} fiber), 1–96 ports in all. Ports get position 1…N in group order and portGroup 1…G; endpoint IDs stay <equipment>:p<n>. Labels are 1–64 characters and unique on the switch ignoring case. Refusals are 422 in names, e.g. 'SW-NEW: port group 2: Names must contain {n} once'."
          items: {$ref: '#/components/schemas/PortGroupInput'}
        details: {$ref: '#/components/schemas/Details'}
    PortGroupInput:
      type: object
      additionalProperties: false
      description: "One group of a switch's ports: either Count ports named by Names (a pattern with exactly one {n}, numbered from Start) or the Labels as they are (Duplicate sends them this way, because a label is display text and is never parsed back into a pattern). Details are the portType, connector and speed every port of the group starts with."
      properties:
        count: {type: integer, minimum: 1, description: With names.}
        names: {type: string, description: "With count: a pattern with exactly one {n}, e.g. Gi1/0/{n}."}
        start: {type: integer, minimum: 0, default: 1, description: With names. First number.}
        labels:
          type: array
          minItems: 1
          items: {type: string, minLength: 1, maxLength: 64}
          description: Instead of count and names.
        details:
          type: object
          additionalProperties: false
          properties:
            portType: {type: string, enum: [copper, fiber]}
            connector: {type: string, maxLength: 200}
            speed: {type: string, maxLength: 200}
    BatchItem:
      type: object
      additionalProperties: false
      required: [type]
      description: One command inside a batch, with exactly the payload its type needs (the same payloads as the single commands) and no expectedRevision.
      properties:
        type: {enum: [add_equipment, add_hdf, add_cable, move_equipment, add_site, add_node, add_rack, update_details, rename_equipment, delete_equipment, disconnect_cable, delete_rack, delete_node, delete_site]}
        details: {$ref: '#/components/schemas/Details', description: With target, for update_details only.}
        name: {type: string, description: 'With target, for rename_equipment only.'}
        equipment: {$ref: '#/components/schemas/EquipmentInput'}
        hdf: {$ref: '#/components/schemas/HDFInput'}
        cable:
          type: object
          additionalProperties: false
          required: [a, b]
          properties:
            a: {type: string}
            b: {type: string}
            details: {$ref: '#/components/schemas/Details'}
        placement: {$ref: '#/components/schemas/Placement'}
        site:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: {type: string, minLength: 1, maxLength: 100}
            details: {$ref: '#/components/schemas/Details'}
        node:
          type: object
          additionalProperties: false
          required: [siteId, name]
          properties:
            siteId: {type: string}
            name: {type: string, minLength: 1, maxLength: 100}
            details: {$ref: '#/components/schemas/Details'}
        rack:
          type: object
          additionalProperties: false
          required: [nodeId, name, units]
          properties:
            nodeId: {type: string}
            name: {type: string, minLength: 1, maxLength: 100}
            units: {type: integer, minimum: 1, maximum: 60}
            details: {$ref: '#/components/schemas/Details'}
        target:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: {type: string}
    BatchResult:
      type: object
      required: [plan, ids]
      properties:
        plan: {$ref: '#/components/schemas/Plan'}
        ids:
          type: array
          description: One entry per command, in command order - the ID the server allocated for a command that creates something (add_equipment, add_hdf, add_cable, add_site, add_node, add_rack), and "" for the others.
          items: {type: string}
    RemoveChangeResult:
      type: object
      required: [plan, removed]
      properties:
        plan: {$ref: '#/components/schemas/Plan'}
        removed:
          type: array
          description: Keys removed, the requested one first, then what depended on it.
          items: {type: string}
    PlanConflict:
      type: object
      required: [change, reason]
      properties:
        change: {type: string, description: '"<kind>:<id>" of the change, e.g. place_equipment:panel-a, add_cable:cable-7, remove_rack:rack-a03, add_equipment:edge-18.'}
        reason: {type: string}
    Placement:
      type: object
      additionalProperties: false
      required: [equipmentId, rackId, unit]
      properties:
        equipmentId: {type: string}
        rackId: {type: string}
        unit: {type: integer, minimum: 1, maximum: 100}
    Removals:
      type: object
      description: Installed objects the plan removes. Removing equipment also removes its endpoints, bridges, subpanels and every cable on them. A rack, node or site is removed only when empty after the plan. Removing something the plan itself added deletes the addition and records nothing here.
      properties:
        equipment: {type: array, items: {type: string}}
        links: {type: array, description: "Cable IDs. Bridges go only with their equipment.", items: {type: string}}
        racks: {type: array, items: {type: string}}
        nodes: {type: array, items: {type: string}}
        sites: {type: array, items: {type: string}}
    PlanCommand:
      description: Exactly one payload per command, the one its type names. Every command needs expectedRevision (the draft revision). Malformed bodies and unknown fields are 400, a stale revision is 409, an invalid change is 422 and persists nothing.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, expectedRevision, equipment]
          properties:
            type: {const: add_equipment}
            expectedRevision: {type: string, minLength: 1}
            equipment: {$ref: '#/components/schemas/EquipmentInput'}
        - type: object
          additionalProperties: false
          required: [type, expectedRevision, hdf]
          properties:
            type: {const: add_hdf}
            expectedRevision: {type: string, minLength: 1}
            hdf: {$ref: '#/components/schemas/HDFInput'}
        - type: object
          additionalProperties: false
          description: "422 when an endpoint does not exist, when both ends are the same endpoint, when both ends are on the same equipment (\"PANEL-A · 5 · Front and PANEL-A · 5 · Rear are on the same equipment\"), or when an end is already cabled (\"AGG-03 · Port 1 is already cabled (cable-a04)\"); the reason is in names, and inside a batch it follows \"command N (add_cable): \"."
          required: [type, expectedRevision, cable]
          properties:
            type: {const: add_cable}
            expectedRevision: {type: string, minLength: 1}
            cable:
              type: object
              additionalProperties: false
              required: [a, b]
              properties:
                a: {type: string}
                b: {type: string}
                details: {$ref: '#/components/schemas/Details'}
        - type: object
          additionalProperties: false
          required: [type, expectedRevision, placement]
          properties:
            type: {const: move_equipment}
            expectedRevision: {type: string, minLength: 1}
            placement:
              type: object
              additionalProperties: false
              required: [equipmentId, rackId, unit]
              properties:
                equipmentId: {type: string}
                rackId: {type: string}
                unit: {type: integer, minimum: 1, maximum: 100}
        - type: object
          additionalProperties: false
          required: [type, expectedRevision, site]
          properties:
            type: {const: add_site}
            expectedRevision: {type: string, minLength: 1}
            site:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100, description: "Trimmed; unique among sites ignoring case."}
                details: {$ref: '#/components/schemas/Details'}
        - type: object
          additionalProperties: false
          required: [type, expectedRevision, node]
          properties:
            type: {const: add_node}
            expectedRevision: {type: string, minLength: 1}
            node:
              type: object
              additionalProperties: false
              required: [siteId, name]
              properties:
                siteId: {type: string, description: An existing or proposed site.}
                name: {type: string, minLength: 1, maxLength: 100, description: "Trimmed; unique within the site ignoring case."}
                details: {$ref: '#/components/schemas/Details'}
        - type: object
          additionalProperties: false
          required: [type, expectedRevision, rack]
          properties:
            type: {const: add_rack}
            expectedRevision: {type: string, minLength: 1}
            rack:
              type: object
              additionalProperties: false
              required: [nodeId, name, units]
              properties:
                nodeId: {type: string, description: An existing or proposed node.}
                name: {type: string, minLength: 1, maxLength: 100, description: "Trimmed; unique within the node ignoring case."}
                units: {type: integer, minimum: 1, maximum: 60}
                details: {$ref: '#/components/schemas/Details'}
        - type: object
          additionalProperties: false
          required: [type, expectedRevision, target, details]
          description: "Sets or clears details of an object the plan adds (equipment, a proposed equipment's ports, cables, sites, nodes, racks); an empty string clears a field. An installed object is 422 'Installed details are changed with a direct fix (M5b step 12), not in a plan'; a bridge carries none; an unknown ID is 422. Its change key is update_details:<id>; remove_change undoes it, removing the object drops it, and it is allowed in a batch (on an object created before the batch). Every other command carries its details inside its own payload; a top-level details on them is 422."
          properties:
            type: {const: update_details}
            expectedRevision: {type: string, minLength: 1}
            target:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: {type: string}
            details: {$ref: '#/components/schemas/Details'}
        - type: object
          additionalProperties: false
          required: [type, expectedRevision, target, name]
          description: "Renames equipment the plan adds (a switch, panel or HDF). The name follows the add_equipment rules: trimmed, 1–100 characters, unique ignoring case among all equipment of the proposed topology. Refused with 422 in words: installed equipment ('Installed equipment is renamed with a direct fix, not in a plan'), an unknown ID or a target that is not equipment ('cannot rename unknown equipment <id>'), a taken name ('equipment name already exists in this topology'), and the name it already has, ignoring case ('<name> is already called <current>'). One entry per equipment: renaming again replaces it, and renaming back to the name it was added with removes it. Its change key is rename_equipment:<id>; remove_change undoes it, deleting the equipment or removing its addition drops it, Check names it when the name is taken after Update draft, and it is allowed in a batch. A top-level name on any other command is 422."
          properties:
            type: {const: rename_equipment}
            expectedRevision: {type: string, minLength: 1}
            target:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: {type: string}
            name: {type: string}
        - type: object
          additionalProperties: false
          required: [type, expectedRevision, batch]
          description: "Applies 1–500 commands in order, all or nothing, with one revision bump, one expectedRevision and nothing persisted on failure. Each inner command is one of add_equipment, add_hdf, add_cable, move_equipment, add_site, add_node, add_rack, update_details, rename_equipment, delete_equipment, disconnect_cable, delete_rack, delete_node, delete_site, without its own expectedRevision; batch itself (no nesting) and remove_change are refused. Each command is checked against the draft as the earlier commands left it, so later commands see their effect (a unit freed by a delete can be used). A command cannot refer to an object created earlier in the same batch: the IDs are allocated by the server and are only known from the response. 422 names the failing command by its 1-based position and the reason in names, for example: command 7 (add_cable): HDF-02 · 2B/3 rear is already cabled (cable-a04). Empty or more than 500 commands is 422; a stale revision or a recorded plan is 409. The response is {plan, ids}."
          properties:
            type: {const: batch}
            expectedRevision: {type: string, minLength: 1}
            batch:
              type: object
              additionalProperties: false
              required: [commands]
              properties:
                commands:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: {$ref: '#/components/schemas/BatchItem'}
        - type: object
          additionalProperties: false
          required: [type, expectedRevision, change]
          description: Removes one change of the draft and the changes that depend on it. The one command a stale draft accepts (it can only shrink the draft); on a current draft the result must still apply (422 otherwise). An unknown key is 404. The response is {plan, removed}, not a bare plan.
          properties:
            type: {const: remove_change}
            expectedRevision: {type: string, minLength: 1}
            change:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key:
                  type: string
                  description: "The \"<kind>:<id>\" key a conflict or the summary names: add_site, add_node, add_rack, add_equipment, place_equipment, add_cable, update_details, rename_equipment, remove_equipment, remove_cable, remove_rack, remove_node, remove_site. Dependents removed with it - add_equipment:X also its cables (add_cable) and placement; add_rack:R also the plan's equipment in R and placements into R; add_node:N its racks; add_site:S its nodes. Every other key removes only itself (undoing a removal restores the object)."
        - type: object
          additionalProperties: false
          required: [type, expectedRevision, target]
          description: delete_equipment removes the equipment with its endpoints, bridges, subpanels and every cable on them (the draft's own cables on it are dropped). disconnect_cable removes one cable; bridges (internal links) are refused. delete_rack, delete_node and delete_site are refused unless the object is empty after the draft, with the reason in the error. Deleting something the draft itself added deletes the addition.
          properties:
            type: {enum: [delete_equipment, disconnect_cable, delete_rack, delete_node, delete_site]}
            expectedRevision: {type: string, minLength: 1}
            target:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: {type: string, description: "Equipment ID, cable ID, or rack, node or site ID according to type."}
    Rack:
      type: object
      required: [id, name, units, nodeId]
      properties:
        id: {type: string}
        name: {type: string}
        units: {type: integer, minimum: 1}
        nodeId: {type: string}
        location: {type: string, maxLength: 200}
        rackType: {type: string, enum: [standard, wall-mount, open-frame]}
        description: {type: string, maxLength: 1000}
    Equipment:
      type: object
      required: [id, name, kind, role, rackId, unit, height]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [switch, panel, hdf]}
        role: {type: string, enum: [access, aggregation, backbone, passive]}
        networkId:
          type: string
          description: Present exactly for switches (one network each); omitted for passive panels.
        rackId: {type: string}
        unit: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        manufacturer: {type: string, maxLength: 200}
        model: {type: string, maxLength: 200}
        serialNumber: {type: string, maxLength: 200}
        ipAddress: {type: string, maxLength: 200}
        status: {type: string, enum: [active, inactive, maintenance]}
        description: {type: string, maxLength: 1000}
    Endpoint:
      type: object
      required: [id, equipmentId, label]
      properties:
        id: {type: string}
        equipmentId: {type: string}
        label: {type: string}
        subpanelId:
          type: string
          description: Stable ID of the owning HDF subpanel. Present exactly for HDF endpoints; omitted for switch ports and standard panels. Labels are display text and are never parsed.
        position:
          type: integer
          minimum: 1
          description: "HDF and panels: the local position (numbering restarts in every HDF subpanel, 1-6; standard panels number positions on the chassis). Switches: the order of the port, 1…N in port group order; absent on ports saved before port groups, which are ordered by the number in their label. Only `side` tells a panel position from a switch port."
        portGroup: {type: integer, minimum: 1, description: "Switches: the 1-based port group. Absent on ports saved before port groups."}
        side: {type: string, enum: [front, rear]}
        portType: {type: string, enum: [copper, fiber]}
        connector: {type: string, maxLength: 200}
        speed: {type: string, maxLength: 200}
        state: {type: string, enum: [available, reserved, disabled, faulty], description: "Data only: a faulty or disabled port still carries continuity, and no trace changes."}
        description: {type: string, maxLength: 1000}
    Link:
      type: object
      required: [id, a, b, kind]
      properties:
        id: {type: string}
        a: {type: string}
        b: {type: string}
        kind: {type: string, enum: [cable, internal]}
        label: {type: string, maxLength: 200, description: Cables only; a bridge carries none.}
        status: {type: string, enum: [active, inactive, testing], description: Cables only.}
        notes: {type: string, maxLength: 1000, description: Cables only.}
    Network:
      type: object
      description: Created and renamed through /networks; snapshots list networks in creation order (existing ones in ID order).
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    NetworkName:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 64, description: 'Trimmed, 1–64 characters, unique ignoring case.'}
    NodePosition:
      type: object
      required: [nodeId, x, y]
      properties:
        nodeId: {type: string}
        x: {type: number}
        y: {type: number}
    SiteLayout:
      type: object
      required: [siteId, positions]
      properties:
        siteId: {type: string}
        positions:
          type: array
          items: {$ref: '#/components/schemas/NodePosition'}
    Subpanel:
      type: object
      description: One row/column block of an HDF chassis. An N-row HDF has 4N subpanels with six positions each (24N positions, 48N side endpoints) and one internal bridge per position.
      required: [id, equipmentId, row, column]
      properties:
        id: {type: string}
        equipmentId: {type: string, description: Owning equipment of kind hdf.}
        row: {type: integer, minimum: 1, maximum: 32}
        column: {type: string, enum: [A, B, C, D]}
    Snapshot:
      type: object
      required: [context, revision, site, room, networks, subpanels, sites, nodes, racks, equipment, endpoints, links]
      properties:
        networks:
          type: array
          items: {$ref: '#/components/schemas/Network'}
        subpanels:
          type: array
          items: {$ref: '#/components/schemas/Subpanel'}
        context: {type: string, enum: [installed, planned]}
        revision: {type: string}
        site: {type: string}
        room: {type: string}
        sites:
          type: array
          items: {$ref: '#/components/schemas/Site'}
        nodes:
          type: array
          items: {$ref: '#/components/schemas/LocationNode'}
        racks:
          type: array
          items: {$ref: '#/components/schemas/Rack'}
        equipment:
          type: array
          items: {$ref: '#/components/schemas/Equipment'}
        endpoints:
          type: array
          items: {$ref: '#/components/schemas/Endpoint'}
        links:
          type: array
          items: {$ref: '#/components/schemas/Link'}
    Hop:
      type: object
      required: [linkId, from, to, kind]
      properties:
        linkId: {type: string}
        from: {type: string}
        to: {type: string}
        kind: {type: string, enum: [cable, internal]}
    Route:
      type: object
      description: One physical route, or (in `mismatches`) one reached destination on another network.
      required: [start, end, hops]
      properties:
        start: {type: string, description: Exact starting endpoint ID.}
        end: {type: string, description: Exact destination endpoint ID.}
        hops:
          type: array
          description: Ordered cable and internal-bridge hops from `start`; a panel start counts its own bridge.
          items: {$ref: '#/components/schemas/Hop'}
        destinationEquipmentId: {type: string, description: Distribution mode only.}
        destinationRole:
          type: string
          enum: [aggregation, backbone]
          description: Distribution mode only. The destination's actual role; BB is never relabeled AGG.
        destinationNetworkId: {type: string, description: Distribution mode only. The destination device's own network.}
        sourceNetworkId:
          type: string
          description: Distribution mode only. Omitted when the source network is unresolved.
    StartOutcome:
      type: object
      required: [endpoint, outcome]
      properties:
        endpoint: {type: string}
        outcome:
          type: string
          description: |
            `reached`: at least one route. `mismatch`: only destinations on another network. `no_destination`: connected, but the circuit ends at a non-destination endpoint or a passive dead end. `disconnected`: the circuit has no external cable. `unresolved_network`: a passive start whose source network cannot be resolved (results are still returned).
          enum: [reached, mismatch, no_destination, disconnected, unresolved_network]
    TraceResult:
      type: object
      required: [context, revision, mode, status, reason, routes, mismatches, starts, truncated]
      properties:
        context: {type: string, enum: [installed, planned]}
        revision: {type: string}
        mode: {type: string, enum: [point_to_point, distribution]}
        status: {type: string, enum: [reached, unreachable]}
        reason: {type: string}
        routes:
          type: array
          description: Routes in the source network, AGG before BB.
          items: {$ref: '#/components/schemas/Route'}
        mismatches:
          type: array
          description: Reached AGG/BB endpoints on another network. Always present; empty for point-to-point.
          items: {$ref: '#/components/schemas/Route'}
        starts:
          type: array
          description: One entry per searched endpoint (distribution mode); empty for point-to-point.
          items: {$ref: '#/components/schemas/StartOutcome'}
        truncated:
          type: boolean
          description: True only when routes or mismatches were dropped at the 1,000-result limit.
