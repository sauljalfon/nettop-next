<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens copied from frontend/src/shared/theme.css (D33). In the app the inventory adds no colours of its own. */
:root {
  --floor: #eef1f3; --paper: #ffffff; --paper-sunk: #f6f8f9; --ink: #1c2b3a; --ink-soft: #56636f;
  --rule: #d3dae1; --rule-soft: #e6ebef; --rule-strong: #b6c1cc; --ink-hover: #2b3d50;
  --proposed: #8a6100; --proposed-soft: #fff6dd; --danger: #b4361f; --unresolved: #9bacc0;
  --scrim: #1c2b3a66; --shadow-drawer: 0 18px 40px -18px #1c2b3a40, 0 2px 6px #1c2b3a12; --shadow-pop: 0 10px 30px -10px #1c2b3a80;
  --sans: 'IBM Plex Sans', 'IBM Plex Sans Hebrew', 'Segoe UI', Arial, sans-serif; --mono: 'IBM Plex Mono', Consolas, ui-monospace, monospace;
  --t-xs: 12px; --t-sm: 13px; --t-md: 14px; --t-lg: 16px; --t-xl: 20px; --t-2xl: 26px;
  --r-drawer: 10px; --r-control: 6px; --h-control: 32px; --h-input: 34px;
  --row-h: 34px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--floor); color: var(--ink); font-family: var(--sans); font-size: var(--t-md); line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-weight: 600; }
bdi { unicode-bidi: isolate; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { flex: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--h-control); padding: 0 12px; border-radius: var(--r-control); font-size: var(--t-sm); font-weight: 500; border: 1px solid var(--rule); background: var(--paper); white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--rule-strong); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover:not(:disabled) { background: var(--ink-hover); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink); padding-inline: 8px; }
.btn.quiet:hover:not(:disabled) { background: var(--paper-sunk); }
.btn.danger-outline { color: var(--danger); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); font-size: var(--t-xs); white-space: nowrap; }
.chip.role { background: var(--paper-sunk); }
.chip.proposed { border: 1.5px dashed var(--proposed); background: var(--proposed-soft); color: var(--proposed); font-weight: 600; height: 20px; padding: 0 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }

/* App shell, as today */
.studio-header { height: 52px; background: var(--paper); border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 18px; padding: 0 18px; position: relative; z-index: 60; }
.brand { display: flex; align-items: center; gap: 8px; font-size: var(--t-lg); font-weight: 600; letter-spacing: -.02em; }
.seg { display: inline-flex; align-items: center; border: 1px solid var(--rule); border-radius: var(--r-control); padding: 2px; background: var(--paper-sunk); }
.seg button { display: flex; align-items: center; gap: 7px; border: 0; background: transparent; color: var(--ink-soft); padding: 5px 12px; font-size: var(--t-sm); border-radius: 4px; }
.seg .active { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: 0 0 0 1px var(--rule); }
.view-switch { margin-left: auto; }
.network-select { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); color: var(--ink-soft); }
.network-select select { width: 170px; height: 30px; border: 1px solid var(--rule); border-radius: var(--r-control); background: var(--paper); padding: 0 8px; font-size: var(--t-sm); color: var(--ink); }
.header-action { display: flex; align-items: center; gap: 8px; height: var(--h-control); border: 0; background: transparent; color: var(--ink-soft); padding: 0 8px; border-radius: var(--r-control); font-size: var(--t-sm); font-weight: 500; }
.header-action:hover { color: var(--ink); background: var(--paper-sunk); }
.env { font-size: var(--t-xs); font-weight: 600; color: #7a5200; border: 1px solid #ecd49a; background: #fdf3dc; padding: 1px 6px; border-radius: 4px; }
.tool-rail { position: absolute; left: 17px; top: 76px; padding: 4px; border: 1px solid var(--rule); background: var(--paper); border-radius: var(--r-drawer); display: flex; flex-direction: column; gap: 2px; z-index: 65; }
.tool-rail button { border: 0; background: transparent; width: 56px; height: 54px; border-radius: var(--r-control); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink-soft); font-size: var(--t-xs); }
.tool-rail button:hover { background: var(--paper-sunk); color: var(--ink); }

/* The inventory page */
.inv-page { position: absolute; top: 52px; left: 91px; right: 0; bottom: 0; padding: 18px 24px 14px 8px; display: flex; flex-direction: column; min-width: 0; }
.drawer-right .inv-page { padding-right: 433px; } /* D34: an open drawer keeps the page clear */
.demo-strip { display: flex; gap: 10px; align-items: center; font-size: var(--t-sm); color: var(--ink-soft); background: var(--paper); border: 1px dashed var(--rule-strong); border-radius: var(--r-control); padding: 6px 10px; margin-bottom: 12px; }
.demo-strip b { color: var(--ink); font-weight: 600; }
.demo-strip .x { margin-left: auto; }
.crumb { display: flex; gap: 6px; align-items: center; font-size: var(--t-sm); color: var(--ink-soft); }
.link { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; font-weight: 500; text-align: start; }
.link:hover { text-decoration-color: var(--ink); }
.title { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 14px; }
.title h1 { font-size: var(--t-2xl); letter-spacing: -.01em; }
.title .sub { font-size: var(--t-sm); color: var(--ink-soft); display: inline-flex; gap: 8px; align-items: center; }
.inv-wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 16px; }
.inv-menu { align-self: start; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r-drawer); padding: 8px; }
.inv-menu h3 { font-size: var(--t-xs); color: var(--ink-soft); font-weight: 500; padding: 4px 8px 6px; }
.inv-menu button { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 7px 8px; border-radius: var(--r-control); font-size: var(--t-sm); color: var(--ink); text-align: start; }
.inv-menu button:hover { background: var(--paper-sunk); }
.inv-menu button[aria-current='page'] { background: var(--ink); color: var(--paper); }
.inv-menu button[aria-current='page'] svg { color: var(--paper); }
.inv-menu .count { margin-left: auto; font-family: var(--mono); font-size: var(--t-xs); opacity: .8; }
.inv-main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r-drawer); }
.cmdbar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--rule-soft); }
.cmdbar .sep { width: 1px; height: 20px; background: var(--rule); margin: 0 6px; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px 4px; }
.search { display: flex; align-items: center; gap: 6px; height: var(--h-control); border: 1px solid var(--rule); border-radius: var(--r-control); padding: 0 8px; width: 240px; color: var(--ink-soft); }
.search:focus-within { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.search input { border: 0; outline: 0; min-width: 0; flex: 1; height: 100%; font-size: var(--t-sm); color: var(--ink); background: none; }
.pill-wrap { position: relative; }
.pill { height: 26px; border: 1px solid var(--rule); background: var(--paper-sunk); border-radius: 999px; padding: 0 10px; font-size: var(--t-xs); color: var(--ink-soft); display: inline-flex; align-items: center; gap: 4px; }
.pill b { font-family: var(--mono); font-weight: 500; }
.pill.on { background: var(--paper); border-color: var(--ink); color: var(--ink); font-weight: 500; }
.pill .v { color: var(--ink); }
.pop { position: absolute; z-index: 30; top: 32px; left: 0; width: 260px; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r-drawer); box-shadow: var(--shadow-pop); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.pop .row { display: flex; gap: 8px; }
.pop .op { display: flex; justify-content: space-between; font-size: var(--t-sm); color: var(--ink-soft); border: 1px solid var(--rule-soft); border-radius: var(--r-control); padding: 4px 8px; }
.pop .lbl { font-size: var(--t-xs); color: var(--ink-soft); }
.pop .vsearch { height: 30px; border: 1px solid var(--rule); border-radius: var(--r-control); padding: 0 8px; font-size: var(--t-sm); }
.checks { max-height: 220px; overflow: auto; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--rule-soft); padding-top: 6px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: var(--t-sm); padding: 3px 2px; }
.checks input { accent-color: var(--ink); margin: 0; }
.meta { display: flex; align-items: center; gap: 10px; padding: 6px 12px 8px; font-size: var(--t-sm); color: var(--ink-soft); }
.meta b { color: var(--ink); font-weight: 600; }
.meta select { height: 28px; border: 1px solid var(--rule); border-radius: var(--r-control); background: var(--paper); font-size: var(--t-sm); padding: 0 6px; }
.scroll { flex: 1; min-height: 0; overflow: auto; border-top: 1px solid var(--rule-soft); position: relative; }
table { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: var(--t-sm); }
th { position: sticky; top: 0; z-index: 2; background: var(--paper-sunk); text-align: start; font-weight: 500; color: var(--ink-soft); border-bottom: 1px solid var(--rule); height: 34px; padding: 0 8px; white-space: nowrap; }
th button { border: 0; background: none; padding: 0; display: inline-flex; gap: 4px; align-items: center; color: inherit; font-weight: 500; font-size: var(--t-sm); }
th[aria-sort='ascending'] button, th[aria-sort='descending'] button { color: var(--ink); }
.sorti { font-size: var(--t-xs); color: var(--rule-strong); }
th[aria-sort='ascending'] .sorti, th[aria-sort='descending'] .sorti { color: var(--ink); }
td { height: var(--row-h); padding: 0 8px; border-bottom: 1px solid var(--rule-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td.ck, th.ck { width: 36px; padding: 0 0 0 12px; }
td.ck input, th.ck input { accent-color: var(--ink); margin: 0; }
td.more, th.more { width: 40px; padding: 0 4px; text-align: center; }
tr.sel td { background: #e9edf1; }
tr.sel td.ck { box-shadow: inset 3px 0 0 var(--ink); }
tbody tr:not(.grp):hover td { background: var(--paper-sunk); }
tr.sel:hover td { background: #e2e7ec; }
tr.grp td { background: var(--paper); font-weight: 500; color: var(--ink); }
.grp-btn { border: 0; background: none; display: inline-flex; gap: 8px; align-items: center; padding: 0; font-weight: 600; font-size: var(--t-sm); }
.grp-btn .n { color: var(--ink-soft); font-weight: 400; }
.nm { display: inline-flex; gap: 6px; align-items: center; max-width: 100%; min-width: 0; color: var(--ink-soft); }
.nm .link { overflow: hidden; text-overflow: ellipsis; }
.dim { color: var(--ink-soft); }
.st { display: inline-flex; gap: 6px; align-items: center; }
.st.bad { color: var(--danger); font-weight: 500; }
.net { display: inline-flex; gap: 6px; align-items: center; }
.more-btn { width: 28px; height: 26px; border: 1px solid transparent; background: none; border-radius: var(--r-control); color: var(--ink-soft); font-weight: 600; letter-spacing: 1px; }
.more-btn:hover, .more-btn[aria-expanded='true'] { border-color: var(--rule); background: var(--paper); color: var(--ink); }
.empty { padding: 40px 12px; text-align: center; color: var(--ink-soft); }
.pager { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--rule-soft); font-size: var(--t-sm); color: var(--ink-soft); }
.pager .note { margin-left: auto; font-size: var(--t-xs); }
.menu { position: fixed; z-index: 80; min-width: 210px; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r-drawer); box-shadow: var(--shadow-pop); padding: 4px; display: flex; flex-direction: column; }
.menu button { display: flex; gap: 10px; align-items: center; border: 0; background: none; padding: 7px 10px; border-radius: var(--r-control); font-size: var(--t-sm); text-align: start; }
.menu button:hover { background: var(--paper-sunk); }
.menu button.danger { color: var(--danger); }
.menu hr { border: 0; border-top: 1px solid var(--rule-soft); margin: 4px 0; }

/* Side panes and the inspector */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 90; }
.pane { position: fixed; z-index: 91; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100vw; background: var(--paper); border-left: 1px solid var(--rule); box-shadow: var(--shadow-drawer); display: flex; flex-direction: column; }
.pane-h { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--rule-soft); }
.pane-h h2 { font-size: var(--t-xl); }
.pane-b { flex: 1; overflow: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; font-size: var(--t-sm); }
.pane-f { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--rule-soft); }
.pane .checks { max-height: none; border: 0; }
.pane textarea { width: 100%; height: 260px; font-family: var(--mono); font-size: var(--t-xs); border: 1px solid var(--rule); border-radius: var(--r-control); padding: 8px; resize: vertical; white-space: pre; }
.x { width: 30px; height: 30px; border: 0; background: none; border-radius: var(--r-control); font-size: 18px; color: var(--ink-soft); }
.x:hover { background: var(--paper-sunk); color: var(--ink); }
.drawer { position: absolute; z-index: 70; top: 68px; right: 17px; bottom: 17px; width: 400px; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r-drawer); box-shadow: var(--shadow-drawer); display: flex; flex-direction: column; }
.drawer .pane-b { gap: 14px; }
.insp-title { display: flex; flex-direction: column; gap: 6px; }
.insp-title h2 { font-size: var(--t-xl); display: flex; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.place { color: var(--ink-soft); font-size: var(--t-sm); }
.place .sep { white-space: pre; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.facts { display: grid; grid-template-columns: 130px 1fr; gap: 6px 10px; }
.facts dt { color: var(--ink-soft); }
.facts dd { margin: 0; }
.callout { border: 1px solid var(--rule); background: var(--paper-sunk); border-radius: var(--r-control); padding: 8px 10px; color: var(--ink-soft); }
.toast { position: fixed; z-index: 99; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: var(--r-control); box-shadow: var(--shadow-pop); font-size: var(--t-sm); max-width: min(560px, calc(100vw - 32px)); }

@media (max-width: 900px) {
  .inv-page { left: 0; padding: 12px 16px; }
  .tool-rail, .network-select span, .header-action span { display: none; }
  .inv-wrap { grid-template-columns: 1fr; }
  .inv-menu { display: flex; gap: 4px; overflow-x: auto; }
  .inv-menu h3 { display: none; }
  .inv-menu button { width: auto; white-space: nowrap; }
  .drawer-right .inv-page { padding-right: 16px; }
  .drawer { left: 16px; right: 16px; width: auto; }
}
</style>
</head>
<body>
<div id="app" class="studio"></div>

  'pop-toggle': function (d) { var p = state.pop, i = p.vals.indexOf(d.v); if (i >= 0) p.vals.splice(i, 1); else p.vals.push(d.v); },
  'pop-all': function () { var p = state.pop, all = options(p.k).map(function (o) { return o.raw; }); p.vals = p.vals.length === all.length ? [] : all; },
  'pop-apply': function () {
    var p = state.pop, n = options(p.k).length;
    state.inv.f[p.k] = p.vals.length === 0 || p.vals.length === n ? [] : p.vals.slice();
    if (p.k === 'net') state.netChoice = state.inv.f.net.length === 1 ? state.inv.f.net[0] : '';
    state.pop = null; state.inv.page = 1;
  },
  'pop-cancel': function () { state.pop = null; },
  sel: function (d) { state.inv.sel[d.v] = !state.inv.sel[d.v]; if (!state.inv.sel[d.v]) delete state.inv.sel[d.v]; },
  selall: function () { var inv = state.inv, keys = pageKeys(), all = keys.every(function (k) { return inv.sel[k]; }); keys.forEach(function (k) { if (all) delete inv.sel[k]; else inv.sel[k] = true; }); },
  collapse: function (d) { state.inv.collapsed[d.v] = !state.inv.collapsed[d.v]; },
  menu: function (d, el) { state.menu = state.menu && state.menu.key === d.v ? null : { key: d.v, rect: el.getBoundingClientRect() }; state.pop = null; },
  open: function (d) { var t = target(d.v); DO.open(t); state.menu = null; },
  row: function (d) { var r = selectedRows()[0]; if (!r) return; DO[d.v === 'open' ? 'open' : d.v](target(r.key)); },
  do: function (d) { DO[d.v](target(d.k)); state.menu = null; },
  'open-inv': function (d) { openInv(d.v); },
  'close-insp': function () { state.insp = null; state.inspAt = null; }
};
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el) {
    var changed = false;
    if (state.menu && !ev.target.closest('#menu')) { state.menu = null; changed = true; }
    if (state.pop && !ev.target.closest('.pop')) { state.pop = null; changed = true; }
    if (changed) render();
    return;
  }
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { /* the change event handles it */ }
  var f = ACT[el.dataset.act]; if (!f) return;
  if (state.pop && !el.closest('.pop') && el.dataset.act !== 'pop') state.pop = null;
  f(el.dataset, el);
  if (el.dataset.act === 'menu' || el.dataset.act === 'sel' || el.dataset.act === 'collapse') { if (el.dataset.act === 'menu') { drawRows(); } else { var top = document.getElementById('scroll') && document.getElementById('scroll').scrollTop; render(); var sc = document.getElementById('scroll'); if (sc && top) { sc.scrollTop = top; drawRows(); } } return; }
  render();
});
var qTimer;
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'q') { var v = ev.target.value; clearTimeout(qTimer); qTimer = setTimeout(function () { state.inv.q = v; state.inv.page = 1; state._focusQ = true; render(); }, 150); }
  if (ev.target.id === 'vsearch') { state.pop.q = ev.target.value; state._focusV = true; render(); }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'grp') { state.inv.group = ev.target.value; state.inv.page = 1; state.inv.collapsed = {}; render(); }
  if (ev.target.id === 'netsel') { state.netChoice = ev.target.value; applyHeaderNet(); state.inv.page = 1; render(); }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Escape') return;
  if (state.menu) state.menu = null; else if (state.pop) state.pop = null; else if (state.pane) state.pane = null; else if (state.insp) { state.insp = null; state.inspAt = null; } else return;
  render();
});
addEventListener('resize', function () { if (state.menu) { state.menu = null; } drawRows(); });
render();
</script>
