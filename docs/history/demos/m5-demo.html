<title>Net-Top M5 Editing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: app shell (header, demo strip, tool rail | main | right drawer), the same light look as the app and the M4 demo. Single light theme on purpose: the app has no dark mode. */
:root {
  --bg: #f2f5f8; --surface: #ffffff; --ink: #26344b; --ink-2: #3d4a60; --muted: #5f6b80; --faint: #9aa6b8;
  --line: #e1e7ee; --line-2: #d5dde7; --accent: #2f6fdb; --brand: #6454c6; --teal: #108b79;
  --prop-ink: #8a5a00; --prop-bg: #fbefd2; --prop-line: #d9a441;
  --warn-ink: #6b4a00; --warn-bg: #fff6e5; --warn-line: #f1d9a6;
  --danger: #b42318; --danger-bg: #fdf0ef; --danger-line: #f0c7c3;
  --ok-ink: #0b6b5d; --ok-bg: #dff3ee;
  --rack: #1f2735; --rack-2: #2b3445;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 3px solid #a99bed; outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); }
.app { min-height: 100vh; display: flex; flex-direction: column; }

/* Header */
.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand strong { font-size: 18px; letter-spacing: -0.01em; }
.brand strong span { color: var(--brand); }
.brand small { color: var(--muted); font-size: 12px; }
.seg { display: flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { padding: 7px 12px; border: 0; background: var(--surface); font-weight: 600; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.nets { display: flex; gap: 6px; flex-wrap: wrap; }
.net-chip { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); font-size: 12px; font-weight: 600; }
.net-chip.on { background: var(--c); border-color: var(--c); color: #fff; }
.ctx { display: flex; align-items: center; gap: 8px; }
.ctx select { padding: 6px 8px; border: 1px solid var(--prop-line); border-radius: 8px; background: var(--prop-bg); color: var(--prop-ink); font-weight: 600; font-size: 13px; }
.top .spacer { flex: 1; }
.count { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--brand); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }

/* Demo strip */
.demo-strip { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; padding: 7px 16px; background: #eef0fb; border-bottom: 1px solid #dcdff3; font-size: 12px; color: #464a74; }
.demo-strip strong { letter-spacing: .06em; font-size: 11px; }
.demo-strip .tour { display: flex; gap: 6px; flex-wrap: wrap; }
.demo-strip button { padding: 3px 9px; border-radius: 999px; border: 1px solid #c9cdee; background: #fff; font-size: 12px; color: #3b3f6b; }
.demo-strip button:hover { border-color: var(--brand); }
.demo-strip .sim { border-color: var(--warn-line); background: var(--warn-bg); color: var(--warn-ink); }

/* Body */
.body { flex: 1; display: flex; position: relative; min-height: 0; }
.rail { width: 64px; flex: none; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; }
.rail button { width: 52px; padding: 8px 0 6px; border: 1px solid transparent; border-radius: 10px; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--ink-2); }
.rail button[aria-expanded="true"] { background: #efecfb; border-color: #d9d3f5; color: var(--brand); }
main { flex: 1; min-width: 0; padding: 18px 22px 48px; }
.drawer-r { width: 410px; flex: none; background: var(--surface); border-left: 1px solid var(--line); min-width: 0; }
.drawer-l { position: absolute; left: 64px; top: 0; bottom: 0; width: min(330px, calc(100% - 64px)); background: var(--surface); border-right: 1px solid var(--line); box-shadow: 8px 0 24px rgba(38,52,75,.10); z-index: 5; overflow-y: auto; }
.dh { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.dh h2 { margin: 0; font-size: 16px; }
.dh p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.x { border: 0; background: none; font-size: 20px; line-height: 1; padding: 2px 8px; color: var(--muted); }
.db { padding: 14px 16px 24px; display: grid; gap: 14px; }
@media (max-width: 960px) {
  .drawer-r { position: absolute; right: 0; top: 0; bottom: 0; width: min(410px, 100%); z-index: 6; box-shadow: -8px 0 24px rgba(38,52,75,.14); overflow-y: auto; }
  main { padding: 16px 16px 48px; }
}

/* Buttons and small pieces */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); font-weight: 600; font-size: 13px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost-danger { color: var(--danger); border-color: var(--danger-line); }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn.block { width: 100%; justify-content: center; }
.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; text-align: left; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.eyebrow { display: flex; gap: 6px; align-items: center; font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.tag-proposed { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--prop-ink); background: var(--prop-bg); border-radius: 4px; padding: 1px 6px; }
.tag-recorded { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--ok-ink); background: var(--ok-bg); border-radius: 4px; padding: 1px 6px; }
.tag-new { font-size: 10px; font-weight: 700; letter-spacing: .05em; color: #5b4bb7; border: 1px dashed #a99bed; border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.badge-net { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--c); color: var(--c); font-size: 11px; font-weight: 600; background: var(--surface); white-space: nowrap; }
.chip-state { padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.chip-state.available, .chip-state.active { background: var(--ok-bg); color: var(--ok-ink); }
.chip-state.reserved, .chip-state.maintenance, .chip-state.testing { background: var(--prop-bg); color: var(--prop-ink); }
.chip-state.disabled, .chip-state.inactive { background: #eceff3; color: #5f6b80; }
.chip-state.faulty { background: var(--danger-bg); color: var(--danger); }
.hint { font-size: 12px; color: var(--muted); }
.plan-banner { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; margin-bottom: 14px; border: 1px dashed var(--prop-line); background: #fffaf0; border-radius: 10px; font-size: 13px; color: var(--warn-ink); }

/* Forms, confirms, notices */
.form { display: grid; gap: 10px; }
.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
.f input, .f select, .f textarea, .search { border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 9px; background: var(--surface); color: var(--ink); font-size: 13px; min-width: 0; width: 100%; }
.f textarea { min-height: 70px; resize: vertical; }
.f2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.err { color: var(--danger); font-size: 12px; font-weight: 500; }
.confirm { border: 1px solid var(--danger-line); background: var(--danger-bg); border-radius: 10px; padding: 12px; display: grid; gap: 8px; font-size: 13px; color: var(--ink); }
.confirm ul { margin: 0; padding-left: 18px; }
.confirm .cut { font-size: 12px; color: var(--ink-2); }
.notice { border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 10px; padding: 12px; display: grid; gap: 8px; font-size: 13px; color: var(--warn-ink); }
.notice.info { border-color: #e2def5; background: #f8f6fc; color: #4f4a6e; }
.section-label { font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin: 0; }

/* Physical */
.crumbs { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.crumbs nav { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 15px; }
.crumbs nav .sep { color: var(--faint); }
.crumbs nav .link { font-weight: 500; padding: 2px 3px; }
.crumbs nav b { padding: 2px 3px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; display: grid; gap: 4px; box-shadow: 0 1px 2px rgba(38,52,75,.05); }
.card.proposed { border: 1.5px dashed var(--prop-line); background: #fffdf8; }
.card-main { border: 0; background: none; text-align: left; padding: 12px 12px 6px; display: grid; gap: 4px; border-radius: 10px; }
.card-main:hover { background: #f7f9fc; }
.card-title { font-size: 18px; font-weight: 700; }
.card-meta { color: var(--ink-2); font-size: 13px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.card-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 0 12px 10px; }
.card.adder { border: 1.5px dashed var(--line-2); background: transparent; box-shadow: none; padding: 14px; }
.adder-btn { border: 0; background: none; min-height: 110px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-weight: 600; border-radius: 10px; }
.adder-btn:hover { background: var(--surface); color: var(--accent); }
.mini { display: grid; gap: 1px; background: var(--rack-2); padding: 5px; border-radius: 6px; margin: 6px 0 2px; }
.mini span { border-radius: 2px; font-size: 9px; font-weight: 700; padding: 0 5px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
.layout-rack { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.elev { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 6px; background: var(--rack); padding: 12px; border-radius: 10px; width: 420px; max-width: 100%; }
.unum { color: #8a97ab; font-family: var(--mono); font-size: 11px; display: flex; align-items: center; justify-content: flex-end; grid-column: 1; }
.slot { grid-column: 2; border: 1px dashed #3a4558; border-radius: 4px; color: #6b7890; font-size: 11px; display: flex; align-items: center; padding-left: 8px; }
.req { grid-column: 2; border-radius: 5px; border: 1px solid #c7d2e0; background: #e8eefb; display: flex; flex-direction: column; justify-content: center; padding: 0 10px; text-align: left; color: var(--ink); }
.req.proposed { border: 2px dashed var(--prop-line); background: #fdf6e7; }
.req.sel { box-shadow: 0 0 0 3px #e3a21a; }
.req small { font-size: 11px; color: var(--ink-2); }
.eq-layout { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.face { background: #f6f8fb; border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; display: grid; gap: 6px; }
.face .prow { display: flex; gap: 5px; }
.port { width: 34px; height: 30px; flex: none; border-radius: 5px; border: 1px solid #b8c4d3; background-color: #fff; font: 600 11px var(--mono); padding: 0; }
.port.sel { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink); }
.port.muted { opacity: .35; }
.st-reserved { background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(180,110,9,.45) 4px 6px); }
.st-disabled { background-image: repeating-linear-gradient(90deg, transparent 0 5px, rgba(95,107,128,.45) 5px 6px); }
.st-faulty { background-image: repeating-linear-gradient(-45deg, transparent 0 3px, rgba(180,35,24,.6) 3px 5px); }
.hdf-grid { display: grid; grid-template-columns: 22px repeat(4, minmax(104px, 1fr)); gap: 8px; min-width: 470px; }
.blk { border: 1px solid var(--line); border-radius: 8px; padding: 6px; background: var(--surface); }
.blk .port { width: 100%; height: 24px; }
.blk-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #b8c4d3; display: inline-block; background-color: #fff; }
.detail { flex: 1 1 280px; max-width: 360px; display: grid; gap: 0; }
.detail .sec { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; display: grid; gap: 6px; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 10px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pick-list { display: grid; gap: 2px; max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
.pick-list button { border: 0; background: none; text-align: left; padding: 6px 8px; border-radius: 6px; font-size: 13px; }
.pick-list button:hover, .pick-list button[aria-selected="true"] { background: #eef3fd; }
.stale-card { max-width: 620px; margin: 40px auto; }

/* Inspector */
.insp-head { display: grid; gap: 8px; padding: 16px; border-bottom: 1px solid var(--line); }
.insp-head h2 { margin: 0; font-size: 22px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 12px; }
.tabs button { border: 0; background: none; padding: 9px 10px; font-weight: 600; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.hist li { border-top: 1px dashed var(--line); padding: 8px 0; font-size: 13px; display: grid; gap: 2px; }
.hist li:first-child { border-top: 0; }
.hist time { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.hist .chg { color: var(--ink-2); }
.hist del { color: var(--danger); text-decoration: line-through; }
.hist ins { color: var(--ok-ink); text-decoration: none; font-weight: 600; }

/* Tables */
.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); max-height: 560px; }
table.t { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 7px 10px; border-bottom: 1px solid var(--line); background: #f8fafc; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
.t th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; display: inline-flex; gap: 4px; align-items: center; }
.t td { padding: 6px 10px; border-bottom: 1px solid #eef2f6; white-space: nowrap; }
.t tr:hover td { background: #f7f9fc; }
.t tr.proposed td { background: #fffaf0; }
.t .acts { display: flex; gap: 4px; }

/* Changes drawer */
.plan-row { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.plan-row .top-line { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grp h3 { margin: 6px 0 4px; font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.chg-row { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; border-top: 1px dashed var(--line); font-size: 13px; }
.chg-row .what { flex: 1; min-width: 0; }
.chg-row .why { display: block; font-size: 12px; color: var(--danger); }
.review-list { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; }
.callout { font-weight: 700; color: var(--ink); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 30; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(38,52,75,.25); font-size: 13px; }
.csv { width: 100%; min-height: 160px; font: 12px/1.5 var(--mono); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px; background: #fbfcfe; }
.conc-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
.conc-col h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.conc-card { width: 100%; text-align: left; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); padding: 10px 12px; display: grid; gap: 4px; margin-bottom: 10px; }
.conc-card.proposed { border-style: dashed; border-color: var(--prop-line); }
.conc-card.sel { box-shadow: 0 0 0 3px #b8a9e466; border-color: var(--brand); }
.conc-card.muted { opacity: .4; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out; } @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } } }

/* Inventory: portal-style resource list (own tokens; light only, like the app) */
main.flush { padding: 0; }
.az { --az-blue: #0078d4; --az-blue-h: #106ebe; --az-ink: #323130; --az-ink-2: #605e5c; --az-line: #edebe9; --az-line-2: #e1dfdd; --az-hover: #f3f2f1; --az-sel: #deecf9; --az-bg: #faf9f8; --az-input: #8a8886;
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', sans-serif; font-size: 13px; color: var(--az-ink); background: #fff; min-height: calc(100vh - 100px); }
.az .az-link { border: 0; background: none; padding: 0; color: var(--az-blue); font: inherit; cursor: pointer; text-align: left; }
.az .az-link:hover { color: var(--az-blue-h); text-decoration: underline; }
.az-crumb { display: flex; gap: 8px; align-items: center; padding: 12px 24px 0; font-size: 12px; color: var(--az-ink-2); }
.az-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 2px 24px 14px; }
.az-title h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.az-sub { color: var(--az-ink-2); font-size: 12px; }
.az-wrap { display: flex; flex-wrap: wrap; border-top: 1px solid var(--az-line); }
.az-menu { flex: 1 1 200px; max-width: 220px; border-right: 1px solid var(--az-line); padding: 6px 0 16px; }
.az-menu h3 { margin: 12px 16px 4px; font-size: 12px; font-weight: 600; color: var(--az-ink-2); }
.az-menu button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 8px 16px; font: inherit; color: var(--az-ink); text-align: left; cursor: pointer; }
.az-menu button:hover { background: var(--az-hover); }
.az-menu button[aria-current="page"] { background: var(--az-line); font-weight: 600; }
.az-menu .num { margin-left: auto; color: var(--az-ink-2); font-size: 12px; font-weight: 400; }
.az-main { flex: 999 1 560px; min-width: 0; padding-bottom: 24px; }
.az-cmd { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; padding: 4px 16px; min-height: 44px; border-bottom: 1px solid var(--az-line); }
.az-cmd button { display: inline-flex; align-items: center; gap: 6px; height: 32px; border: 0; background: none; padding: 0 8px; font: inherit; color: var(--az-ink); border-radius: 2px; cursor: pointer; }
.az-cmd button:hover:not(:disabled) { background: var(--az-hover); }
.az-cmd button:disabled { opacity: .4; }
.az-cmd .sepv { width: 1px; height: 20px; background: var(--az-line-2); margin: 0 6px; }
.az-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 16px 4px; }
.az-search { display: flex; align-items: center; gap: 6px; height: 32px; width: 260px; max-width: 100%; padding: 0 8px; border: 1px solid var(--az-input); border-radius: 2px; background: #fff; }
.az-search:focus-within { border-color: var(--az-blue); box-shadow: inset 0 0 0 1px var(--az-blue); }
.az-search input { border: 0; outline: 0; flex: 1; min-width: 0; font: inherit; color: var(--az-ink); background: none; }
.az-pill-wrap { position: relative; }
.az-pill { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 12px; border: 1px solid transparent; border-radius: 14px; background: var(--az-hover); font: inherit; color: var(--az-ink); cursor: pointer; }

  'go-rack': function (d) { var S = current().S, r = find(S.racks, d.id); if (!r) return; var n = find(S.nodes, r.nodeId); go({ level: 'rack', site: n.siteId, node: n.id, rack: r.id }); },
  'open-eq': function (d) { openEq(current().S, d.id); state.side = 'front'; },
  'open-ep': function (d) { var S = current().S, p = parseEp(d.k); if (!find(S.eq, p.eq)) return; openEq(S, p.eq, d.k); },
  side: function (d) { state.side = d.v; var L = state.loc; if (L.ep && parseEp(L.ep).side) { var want = d.v === 'rear' ? 'r' : 'f'; if (parseEp(L.ep).side !== want) L.ep = mirror(L.ep); } },
  inspect: function (d) { state.insp = d.id; state.drawer = null; state.inspTab = 'overview'; state.form = null; state.confirm = null; },
  'insp-close': function () { state.insp = null; state.form = null; state.confirm = null; },
  'insp-tab': function (d) { state.inspTab = d.v; state.form = null; },
  'show-phys': function (d) { var S = current().S; if (find(S.eq, d.id)) openEq(S, d.id); },
  'show-map': function (d) { state.view = 'conceptual'; state.insp = d.id; state.drawer = null; state.inspTab = 'overview'; },
  'open-inv': function (d) { state.view = 'inventory'; state.inv.tab = 'ports'; state.inv.f = { eq: d.id }; state.inv.q = ''; state.csv = false; },
  'confirm-cancel': function () { state.confirm = null; },
  'del-eq-ask': function (d) { state.confirm = { kind: 'del-eq', id: d.id, where: d.where }; },
  'del-eq-do': function (d) { var cur = current(); var msg = planDeleteEq(d.id, cur.S); state.confirm = null; if (state.insp === d.id) state.insp = null; toast(msg); },
  'disc-ask': function (d) { state.confirm = { kind: 'disc', id: d.id, where: d.where }; },
  'disc-do': function (d) { var msg = planDisconnect(d.id, current().S); state.confirm = null; toast(msg); },
  'connect-open': function (d) { state.connect = { k: d.k, q: '', pick: null }; },
  'connect-pick': function (d) { state.connect.pick = d.k; state.connect.err = ''; },
  'connect-cancel': function () { state.connect = null; },
  'connect-do': function () {
    var cn = state.connect, S = current().S; if (!cn || !cn.pick) return;
    var id = 'C-' + (++seq), net = netOf(S, cn.k) || netOf(S, cn.pick) || (function () { var x = walk(S, cn.k) || walk(S, cn.pick); return x ? eqOf(S, x).net : null; })();
    var err = tryAdd({ t: 'add_cable', c: { id: id, a: cn.k, b: cn.pick, net: net, label: '', status: 'active' } });
    if (err) { cn.err = err; return; }
    state.connect = null; toast('Cable ' + id + ' connects ' + epLabel(cn.k) + ' to ' + epLabel(cn.pick) + ' in this plan');
  },
  'add-form': function (d) { state.form = { kind: 'add-' + d.kind, parent: d.parent, name: '', units: '42', error: '' }; state.confirm = null; },
  'form-cancel': function () { state.form = null; },
  'add-do': function () {
    var f = state.form, name = (f.name || '').trim(), kind = f.kind.slice(4), id = kind + '-' + (++seq), ch;
    if (!name || name.length > 100) { f.error = 'Enter a name of 1–100 characters.'; return; }
    if (kind === 'site') ch = { t: 'add_site', site: { id: id, name: name } };
    else if (kind === 'node') ch = { t: 'add_node', node: { id: id, name: name, siteId: f.parent } };
    else { var u = parseInt(f.units, 10); if (!(u >= 1 && u <= 60)) { f.error = 'A rack has 1–60 units.'; return; } ch = { t: 'add_rack', r: { id: id, name: name, nodeId: f.parent, units: u } }; }
    var err = tryAdd(ch); if (err) { f.error = err; return; }
    reg(id, name); state.form = null; toast(name + ' is added to the plan');
  },
  'del-container-ask': function (d) { state.confirm = { kind: 'del-container', id: d.id }; },
  'del-container-do': function (d) { var msg = planDeleteContainer(d.kind, d.id); state.confirm = null; toast(msg.charAt(0) === '!' ? msg.slice(1) : msg); },
  'hdf-form': function () { var S = current().S, L = state.loc; state.form = { kind: 'hdf', name: 'HDF-03', rows: '4', h: '3', rack: L.rack || 'sm01', unit: '1', error: '' }; },
  'hdf-do': function () {
    var f = state.form, rows = parseInt(f.rows, 10), h = parseInt(f.h, 10), unit = parseInt(f.unit, 10), name = (f.name || '').trim();
    if (!name) { f.error = 'Enter a name.'; return; }
    if (!(rows >= 1 && rows <= 32)) { f.error = 'An HDF has 1–32 rows.'; return; }
    if (!(h >= 1 && h <= 12)) { f.error = 'Height must be 1–12 units.'; return; }
    var id = 'hdf-' + (++seq);
    var err = tryAdd({ t: 'add_eq', eq: { id: id, name: name, kind: 'hdf', role: 'PASSIVE', rack: f.rack, unit: unit, h: h, rows: rows, det: det('', '', '', '') } });
    if (err) { f.error = err; return; }
    reg(id, name); state.form = null; state.left = null;
    var S = current().S; openEq(S, id); toast(name + ' (' + rows + ' rows, ' + rows * 24 + ' positions per side) is added to ' + nm(f.rack) + ' in this plan');
  },
  review: function () { state.review = true; state.note = ''; state.noteErr = ''; },
  'review-cancel': function () { state.review = false; },
  'record-do': function () {
    var p = plan(), note = (state.note || '').trim();
    if (!note) { state.noteErr = 'Add a note: what was done, and by whom if useful.'; return; }
    if (note.length > 500) { state.noteErr = 'Keep the note under 500 characters.'; return; }
    if (isStale(p)) { state.noteErr = 'Installed changed since this draft; update the draft first.'; return; }
    var r = applyChanges(installed, p.changes); if (r.conflicts.length) { state.noteErr = r.conflicts[0].reason; return; }
    var lines = p.changes.map(function (ch) { var d = describe(ch); return d.g + ' · ' + d.text; });
    var touched = []; p.changes.forEach(function (ch) { if (ch.eq) touched.push(ch.eq.id || ch.eq); if (ch.c) { touched.push(parseEp(ch.c.a).eq, parseEp(ch.c.b).eq); } if (ch.eqs) touched = touched.concat(ch.eqs); });
    var S = r.S; delete S.proposed; delete S.moved; S.rev = installed.rev + 1; installed = S;
    p.status = 'recorded';
    recorded.push({ id: p.id, name: p.name, recordedAt: clock(), note: note, lines: lines, touched: touched });
    var n = p.changes.length;
    state.review = false; state.note = ''; state.ctx = 'installed'; state.confirm = null; state.connect = null; state.form = null;
    var others = drafts().length;
    toast('Recorded ' + plural(n, 'change') + ' from “' + p.name + '”. Installed is updated' + (others ? '; ' + plural(others, 'other draft') + ' now need' + (others === 1 ? 's' : '') + ' Update draft' : '') + '.');
  },
  rebase: function () {
    var p = plan(); if (!p) return;
    var r = applyChanges(installed, p.changes);
    if (r.conflicts.length) { state.checked[p.id] = true; state.drawer = 'changes'; state.insp = null; toast(plural(r.conflicts.length, 'change') + ' no longer fit' + (r.conflicts.length === 1 ? 's' : '') + '. The draft is unchanged.'); return; }
    p.base = installed.rev; delete state.checked[p.id]; toast('“' + p.name + '” now sits on the current Installed; all ' + plural(p.changes.length, 'change') + ' still fit.');
  },
  'drop-change': function (d) { var p = plan(); p.changes.splice(+d.i, 1); },
  'undo-change': function (d) { var p = plan(); var ch = p.changes.splice(+d.i, 1)[0]; var extra = settle(p); toast('Undid: ' + describe(ch).text + (extra ? ' (and ' + plural(extra, 'change') + ' that depended on it)' : '')); },
  'open-plan': function (d) { state.planId = d.id; state.ctx = 'planned'; state.review = false; },
  'new-draft': function () { state.newDraft = { name: '' }; },
  'new-draft-cancel': function () { state.newDraft = null; },
  'new-draft-do': function () {
    var nd = state.newDraft, name = (nd.name || '').trim();
    if (!name) { nd.error = 'Enter a name.'; return; }
    var id = 'plan-' + (++seq); plans.push({ id: id, name: name, base: installed.rev, status: 'draft', changes: [] });
    state.newDraft = null; state.planId = id; state.ctx = 'planned'; toast('Draft “' + name + '” created');
  },
  'toggle-recorded': function (d) { state.openRecorded = state.openRecorded === d.id ? null : d.id; },
  'details-edit': function (d) { var e = find(current().S.eq, d.id); state.form = Object.assign({ kind: 'details', id: e.id, name: e.name, note: '', error: '' }, clone(e.det)); },
  'details-save': function () {
    var f = state.form, S = current().S, e = find(S.eq, f.id), name = (f.name || '').trim();
    if (!name) { f.error = 'A name is required.'; return; }
    var serial = (f.serial || '').trim();
    var all = installed.eq.concat(state.ctx === 'planned' && plan() ? plan().changes.filter(function (c) { return c.t === 'add_eq'; }).map(function (c) { return c.eq; }) : []);
    var dup = serial && all.find(function (x) { return x.id !== e.id && x.det.serial === serial; });
    if (dup) { f.error = 'Serial ' + serial + ' is already used by ' + dup.name + '.'; return; }
    var nameDup = all.find(function (x) { return x.id !== e.id && sameName(x.name, name); });
    if (nameDup) { f.error = 'Another equipment is named ' + nameDup.name + '.'; return; }
    if (f.ip && !/^\d{1,3}(\.\d{1,3}){3}$/.test(f.ip.trim())) { f.error = 'Enter an IPv4 address such as 10.10.0.3, or leave it empty.'; return; }
    var fields = [['name', 'Name'], ['manufacturer', 'Manufacturer'], ['model', 'Model'], ['serial', 'Serial number'], ['ip', 'IP address'], ['status', 'Status'], ['description', 'Description']];
    if (state.ctx === 'installed') {
      var target = find(installed.eq, e.id), n = 0, stamp = clock();
      fields.forEach(function (fl) {
        var old = fl[0] === 'name' ? target.name : target.det[fl[0]], now = (f[fl[0]] || '').trim();
        if (old !== now) { n++; changeLog.push({ at: stamp, eq: e.id, target: target.name, field: fl[1], old: old, now: now, note: (f.note || '').trim() }); if (fl[0] === 'name') target.name = now; else target.det[fl[0]] = now; }
      });
      reg(e.id, target.name); state.form = null;
      toast(n ? 'Saved ' + plural(n, 'fix', 'fixes') + ' to ' + target.name + '. Topology unchanged; drafts stay valid.' : 'Nothing changed');
    } else {
      var ch = plan().changes.find(function (c) { return c.t === 'add_eq' && c.eq.id === e.id; });
      ch.eq.name = name; fields.forEach(function (fl) { if (fl[0] !== 'name') ch.eq.det[fl[0]] = (f[fl[0]] || '').trim(); });
      reg(e.id, name); state.form = null; toast('Details of the proposed ' + name + ' are saved in the plan');
    }
  },
  'port-edit': function (d) { var S = current().S, pd = portDet(S, d.k); state.form = { kind: 'port', k: d.k, state: pd.state, speed: pd.speed, description: pd.description, note: '' }; },
  'port-save': function () {
    var f = state.form, k = f.k, S = installed, pd = portDet(S, k), stamp = clock(), n = 0, e = eqOf(S, k);
    [['state', 'Port state'], ['speed', 'Speed'], ['description', 'Description']].forEach(function (fl) {
      var now = (f[fl[0]] || '').trim(); if (pd[fl[0]] !== now) { n++; changeLog.push({ at: stamp, eq: e.id, target: epLabel(k).replace(' · ', ' '), field: fl[1], old: pd[fl[0]], now: now, note: (f.note || '').trim() }); S.ports[k] = Object.assign({}, S.ports[k] || {}); S.ports[k][fl[0]] = now; }
    });
    state.form = null; toast(n ? 'Saved ' + plural(n, 'fix', 'fixes') + ' to ' + epLabel(k) + '. Traces are unchanged.' : 'Nothing changed');
  },
  'inv-tab': function (d) { state.inv.tab = d.v; state.inv.f = {}; state.inv.sort = { key: INV_COLS[d.v][0][0], dir: 1 }; state.csv = false; },
  'inv-sort': function (d) { var s = state.inv.sort; if (s.key === d.v) s.dir = -s.dir; else { s.key = d.v; s.dir = 1; } },
  'inv-clear-eq': function () { delete state.inv.f.eq; },
  'inv-clear': function () { state.inv.f = {}; state.inv.q = ''; },
  csv: function () { state.csv = !state.csv; },
  'csv-copy': function () {
    var ta = document.getElementById('csv-text'); if (!ta) return;
    var done = function () { toast('CSV copied'); render(); };
    try { navigator.clipboard.writeText(ta.value).then(done, function () { ta.select(); toast('Select-all done: press Ctrl+C or ⌘C'); render(); }); } catch (err) { ta.select(); }
    return 'async';
  },
  simulate: function () {
    if (simulated) return;
    var cables = installed.cables.filter(function (c) { return parseEp(c.a).eq === 'panel-a' || parseEp(c.b).eq === 'panel-a'; });
    installed = clone(installed);
    installed.eq = installed.eq.filter(function (e) { return e.id !== 'panel-a'; });
    installed.cables = installed.cables.filter(function (c) { return cables.every(function (x) { return x.id !== c.id; }); });
    installed.rev += 1; simulated = true;
    recorded.push({ id: 'retire-panel-a', name: 'Retire PANEL-A', recordedAt: clock(), note: 'PANEL-A removed during the A03 refit (recorded by a colleague)', lines: ['Removed · PANEL-A with ' + plural(cables.length, 'cable')], touched: ['panel-a', 'edge-17', 'hdf-01'] });
    toast('A colleague recorded “Retire PANEL-A”. Your drafts are now behind Installed.');
  },
  reset: function () { reset(); toast('Demo reset'); },
  tour: function (d) {
    var keep = state.toast; var t = d.v;
    var toPlan = function (id) { var p = plans.find(function (x) { return x.id === id && x.status === 'draft'; }); if (!p) { reset(); } state.ctx = 'planned'; state.planId = id; state.drawer = null; state.left = null; state.insp = null; state.form = null; state.confirm = null; state.connect = null; state.review = false; };
    if (t === '1') { if (simulated) reset(); toPlan('expansion'); state.view = 'physical'; openEq(current().S, 'panel-a'); state.confirm = { kind: 'del-eq', id: 'panel-a', where: 'page' }; }
    if (t === '2') { if (simulated) reset(); toPlan('expansion'); state.view = 'physical'; openEq(current().S, 'edge-17', 'edge-17:2'); }
    if (t === '3') { toPlan('dr-refresh'); if (isStale(plan())) { reset(); toPlan('dr-refresh'); } state.view = 'physical'; state.loc = { level: 'sites' }; state.hist = []; }
    if (t === '4') { if (simulated) reset(); toPlan('expansion'); state.view = 'physical'; var S = current().S; openEq(S, 'hdf-01'); state.loc = { level: 'rack', site: 'main', node: 'north', rack: 'sm01' }; state.left = 'library'; ACT['hdf-form'](); state.form.unit = '8'; }
    if (t === '5') { if (simulated) reset(); toPlan('expansion'); state.view = 'physical'; state.drawer = 'changes'; }
    if (t === '6') { if (!plans.find(function (x) { return x.id === 'expansion' && x.status === 'draft'; })) reset(); if (!simulated) ACT.simulate(); toPlan('expansion'); state.drawer = 'changes'; }
    if (t === '7') { state.ctx = 'installed'; state.view = 'conceptual'; state.insp = 'agg-03'; state.inspTab = 'history'; state.drawer = null; state.form = null; }
    if (t === '8') { state.view = 'inventory'; state.inv = invDefault(); state.insp = null; state.drawer = null; }
    if (keep && t !== '6') state.toast = keep;
  }
};
document.addEventListener('click', function (ev) {
  var inv = state.inv, closed = false;
  if ((inv.menu || inv.pop) && !ev.target.closest('.az-pop,.az-rowmenu,[data-act="az-pop"],[data-act="az-menu"]')) { inv.menu = null; inv.pop = null; closed = true; }
  var el = ev.target.closest('[data-act]'); if (!el || el.disabled) { if (closed) render(); return; }
  var fn = ACT[el.dataset.act]; if (!fn) return;
  ev.preventDefault();
  if (fn(el.dataset) !== 'async') render();
});
document.addEventListener('submit', function (ev) { ev.preventDefault(); var fn = ACT[ev.target.dataset.submit]; if (fn) { fn({}); render(); } });
document.addEventListener('input', function (ev) { var el = ev.target; if (!el.dataset || !el.dataset.bind) return; setPath(el.dataset.bind, el.value); if (el.dataset.live !== undefined) render(); });
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.dataset && el.dataset.change === 'plan') { state.planId = el.value; state.review = false; state.confirm = null; state.connect = null; state.form = null; render(); }
});
installInventoryActions();
reset();
state.view = 'physical';
render();
</script>
