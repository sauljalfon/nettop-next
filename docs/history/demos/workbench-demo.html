<meta charset="utf-8">
<title>Net-Top Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: a docked workbench. Fixed 44px header, 48px rail, the work in the middle,
     one right dock that narrows the work instead of covering it. Paper, steel and ink kept from D33.
     Light only, like the app: every colour is set here. */
  :root {
    --floor: #eef1f3; --paper: #ffffff; --paper-sunk: #f6f8f9; --ink: #1c2b3a; --ink-soft: #56636f;
    --ink-faint: #7a8691; --rule: #d3dae1; --rule-soft: #e6ebef; --ink-hover: #2b3d50;
    --steel: #1f2731; --steel-2: #2a3440; --steel-3: #3a4552; --steel-line: #36414d;
    --steel-ink: #a8b4c0; --steel-ink-strong: #c3ccd6; --tape: #fbfbf8; --tape-ink: #15202b;
    --route: #0f8b7a; --route-soft: #e2f3f0; --amber: #d99a0b; --amber-soft: #fdf3dc;
    --amber-ink: #3a2a00; --proposed: #8a6100; --proposed-soft: #fff6dd; --danger: #b4361f;
    --plan-band: #fbf1d6; --plan-edge: #e8cf8a;
    --net-a: #3b6fd8; --net-b: #8a4fc4;
    --pair: #f6c453; --made: #18a58f;
    --sans: 'IBM Plex Sans', 'IBM Plex Sans Hebrew', 'Segoe UI', Arial, sans-serif;
    --mono: 'IBM Plex Mono', Consolas, ui-monospace, monospace;
    --jack: 22px; --jack-gap: 2px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--floor); color: var(--ink); font: 13px/1.45 var(--sans); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  bdi { unicode-bidi: isolate; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* The page: a demo strip above the app. */
  .page { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
    padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--ink); color: #fff; font-size: 12px; }
  .demo b { font-weight: 600; }
  .demo .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .demo button { height: 26px; padding: 0 10px; border: 1px solid #ffffff40; border-radius: 5px; background: transparent; color: #fff; }
  .demo button[aria-pressed='true'] { background: #fff; color: var(--ink); border-color: #fff; }
  .demo .hint { color: #c9d3dd; min-width: 0; }
  .demo .size { margin-left: auto; color: #c9d3dd; }

  /* The app frame. */
  .app { min-height: 0; display: grid; grid-template-rows: 44px minmax(0, 1fr); background: var(--paper); }
  .top { display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--paper); border-bottom: 1px solid var(--rule); min-width: 0; }
  .app.in-plan .top { background: var(--plan-band); border-bottom-color: var(--plan-edge); }
  .logo { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; }
  .logo svg { width: 18px; height: 18px; }
  .seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--paper-sunk); border: 1px solid var(--rule); border-radius: 6px; }
  .seg button { height: 26px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: var(--ink-soft); white-space: nowrap; }
  .seg button[aria-pressed='true'] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--rule); }
  .top select { height: 30px; border: 1px solid var(--rule); border-radius: 6px; padding: 0 8px; background: var(--paper); max-width: 180px; }
  .spacer { flex: 1; }
  .context { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .context .plan-name { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--amber); color: var(--amber-ink); font-size: 12px; font-weight: 600; }
  .env { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; border: 1px solid #ecd49a; color: #7a5200; background: #fdf3dc; }

  .work { min-height: 0; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; }
  .rail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-right: 1px solid var(--rule); background: var(--paper); }
  .rail button { width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--ink-soft); }
  .rail button:hover { background: var(--paper-sunk); color: var(--ink); }
  .rail button[aria-pressed='true'] { background: var(--ink); color: #fff; }
  .rail svg { width: 18px; height: 18px; }
  .main { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--paper); }

  /* The path of the selected jack: one line of hardware along the bottom of the page.
     Each equipment is a small steel plate with the jacks the path uses; cables are drawn in the network's colour;
     plates in one rack share a band, so the eye sees where the path leaves a rack. */
  .pathbar { border-top: 1px solid var(--rule); background: var(--paper); min-width: 0; }
  .pathbar-head { display: flex; align-items: baseline; gap: 10px; padding: 7px 12px 0 16px; }
  .pathbar-head b { font-weight: 600; } .pathbar-head .sub { color: var(--ink-soft); }
  .pathbar-head button { margin-left: auto; border: 0; background: none; color: var(--ink-soft); font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 4px; }
  .pathbar-head button:hover { background: var(--paper-sunk); color: var(--ink); }
  .pathline { --plate: 84px; --jack-y: 47px; display: flex; align-items: stretch; padding: 4px 16px 12px; overflow-x: auto; }
  .pcell { display: grid; grid-template-rows: 18px var(--plate); flex: none; }
  .pcell.band { background: var(--paper-sunk); }
  .pcell.band.first { border-radius: 8px 0 0 8px; } .pcell.band.last { border-radius: 0 8px 8px 0; } .pcell.band.first.last { border-radius: 8px; }
  .pcell .rack { padding: 2px 8px 0; font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .pcell.node { padding: 0 5px 6px; }
  .pn { display: grid; grid-template-rows: 20px 28px 13px; gap: 6px 0; row-gap: 5px; align-content: start; width: 100%; min-width: 138px; height: var(--plate); padding: 8px 9px; border: 0; border-radius: 5px; background: var(--steel); color: var(--steel-ink); text-align: left; }
  button.pn:hover { background: var(--steel-2); }
  .pn.here { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  .pn-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
  .pn-top .tape { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pn-top .kind { font: 11px/1 var(--mono); color: var(--steel-ink); }
  .pn-top .kind.top { color: #fff; background: var(--route); border-radius: 3px; padding: 2px 5px; font-family: var(--sans); font-weight: 600; }
  .pn-jacks { display: flex; align-items: center; }
  .pn-jacks .pj { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 2px; background: #fff; color: var(--tape-ink); font: 500 11px/1 var(--mono); }
  .pn-jacks .pj.a { background: var(--net-a); color: #fff; } .pn-jacks .pj.b { background: var(--net-b); color: #fff; }
  .pn-jacks .pj.sel { outline: 2px solid #fff; outline-offset: 1px; }
  .pn-jacks .bridge { flex: 1; height: 0; border-top: 2px dotted var(--steel-ink); margin: 0 4px; }
  .pn-jacks .gap { flex: 1; }
  .pn-caps { display: flex; justify-content: space-between; gap: 10px; font: 11px/1 var(--mono); color: var(--steel-ink-strong); white-space: nowrap; }
  .pcell.link { position: relative; width: 66px; }
  .pcell.link::after { content: ''; position: absolute; left: 0; right: 0; top: calc(18px + var(--jack-y)); height: 3px; margin-top: -1.5px; background: var(--net-a); }
  .pcell.link.b::after { background: var(--net-b); }
  .pcell.link .id { position: absolute; left: 50%; top: calc(18px + var(--jack-y) - 24px); transform: translateX(-50%); padding: 1px 5px; border: 1px solid var(--rule); border-radius: 3px; background: var(--paper); font: 11px/1.3 var(--mono); color: var(--ink-soft); white-space: nowrap; }
  .pcell.link.none::after { background: none; border-top: 2px dashed var(--rule); height: 0; }
  .pcell.stub { grid-template-rows: 18px var(--plate); padding: 0 4px; }
  .pcell.stub span { align-self: start; margin-top: calc(var(--jack-y) - 9px); font-size: 12px; color: var(--ink-faint); white-space: nowrap; }

  /* The dock: one panel, tabs, narrows the work. */
  .dock { width: 380px; min-width: 0; min-height: 0; display: grid; grid-template-rows: 40px minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); border-left: 1px solid var(--rule); background: var(--paper); overflow: hidden; }
  .dock-tabs { display: flex; align-items: stretch; gap: 0; padding: 0 4px 0 6px; border-bottom: 1px solid var(--rule); min-width: 0; }
  .dock-tabs button.tab { border: 0; background: transparent; padding: 0 7px; white-space: nowrap; color: var(--ink-soft); border-bottom: 2px solid transparent; }
  .dock-tabs button.tab[aria-selected='true'] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .dock-tabs .x { margin-left: auto; align-self: center; width: 28px; height: 28px; border: 0; border-radius: 5px; background: transparent; color: var(--ink-soft); font-size: 18px; line-height: 1; }
  .dock-tabs .x:hover { background: var(--paper-sunk); }
  .dock-body { min-height: 0; min-width: 0; overflow: auto; padding: 14px 16px 20px; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 14px; }
  .dock h2 { font-size: 16px; margin: 0; font-weight: 600; }
  .dock-head { display: grid; gap: 2px; }
  .dock-note { padding: 8px 10px; border-radius: 6px; background: var(--paper-sunk); color: var(--ink-soft); font-size: 12px; }
  .field { display: grid; gap: 4px; } .field span { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .field select, .field input { height: 30px; border: 1px solid var(--rule); border-radius: 6px; padding: 0 8px; background: var(--paper); }
  .dlist { display: grid; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
  .dlist > * { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; padding: 7px 10px; border: 0; border-top: 1px solid var(--rule-soft); background: var(--paper); text-align: left; }
  .dlist > :first-child { border-top: 0; }
  .dlist > button:hover { background: var(--paper-sunk); }
  .dlist > [aria-pressed='true'] { background: var(--route-soft); box-shadow: inset 3px 0 0 var(--route); }
  .dlist .s { grid-column: 1 / -1; color: var(--ink-soft); font-size: 12px; }
  .dlist .r { color: var(--ink-soft); font-size: 12px; white-space: nowrap; }
  .group-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .lib { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .lib button { display: grid; gap: 1px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); text-align: left; }
  .lib button:hover { border-color: #b6c1cc; background: var(--paper-sunk); }
  .lib button span { color: var(--ink-soft); font-size: 12px; }
  .tree-list { display: grid; gap: 1px; font-size: 13px; }
  .tree-list button { display: flex; gap: 8px; align-items: center; height: 28px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; text-align: left; }
  .tree-list button:hover { background: var(--paper-sunk); }
  .tree-list button .n { margin-left: auto; color: var(--ink-soft); font-size: 12px; }
  .tree-list .l2 { padding-left: 22px; } .tree-list .l3 { padding-left: 36px; }
  .rail .sep { width: 24px; height: 1px; background: var(--rule); margin: 4px 0; }
  .rail button:disabled { opacity: .4; cursor: not-allowed; }
  .sub { color: var(--ink-soft); }
  .path { color: var(--ink-soft); display: inline-flex; flex-wrap: wrap; gap: 0 5px; }
  .path span + span::before { content: '›'; margin-right: 5px; color: var(--ink-faint); }
  .row-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .section-label { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 5px 10px; }
  .kv dt { color: var(--ink-soft); } .kv dd { margin: 0; }

  .btn { height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink); white-space: nowrap; }
  .btn:hover { border-color: #b6c1cc; }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--ink-hover); }
  .btn.primary:disabled { background: #9aa5b0; border-color: #9aa5b0; cursor: not-allowed; }
  .btn:disabled { color: var(--ink-faint); cursor: not-allowed; }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--ink-soft); }
  .btn.quiet:hover { background: var(--paper-sunk); color: var(--ink); }
  .btn.danger { color: var(--danger); }
  .btn.lg { height: 34px; padding: 0 16px; }

  /* A page toolbar: one 44px line, breadcrumb left, actions right. */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-height: 44px; padding: 6px 14px; border-bottom: 1px solid var(--rule); }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; min-width: 0; color: var(--ink-soft); }
  .crumbs button { border: 0; background: none; padding: 2px 4px; border-radius: 4px; color: var(--ink-soft); }
  .crumbs button:hover { background: var(--paper-sunk); color: var(--ink); }
  .crumbs .sep { color: var(--ink-faint); }
  .crumbs .here { color: var(--ink); font-weight: 600; font-size: 15px; padding: 0 2px; }
  .crumbs .nb { font-family: var(--mono); font-size: 12px; }
  .menu-wrap { position: relative; }
  .menu { position: absolute; right: 0; top: 34px; z-index: 20; min-width: 180px; padding: 4px; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 10px 30px -10px #1c2b3a80; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 5px; }
  .menu button:hover { background: var(--paper-sunk); }
  .menu .danger { color: var(--danger); }

  .scroll { min-height: 0; overflow: auto; }
  .equip { padding: 14px 16px 24px; display: grid; gap: 12px; align-content: start; }
  /* The equipment page uses the width: the face, and beside it what is connected to it. */
  .equip.wide { height: 100%; grid-template-rows: auto minmax(0, 1fr); }
  .equip-cols { display: flex; gap: 16px; min-height: 0; align-items: stretch; }
  .equip-cols .face-col { flex: none; min-height: 0; overflow: auto; display: grid; gap: 10px; align-content: start; max-width: 100%; }
  .cables { flex: 1 1 320px; min-width: 300px; max-width: 760px; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); overflow: hidden; }
  .cables.under { max-width: 980px; flex: none; }
  .cables-head { display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 12px; background: var(--paper-sunk); border-bottom: 1px solid var(--rule); }
  .cables-head b { font-weight: 600; } .cables-head span { color: var(--ink-soft); }
  .cables-head input { margin-left: auto; height: 28px; width: 190px; border: 1px solid var(--rule); border-radius: 5px; padding: 0 8px; background: var(--paper); }
  .cables-body { overflow: auto; min-height: 0; }
  .cables table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cables th { position: sticky; top: 0; background: var(--paper); text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-soft); padding: 6px 12px; border-bottom: 1px solid var(--rule); }
  .cables td { padding: 5px 12px; border-top: 1px solid var(--rule-soft); white-space: nowrap; }
  .cables tr[data-jack-row] { cursor: pointer; }
  .cables tr[data-jack-row]:hover td { background: var(--paper-sunk); }
  .cables tr[data-on='true'] td { background: var(--amber-soft); }
  .links { flex: none; width: 300px; align-self: start; max-height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); overflow: hidden; }
  .links.under { width: 300px; }
  .links-head { display: flex; align-items: baseline; gap: 8px; padding: 6px 10px; background: var(--paper-sunk); border-bottom: 1px solid var(--rule); }
  .links-head b { font-weight: 600; } .links-head span { color: var(--ink-soft); font-size: 12px; }
  .links-head button { margin-left: auto; border: 0; background: none; color: var(--ink-soft); text-decoration: underline; padding: 0; font-size: 12px; }
  .links-body { overflow: auto; min-height: 0; }
  .link-row { position: relative; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 10px; border: 0; border-top: 1px solid var(--rule-soft); background: var(--paper); text-align: left; }
  .link-row:first-child { border-top: 0; }
  .link-row:hover { background: var(--paper-sunk); }
  .link-row[aria-pressed='true'] { background: var(--amber-soft); box-shadow: inset 3px 0 0 var(--amber); }
  .link-row .dots { display: flex; gap: 2px; } .link-row .dots i { width: 8px; height: 8px; border-radius: 2px; }
  .link-row .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-row .w { color: var(--ink-soft); font-size: 12px; white-space: nowrap; }
  .link-row .c { font-family: var(--mono); font-weight: 600; min-width: 22px; text-align: right; }
  .link-row .meter { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--ink-faint); }
  .face.picking .jack:not([data-hit='true']) { opacity: 0.28; }
  .face.picking .jack[data-hit='true'] { outline: 2px solid var(--amber); outline-offset: 1px; }
  .cables .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  .cables .where { color: var(--ink-soft); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-soft); }
  .meta b { color: var(--ink); font-weight: 600; }
  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-soft); font-size: 12px; }
  .key i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--rule); }

  /* Faces: steel, compact jacks, sticky row and column labels inside one scroll. */
  .face { display: block; width: max-content; max-width: 100%; background: var(--steel); border-radius: 4px; padding: 0 10px 10px; color: var(--steel-ink); }
  .face-head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0 6px; background: var(--steel); }
  .tape { background: var(--tape); color: var(--tape-ink); font-weight: 600; font-size: 12px; padding: 1px 7px; border-radius: 2px; }
  .face-head .side { font-family: var(--mono); font-size: 11px; color: var(--steel-ink); }
  .hdf { display: grid; grid-template-columns: 22px repeat(4, max-content); gap: 5px 6px; }
  .hdf .colh { position: sticky; top: 36px; z-index: 2; background: var(--steel); text-align: center; font-family: var(--mono); font-size: 11px; color: var(--steel-ink-strong); padding-bottom: 2px; }
  .hdf .rowh { position: sticky; left: 0; z-index: 1; background: var(--steel); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; color: var(--steel-ink-strong); }
  .block { display: grid; grid-template-columns: repeat(3, var(--jack)); gap: var(--jack-gap); padding: 3px; background: var(--steel-2); border: 1px solid var(--steel-line); border-radius: 2px; }
  .ports { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, 30px); grid-auto-columns: 28px; gap: 3px; }
  .ports .jack { width: 28px; height: 30px; }
  .ports .group { display: contents; }
  .ports .gap { width: 8px; grid-row: 1 / span 2; }

  .jack { position: relative; width: var(--jack); height: var(--jack); padding: 0; display: grid; place-items: center; border: 0; border-radius: 2px;
    background: #fff; color: var(--tape-ink); font: 500 11px/1 var(--mono); }
  .jack:hover { outline: 2px solid #ffffffb0; outline-offset: 1px; }
  .jack[data-s='a'] { background: var(--net-a); color: #fff; }
  .jack[data-s='b'] { background: var(--net-b); color: #fff; }
  .jack[data-s='a'], .jack[data-s='b'] { cursor: default; }
  .jack[data-s='pair'] { background: var(--pair); color: var(--amber-ink); }
  .jack[data-s='blocked'] { box-shadow: inset 0 0 0 2px var(--danger); }
  .jack[data-s='made'] { background: #fff; box-shadow: inset 0 0 0 3px var(--made); }
  .jack[data-s='proposed'] { background: #fff; box-shadow: inset 0 0 0 2px var(--amber); }
  .jack[data-sel='true'] { outline: 2px solid #fff; outline-offset: 1px; box-shadow: 0 0 0 4px var(--ink); z-index: 1; }
  .jack[data-next='true']:not([data-sel='true']) { outline: 2px dashed #fff; outline-offset: 1px; }

<script>
(() => {
  // ---------- data shaped like the owner's ----------
  const NET = { a: 'Network A', b: 'Network B' }
  const COLS = ['A', 'B', 'C', 'D']
  const SITE = 'רמלה', CORE = 'ליבה'
  let hash = 7
  const rnd = () => ((hash = (hash * 9301 + 49297) % 233280) / 233280)

  /** An HDF: rows × A–D × 6 positions; `used(row, col, pos)` returns 'a', 'b' or ''. */
  function makeHdf(id, name, rack, rows, used) {
    const jacks = []
    for (let r = 1; r <= rows; r++)
      for (const c of COLS)
        for (let p = 1; p <= 6; p++) jacks.push({ id: `${id}:${r}${c}/${p}`, label: `${r}${c}/${p}`, row: r, col: c, pos: p, s: used(r, c, p) })
    return { id, name, kind: 'hdf', rack, rows, jacks }
  }
  const nearHdf = makeHdf('bb01-hdf02', 'HDF-02', 'BB01', 12, (r, c) =>
    r < 12 ? (rnd() < 0.88 ? (r % 5 === 3 ? 'b' : 'a') : '') : (c === 'A' || c === 'B' ? 'a' : ''))
  const farHdf12 = makeHdf('bb05-hdf02', 'HDF-02 BB05', 'BB05', 12, (r, c, p) =>
    (r === 1 && c === 'D' && p === 3) || (r === 2 && (c === 'A' || (c === 'B' && p !== 1))) || (r === 2 && c === 'B' && p === 1 ? 'b' : '') || (r === 3 && (c === 'A' || c === 'B')) || (r === 5 && c === 'C' && p < 3)
      ? (r === 2 && c === 'B' && p === 1 ? 'b' : 'a') : '')
  const farHdf32 = makeHdf('bb05-hdf04', 'HDF-04 BB05', 'BB05', 32, (r, c) => (r < 6 && c !== 'D' && rnd() < 0.7 ? 'a' : r > 28 && rnd() < 0.5 ? 'b' : ''))
  const sw = { id: 'sw', name: 'SW-B12-03', kind: 'switch', rack: 'R12-1', ports: [] }
  for (let p = 1; p <= 48; p++) sw.ports.push({ id: `sw:${p}`, label: String(p), name: `Gi1/0/${p}`, n: p, g: 0, s: p <= 31 ? 'a' : p === 33 ? 'b' : '' })
  for (let p = 1; p <= 4; p++) sw.ports.push({ id: `sw:te${p}`, label: String(p), name: `Te1/1/${p}`, n: 48 + p, g: 1, s: p <= 2 ? 'a' : '', up: p <= 2 })
  const GROUPS = [{ caption: 'Gi1/0/1–48 · RJ45 · 1G' }, { caption: 'Te1/1/1–4 · SFP+ · 10G' }]

  // ---------- state ----------
  const st = {
    screen: 'tree', plan: true, dock: null, dockTab: 'details', selNode: null, selJack: null,
    keyOpen: false, menu: false, hdfSide: 'Rear',
    // HDF: one size (32px square jacks, owner's choice 2026-11-15); every HDF draws its highest row at the top; Pairs | Pigtails is
    // each person's own choice (remembered in this browser), pigtails stacked in the same square jack.
    jackSize: 32, numbering: 'pairs', ptStyle: 'stacked', fromBottom: true,
    // patching
    mode: 'range', count: 6, nearSel: null, farStart: null, farRows: 12, made: [], skip: false,
    pickerOpen: false, confirmDone: false, stripOpen: true, toast: '',
  }
  const far = () => (st.farRows === 12 ? farHdf12 : farHdf32)
  try {
    if (localStorage.getItem('demo-hdf-numbering') === 'pigtails') st.numbering = 'pigtails'
  } catch {}
  /** A jack's name as the person reads it: "12C/5", or "12C/9,10" with Pigtails on. */
  const jackName = (j) => (j.pos && st.numbering === 'pigtails' ? `${j.row}${j.col}/${2 * j.pos - 1},${2 * j.pos}` : j.label)
  st.nearSel = nearHdf.jacks.find((j) => j.row === 12 && !j.s)?.id ?? null

  const $ = (s, el = document) => el.querySelector(s)
  const h = (html) => html
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  const bdi = (t) => `<bdi>${esc(t)}</bdi>`
  const path = (parts) => `<span class="path">${parts.map((p) => `<span>${bdi(p)}</span>`).join('')}</span>`

  // ---------- frame ----------
  const SCREENS = [
    ['tree', 'Conceptual + dock', 'Part 3, the frame: one dock on the right for everything (Node, Inspector, Trace, Explore, Add, Changes), one tab at a time; the page narrows beside it instead of being covered. Click a node card, then the rail icons on the left. Installed | Plan in the header: in a plan the header is amber and the plan’s name is always shown. Trace: run it and choose a route, the tree beside stays visible.'],
    ['hdf', 'HDF page', 'Click a jack: its whole path is drawn along the bottom, end to end, as the hardware it passes. Beside the face: what this HDF connects to, one line per far equipment with its cable count. Click a line to light those jacks on the face; click it again for all. The highest row is at the top on every HDF; each row keeps its cables. HDF jacks are 32px squares. Pairs | Pigtails next to Front / Rear is each person\'s own choice, remembered in this browser, and Patching follows it. Click a free jack: its details open in the dock.'],
    ['switch', 'Switch 48 + 4', '48 copper ports and the 4 SFP+ uplink ports fit on one line, each group with its caption. ↑ marks the ports that reach an AGG; click a row under the face to select that port.'],

  /** A route's steps, in the same shape as a jack's path (made up for the demo; the app walks the real cables). */
  function routeSteps(r) {
    const J = (text, cap, sel) => ({ text, cap, sel })
    const N = (kind, name, rack, jacks, o = {}) => ({ kind, name, rack, jacks, ...o })
    const net = r.mismatch ? 'b' : 'a'
    const L = (id) => ({ link: id, net })
    const up = r.from.startsWith('Te'), n = up ? +r.from.slice(-1) : +r.from.split('/').pop()
    const pp = up ? 24 + n : n - 24, pos = up ? n : 4, at = up ? `12A/${n}` : r.mismatch ? '7B/3' : '11C/4'
    const start = N('Switch', 'SW-B12-03', 'R12-1', [J(up ? n : n, r.from, true)], { here: true })
    const panel = N('Panel', 'PANEL-B12-01', 'R12-1', [J(pp, 'front'), J(pp, 'rear')])
    const near = N('HDF', 'HDF-02 BB01', 'BB01', [J(pos, `${at} rear`), J(pos, 'front')])
    if (r.mismatch) return [start, L('c-0433'), panel, L('c-0671'), near, L('c-1907'), N('AGG', r.to, 'BB01', [J(3, r.port)], { top: true })]

  // ---------- equipment pages ----------
  function jackHtml(j, opts = {}) {

  function hdfFace(eq, side, decorate) {

  // What each cabled jack reaches (made up for the demo, steady between renders).

  }
  /** What this equipment connects to: one line per far equipment, most cables first. A click lights those jacks. */
  function farMap(items) { const m = new Map(); items.forEach((j, i) => { if (j.s) m.set(j.id, farOf(j, i)) }); return m }
  function connectsTo(items, under) {
    const by = new Map()
    for (const [id, f] of farMap(items)) { const g = by.get(f.eq) ?? { eq: f.eq, rack: f.rack, n: 0, nets: new Set() }; g.n++; g.nets.add(items.find((j) => j.id === id).s); by.set(f.eq, g) }
    const groups = [...by.values()].sort((a, b) => b.n - a.n)
    const total = groups.reduce((n, g) => n + g.n, 0), max = groups[0]?.n ?? 1
    return `<section class="links${under ? ' under' : ''}" aria-label="Connects to"><div class="links-head"><b>Connects to</b><span>${groups.length} · ${total} cables</span>${st.farSel ? '<button type="button" id="far-clear">Show all</button>' : ''}</div>
      <div class="links-body">${groups.map((g) => `<button type="button" class="link-row" data-far="${esc(g.eq)}" aria-pressed="${st.farSel === g.eq}" title="${esc(g.eq)} · ${g.rack} · ${[...g.nets].map((n) => NET[n]).join(', ')} · ${g.n} cables"><span class="dots">${[...g.nets].map((n) => `<i style="background:var(--net-${n})"></i>`).join('')}</span><span class="n">${esc(g.eq)}</span><span class="w">${g.rack}</span><span class="c">${g.n}</span><span class="meter" style="width:${Math.round((g.n / max) * 100)}%"></span></button>`).join('') || '<div class="sub" style="padding:8px 10px">No cables yet.</div>'}</div></section>`
  }
  /** The selected jack's whole path (made up for the demo; the app follows the real cables).
      A node has one jack (a port) or two (a panel or HDF position: the side the cable arrives at, then the other). */
  function pathOf(j) {
    const isHdf = j.id.startsWith('bb01')
    const net = j.s || 'a'
    const J = (text, cap, sel) => ({ text, cap, sel })
    const N = (kind, name, rack, jacks, o = {}) => ({ kind, name, rack, jacks, ...o })
    const L = (id) => ({ link: id, net })
    const NONE = { none: true }
    if (isHdf) {
      const side = st.hdfSide.toLowerCase(), other = side === 'rear' ? 'front' : 'rear'
      const here = (flip) => { const a = J(j.pos, `${jackName(j)} ${side}`, true), b = J(j.pos, other); return N('HDF', nearHdf.name, 'BB01', flip ? [b, a] : [a, b], { here: true }) }
      if (!j.s) return [NONE, here(false), L(`c-${1200 + j.row * 7}`), N('Switch', 'SW-B12-03', 'R12-1', [J(j.row + 2, `Gi1/0/${j.row + 2}`)])]
      const f = farOf(j, nearHdf.jacks.indexOf(j)), port = (j.row * 3 + j.pos) % 48 + 1
      return [
        N('Switch', 'SW-B12-03', 'R12-1', [J(port, `Gi1/0/${port}`)]), L(`c-${700 + j.row}`),
        N('Panel', 'PANEL-B12-01', 'R12-1', [J(j.pos + j.row, 'front'), J(j.pos + j.row, 'rear')]), L(f.cable),
        here(false), L(`c-${1300 + j.row}`),
        N('HDF', 'HDF-02 BB05', 'BB05', [J(j.pos, `${jackName(j)} front`), J(j.pos, 'rear')]), L(`c-${880 + j.pos}`),
        N(j.row % 2 ? 'AGG' : 'BB', j.row % 2 ? 'AGG-01' : 'BB-01', 'BB05', [J(j.pos + 6, `Port ${j.pos + 6}`)], { top: true }),
      ]
    }
    const here = N('Switch', sw.name, 'R12-1', [J(j.label, j.name, true)], { here: true })
    if (!j.s) return [here, NONE]
    if (j.up) return [here, L('c-0412'), N('Panel', 'PANEL-B12-01', 'R12-1', [J(j.n - 24, 'front'), J(j.n - 24, 'rear')]), L('c-0655'), N('HDF', 'HDF-02 BB01', 'BB01', [J(1, '12A/1 rear'), J(1, 'front')]), L('c-1312'), N('HDF', 'HDF-02 BB05', 'BB05', [J(1, '12A/1 front'), J(1, 'rear')]), L('c-0881'), N('AGG', `AGG-0${j.n - 48}`, 'BB05', [J(12, 'Port 12')], { top: true })]
    const f = farOf(j, sw.ports.indexOf(j)), n = f.pos.split('/').pop()
    return [here, L(f.cable), N(f.eq.startsWith('HDF') ? 'HDF' : 'Panel', f.eq, f.rack, [J(n, `${f.pos} front`), J(n, 'rear')]), NONE]
  }
  function pathBar() {
    if (st.screen !== 'hdf' && st.screen !== 'switch') return ''
    const j = [...nearHdf.jacks, ...sw.ports].find((x) => x.id === st.selJack)
    if (!j || (st.screen === 'hdf') !== j.id.startsWith('bb01')) return ''
    const steps = pathOf(j)
    const nodes = steps.filter((x) => x.jacks), cables = steps.filter((x) => x.link).length
    const name = j.id.startsWith('bb01') ? `${jackName(j)} ${st.hdfSide.toLowerCase()}` : j.name
    const first = nodes[0], last = nodes.at(-1)
    const ends = first === last ? '' : ` · ${esc(first.name)} → ${esc(last.name)}`
    return `<section class="pathbar" aria-label="Path"><div class="pathbar-head"><b>Path of ${esc(name)}</b><span class="sub">${cables ? `${cables} cable${cables === 1 ? '' : 's'}${ends}` : 'no cable on this jack'}</span>${cables ? '<button type="button" class="btn quiet" data-go="trace" style="margin-left:auto;font-size:13px;height:24px;padding:0 8px" title="Trace this jack on its own page">Full page ⤢</button>' : ''}<button type="button" id="path-close" aria-label="Close path"${cables ? ' style="margin-left:0"' : ''}>×</button></div><div class="pathline">${drawPath(steps, j.s || 'a', !!j.s)}</div></section>`
  }
  /** One line of hardware: plates for equipment (one jack, or a position's two sides and its bridge), cables between them,
      plates in one rack on one band. `shared` outlines the equipment every route passes (the trace page's All routes). */
  function drawPath(steps, net, coloured, shared, framed) {
    const nodes = steps.filter((x) => x.jacks)
    const rackAt = (i) => { for (let k = i; k >= 0; k--) if (steps[k].jacks) return steps[k].rack; return null }
    const rackNext = (i) => { for (let k = i + 1; k < steps.length; k++) if (steps[k].jacks) return steps[k].rack; return null }
    const first = nodes[0], last = nodes.at(-1)
    const cells = steps.map((x, i) => {
      if (x.none) return `<div class="pcell stub"><span></span><span>${i === 0 ? 'nothing connected ┄' : '┄ nothing connected'}</span></div>`
      if (x.link) { const same = rackAt(i) === rackNext(i); return `<div class="pcell link ${x.net}${same ? ' band' : ''}"><span></span><span class="id">${x.link}</span></div>` }
      const prevRack = i > 0 ? rackAt(i - 1) : null, nextRack = rackNext(i)
      const isFirst = prevRack !== x.rack, isLast = nextRack !== x.rack
      const one = x.jacks.length === 1, atStart = x === first
      const jack = (q) => `<span class="pj ${coloured ? net : ''}${q.sel ? ' sel' : ''}">${q.text}</span>`
      const jacks = one ? (atStart ? `<span class="gap"></span>${jack(x.jacks[0])}` : `${jack(x.jacks[0])}<span class="gap"></span>`) : `${jack(x.jacks[0])}<span class="bridge"></span>${jack(x.jacks[1])}`
      const caps = one ? (atStart ? `<span></span><span>${x.jacks[0].cap}</span>` : `<span>${x.jacks[0].cap}</span><span></span>`) : `<span>${x.jacks[0].cap}</span><span>${x.jacks[1].cap}</span>`
      const tag = x.here ? 'div' : 'button type="button"'
      const sh = shared && shared.has(x.name)
      return `<div class="pcell node band${isFirst ? ' first' : ''}${isLast ? ' last' : ''}"><span class="rack">${isFirst ? (framed ? x.rack : `${bdi(SITE)} › ${x.rack}`) : ''}</span><${tag} class="pn${x.here ? ' here' : ''}${sh ? ' shared' : ''}" ${x.here ? '' : `title="Open ${esc(x.name)} on this jack${sh ? ' · every route passes here' : ''}"`}><span class="pn-top"><span class="tape">${esc(x.name)}</span><span class="kind${x.top ? ' top' : ''}">${x.kind}</span></span><span class="pn-jacks">${jacks}</span><span class="pn-caps">${caps}</span></${x.here ? 'div' : 'button'}></div>`
    })
    if (!framed) return cells.join('')
    // Framed (the trace page): each node's steps in one dashed frame named Site › Node; a cable between two nodes sits
    // between the frames, so the eye sees where the route leaves a building.
    const nodeOf = (rack) => rack && NODE_OF[rack]
    let out = '', open = null
    steps.forEach((x, i) => {
      const n = x.jacks ? nodeOf(x.rack) : x.link && nodeOf(rackAt(i)) === nodeOf(rackNext(i)) ? nodeOf(rackAt(i)) : null
      if (n !== open) { if (open) out += '</div></div>'; if (n) out += `<div class="nframe"><span class="nlabel">${bdi(SITE)} › ${bdi(n)}</span><div class="nrow">`; open = n }
      out += cells[i]
    })
    if (open) out += '</div></div>'
    return out
  }

      body = (pic ? '' : `<div class="tp-title"><h2>All routes from SW-B12-03</h2><div class="sub">${routes.length} routes · each one end to end · the mismatch is left out</div></div>

      let no = 0

      }).join('')
      const title = `SW-B12-03 · ${r.from} → ${r.to} · ${r.port}`

      body = pic ? canvas(`${title} · <span class="sub">${r.cables} cables</span>`, drawing)
        : `<div class="tp-title"><h2>${title}</h2><div class="tp-summary"><span><b>${r.cables} cables</b></span><span>${nodes.length} equipment</span><span>${racks.size} racks in ${places.size} nodes</span><span>${r.mismatch ? 'Network A → <b style="color:var(--net-b)">Network B</b>' : `Network A · ends at ${r.role}`}</span></div></div>

  /** Fit (no zoom chosen): the whole picture fits the canvas's width (and its height in Picture only), never above 100%
      on the page or 250% in Picture only. A chosen zoom stays until Fit. */
  function zoomTrace() {
    const c = $('#tp-canvas'), z = $('#tp-zoomed')
    if (!c || !z) return
    let k = st.tpZoom
    if (k == null) {
      z.style.zoom = 1
      const cs = getComputedStyle(c), padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight), padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom)

  function zoomBy(f) { st.tpZoom = Math.min(4, Math.max(0.3, (st.tpShown ?? 1) * f)); zoomTrace() }
  function cablesList(items, name, under) {

    $('#main').innerHTML = equipBar(sw.name, { rack: 'R12-1', prev: 'PANEL-B12-02', next: 'SW-B12-04' }) +
      `<div class="scroll"><div class="equip"><div class="meta"><span><b>Switch</b> · 48 × 1G + 4 × 10G · 1U at U12</span><span>access · Network A</span><span>16 free</span>${path([SITE, 'בניין 12', 'R12-1'])}</div>
      <div class="face${st.farSel ? ' picking' : ''}"><div class="face-head"><span class="tape">${sw.name}</span><span class="side">52 ports</span></div>${face}</div>
      <div class="key"><span><i style="background:#fff"></i>free</span><span><i style="background:var(--net-a);border-color:var(--net-a)"></i>Network A</span><span><i style="background:var(--net-b);border-color:var(--net-b)"></i>Network B</span><span><i style="background:#fff;outline:2px solid var(--ink)"></i>selected</span><span><b style="color:var(--ink)">↑</b> uplink: reaches an AGG or BB</span></div>
      <details class="strip" open><summary>Uplinks <span>2 of 52 ports reach an AGG or BB</span></summary><table><tr data-jack-row="sw:te1"><td class="mono">Te1/1/1</td><td><b>AGG-01 · Port 12</b> <span class="tag">AGG</span></td><td class="sub">4 cables · via PANEL-B12-01 › HDF-02 BB01 › HDF-02 BB05</td></tr><tr data-jack-row="sw:te2"><td class="mono">Te1/1/2</td><td><b>AGG-02 · Port 12</b> <span class="tag">AGG</span></td><td class="sub">4 cables · via PANEL-B12-01 › HDF-02 BB01 › HDF-02 BB05</td></tr></table></details>
      ${connectsTo(sw.ports, true)}</div></div>` + pathBar()
  }
  function portDetails() {
    const all = [...nearHdf.jacks, ...sw.ports]
    const j = all.find((x) => x.id === st.selJack)
    if (!j) return `<div class="sub">Click a jack to see its cable, its far end and its details.</div>`
    const isHdf = j.id.startsWith('bb01')
    const eq = isHdf ? nearHdf.name : sw.name
    const label = isHdf ? `${j.label} ${st.hdfSide.toLowerCase()}` : j.name
    const free = !j.s
    const actions = st.plan
      ? free ? `<div class="row-actions"><button class="btn primary" data-go="patching">Connect…</button><button class="btn" data-go="patching">Connect a range…</button></div>`
        : `<div class="row-actions"><button class="btn danger">Disconnect…</button><button class="btn" data-tab="trace">Trace from here</button></div>`
      : `<div class="sub">Open a plan to connect or disconnect.</div>`
    const other = isHdf ? `${j.label} ${st.hdfSide === 'Rear' ? 'front' : 'rear'}` : ''
    const farEnd = isHdf ? `AGG-0${(j.row ?? 1) % 2 + 1} · Port ${(j.pos ?? 3) + 6}` : j.up ? `AGG-0${j.n - 48} · Port 12` : `PANEL-B12-01 · ${j.n}`
    const chain = free
      ? `<div class="chain"><div class="node none">no cable</div><div class="link">this side is free</div><div class="node here">${esc(label)}</div>${isHdf ? `<div class="link">bridge</div><div class="node">${esc(other)}</div><div class="link">cable C-${1200 + j.row * 7}</div><div class="node">SW-B12-03 · Port ${j.row + 2}</div>` : ''}</div>`
      : `<div class="chain"><div class="node">${esc(farEnd)}</div><div class="link">${j.up ? '4 cables · via HDF-02 BB05 › HDF-02 BB01 › PANEL-B12-01' : `cable C-${880 + (j.pos ?? j.n)}`}</div><div class="node here">${esc(label)}</div>${isHdf ? `<div class="link">bridge</div><div class="node">${esc(other)}</div><div class="link">cable C-${1300 + (j.row ?? 1)}</div><div class="node">HDF-02 BB05 · ${j.label} rear</div>` : ''}</div>`
    return `<div><h2>${esc(label)}</h2><div class="sub">${esc(eq)} · ${free ? 'free' : `cabled · ${NET[j.s]}`}</div></div>${actions}
      <div class="section-label">Details</div><dl class="kv"><dt>Type</dt><dd>${isHdf ? 'LC duplex' : j.g === 1 ? 'SFP+' : 'RJ45'}</dd><dt>Speed</dt><dd>${isHdf ? '—' : j.g === 1 ? '10G' : '1G'}</dd><dt>Description</dt><dd>—</dd></dl>`
  }

  // ---------- patching ----------
  const runOf = (eq) => eq.jacks
  function pairs() {
    if (st.mode !== 'range' || !st.nearSel || !st.farStart) return []
    const nr = runOf(nearHdf), fr = runOf(far())
    const ni = nr.findIndex((j) => j.id === st.nearSel), fi = fr.findIndex((j) => j.id === st.farStart)
    const madeIds = new Set(st.made.flatMap((m) => [m.aId, m.bId]))
    const out = []
    for (let i = 0; i < st.count; i++) {
      const a = nr[ni + i], b = fr[fi + i]
      let problem = ''
      if (!a || !b) problem = 'past the last position'
      else if (a.s || madeIds.has(a.id)) problem = `${jackName(a)} rear is already cabled`
      else if (b.s || madeIds.has(b.id)) problem = `${jackName(b)} rear is already cabled`
      out.push({ n: i + 1, a, b, problem })
    }
    return out
  }
  function renderPatching() {
    const ps = pairs()
    const nearMarks = new Map(), farMarks = new Map()
    ps.forEach((p) => { if (p.a) nearMarks.set(p.a.id, p); if (p.b) farMarks.set(p.b.id, p) })
    const madeA = new Map(st.made.map((m) => [m.aId, m])), madeB = new Map(st.made.map((m) => [m.bId, m]))
    const nextFar = st.mode === 'one' ? far().jacks.find((j) => !j.s && !madeB.has(j.id))?.id : null
    const deco = (marks, madeMap, selId, nextId) => (j) => {
      const p = marks.get(j.id)
      if (madeMap.has(j.id)) return { state: 'made' }
      if (p) return { state: p.problem && (j.s || madeMap.has(j.id)) ? 'blocked' : p.problem ? 'blocked' : 'pair', badge: p.n, sel: j.id === selId }
      return { sel: j.id === selId, next: j.id === nextId }
    }
    const ok = ps.filter((p) => !p.problem).length, bad = ps.length - ok
    const nearJ = nearHdf.jacks.find((j) => j.id === st.nearSel)
    const farEq = far()
    let status
    if (st.mode === 'one') status = nearJ && nextFar ? `Next: <b>${jackName(nearJ)} rear</b> → <b>${esc(farEq.name)} · ${nextFar.split(':')[1]} rear</b>` : 'Click a free jack on the left.'
    else if (!st.farStart) status = `From <b>${nearJ ? jackName(nearJ) + ' rear' : '—'}</b>, ${st.count} jacks. <b>Click the far start on the right.</b>`
    else status = `<b>${ok} pair${ok === 1 ? '' : 's'}</b> ready${bad ? `, <span style="color:var(--danger)">${bad} can’t be made</span>` : ''} · the pairs are numbered on both faces`
    const canConnect = st.mode === 'range' ? ok > 0 && (bad === 0 || st.skip) : !!(nearJ && nextFar)
    const connectLabel = st.mode === 'range' ? (ps.length ? `Connect ${ok}` : 'Connect') : 'Connect'
    const pairList = ps.length ? `<ol>${ps.map((p) => `<li class="${p.problem ? 'bad' : ''}"><span class="no">${p.n}</span><span>${p.a ? jackName(p.a) : '—'} → ${p.b ? jackName(p.b) : '—'}${p.problem ? `<em>${esc(p.problem)}</em>` : ''}</span></li>`).join('')}</ol>` : `<div class="empty">${st.mode === 'range' ? 'Pick the far start to see the pairs.' : 'One at a time: each click on the right makes a cable.'}</div>`
    const madeList = st.made.length ? `<ul>${st.made.slice().reverse().map((m, i) => `<li><span class="no" style="color:var(--made)">✓</span><span>${m.a} → ${esc(m.far)} · ${m.b}</span></li>`).join('')}</ul>` : `<div class="empty">Nothing yet. Each cable is also in Changes, with its own Undo.</div>`
    $('#main').innerHTML = `<div class="bar"><div class="crumbs"><span class="here">Patching</span><span class="sub">in plan <bdi>הרחבת ליבה</bdi> · each cable is saved to the plan at once</span></div><span class="spacer"></span>${numSeg()}<button type="button" class="btn quiet" data-go="hdf">← Back to HDF-02</button></div>
    <div class="patch">
      <section class="pane" aria-label="From">
        <div class="pane-head"><span class="dir">From</span><span class="name">HDF-02</span><span class="where">${path([SITE, CORE, 'BB01'])}</span><div class="seg" role="group" aria-label="Near side"><button type="button" aria-pressed="false">Front</button><button type="button" aria-pressed="true">Rear</button></div></div>
        <div class="pane-body" id="near-body">${hdfFace(nearHdf, 'Rear', deco(nearMarks, madeA, st.nearSel, null))}</div>
      </section>
      <section class="pane" aria-label="To" style="position:relative">
        <div class="pane-head"><span class="dir">To</span><button type="button" class="picker-btn" id="picker" aria-expanded="${st.pickerOpen}"><span class="name">${esc(farEq.name)}</span><span class="where">${path([SITE, CORE, farEq.rack])}</span><span aria-hidden="true">▾</span></button><span class="sub" style="white-space:nowrap">${farEq.jacks.filter((j) => !j.s && !madeB.has(j.id)).length} free</span><div class="seg" role="group" aria-label="Far side"><button type="button" aria-pressed="false">Front</button><button type="button" aria-pressed="true">Rear</button></div></div>
        ${st.pickerOpen ? `<div class="picker" role="dialog" aria-label="Far end"><label>Site<select><option>${esc(SITE)}</option></select></label><label>Node<select><option>${esc(CORE)}</option></select></label><label>Rack<select><option>BB05 (8)</option><option>BB01 (6)</option></select></label><label>Equipment<select id="far-eq"><option value="12" ${st.farRows === 12 ? 'selected' : ''}>HDF-02 BB05 · ${farHdf12.jacks.filter((j) => !j.s).length} free</option><option value="32" ${st.farRows === 32 ? 'selected' : ''}>HDF-04 BB05 · ${farHdf32.jacks.filter((j) => !j.s).length} free</option></select></label></div>` : ''}
        <div class="pane-body" id="far-body">${hdfFace(farEq, 'Rear', deco(farMarks, madeB, st.farStart, nextFar))}</div>
      </section>
      <aside class="side-strip ${st.stripOpen ? '' : 'closed'}" aria-label="Pairs and made here">
        <h3>Pairs ${ps.length ? `(${ps.length})` : ''}<button type="button" class="tgl" id="strip" aria-label="${st.stripOpen ? 'Collapse' : 'Expand'}">${st.stripOpen ? '›' : '‹'}</button></h3>
        ${st.stripOpen ? `${pairList}<h3>Made here (${st.made.length})</h3>${madeList}` : ''}
      </aside>
      <div class="actionbar">
        <div class="seg" role="group" aria-label="Mode"><button type="button" data-mode="one" aria-pressed="${st.mode === 'one'}">One at a time</button><button type="button" data-mode="range" aria-pressed="${st.mode === 'range'}">Range</button></div>
        ${st.mode === 'range' ? `<label class="count-in">Count <input id="count" type="text" inputmode="numeric" value="${st.count}" aria-label="Count"></label>` : ''}
        ${bad && st.mode === 'range' ? `<label class="check"><input type="checkbox" id="skip" ${st.skip ? 'checked' : ''}> Skip ${bad}</label>` : ''}
        <span class="status">${status}</span>
        <button type="button" class="btn" id="undo" ${st.made.length ? '' : 'disabled'}>Undo last</button>
        <button type="button" class="btn" id="done">Done</button>
        <button type="button" class="btn primary lg" id="connect" ${canConnect ? '' : 'disabled'}>${connectLabel}</button>
        ${st.confirmDone ? `<div class="confirm" role="dialog" aria-label="Pairs not connected"><b>${ok} pair${ok === 1 ? ' is' : 's are'} not connected yet.</b><span class="sub">The numbered pairs are a preview. Nothing is saved until you connect them.</span><div class="row-actions"><button type="button" class="btn" id="close-anyway">Close without connecting</button><button type="button" class="btn primary" id="connect-close">Connect ${ok} and close</button></div></div>` : ''}
      </div>
    </div>`
    const nb = $('#near-body'), sel = nb && nb.querySelector('[data-sel="true"]')
    if (sel && !renderPatching.scrolled) { sel.scrollIntoView({ block: 'center' }); renderPatching.scrolled = true }
  }
  function connect() {
    const farEq = far()
    if (st.mode === 'range') {
      const ok = pairs().filter((p) => !p.problem)
      ok.forEach((p) => st.made.push({ a: p.a.label, b: p.b.label, aId: p.a.id, bId: p.b.id, far: farEq.name, batch: st.made.length }))
      const lastA = ok.at(-1)?.a
      const run = nearHdf.jacks, madeIds = new Set(st.made.map((m) => m.aId))
      const i = lastA ? run.findIndex((j) => j.id === lastA.id) : -1
      st.nearSel = run.slice(i + 1).find((j) => !j.s && !madeIds.has(j.id))?.id ?? st.nearSel
      st.farStart = null; st.skip = false
    } else {
      const madeB = new Set(st.made.map((m) => m.bId)), madeA = new Set(st.made.map((m) => m.aId))
      const a = nearHdf.jacks.find((j) => j.id === st.nearSel)
      const b = farEq.jacks.find((j) => j.id === (st.farPick ?? farEq.jacks.find((x) => !x.s && !madeB.has(x.id))?.id))
      if (!a || !b) return
      st.made.push({ a: a.label, b: b.label, aId: a.id, bId: b.id, far: farEq.name })
      madeA.add(a.id)
      st.nearSel = nearHdf.jacks.find((j) => !j.s && !madeA.has(j.id))?.id ?? null
      st.farPick = null
    }
  }

  // ---------- render + events ----------
  function render() {
    document.documentElement.style.setProperty('--jack', st.jackSize + 'px')
    renderFrame()
    if (st.screen === 'tree') renderTree()
    else if (st.screen === 'hdf') renderHdf()
    else if (st.screen === 'switch') renderSwitch()
    else if (st.screen === 'trace') { renderTracePage(); zoomTrace() }
    else renderPatching()
    renderDock()
    if (st.screen === 'tree') requestAnimationFrame(() => renderTree())
    $('#size').textContent = `This window: ${innerWidth} × ${innerHeight}`
  }
  function litRoute() {
    if (st.screen === 'tree') st.selNode = '0:0'
    else if (st.screen === 'switch') { const f = ALL_ROUTES[st.route].from; st.selJack = f.startsWith('Te') ? 'sw:te' + f.slice(-1) : 'sw:' + f.split('/').pop() }
  }
  function go(screen) {
    if (screen === 'trace' && st.screen !== 'trace') st.traceBack = st.screen
    st.screen = screen; st.farSel = null; st.menu = false; st.selJack = null; st.confirmDone = false; st.pickerOpen = false
    if (screen === 'patching') { st.dock = null; renderPatching.scrolled = false }
    else if (screen === 'trace') { st.dock = null; st.traced = true; if (st.route == null) st.route = 0 }
    else if (st.dockTab === 'details') st.dock = null
    if (st.route != null) litRoute()
    try { history.replaceState(null, '', '#' + screen) } catch {}
    render()
  }

  document.addEventListener('click', (e) => {
    const ip = e.target.closest('[data-insp-port]')
    if (ip) { const id = ip.dataset.inspPort; go('switch'); st.selJack = id; st.dock = true; st.dockTab = 'details'; return render() }
    const row = e.target.closest('[data-jack-row]')
    if (row) { st.selJack = row.dataset.jackRow; st.dock = true; st.dockTab = 'details'; return render() }
    if (st.toast && !e.target.closest('[data-export]')) st.toast = ''
    const t = e.target.closest('button, input, select, summary')
    if (!t) { if (st.menu) { st.menu = false; render() } return }
    if (t.dataset.far) { st.farSel = st.farSel === t.dataset.far ? null : t.dataset.far; return render() }
    if (t.id === 'far-clear') { st.farSel = null; return render() }
    if (t.id === 'path-close') { st.selJack = null; st.dock = null; return render() }
    if (t.dataset.screen) return go(t.dataset.screen)
    if (t.dataset.jsize) { st.jackSize = +t.dataset.jsize; return render() }
    if (t.dataset.num) { st.numbering = t.dataset.num; try { localStorage.setItem('demo-hdf-numbering', st.numbering) } catch {} return render() }
    if (t.id === 'rows32') { st.farRows = st.farRows === 12 ? 32 : 12; st.farStart = null; return render() }
    if (t.dataset.go) return go(t.dataset.go)
    if (t.dataset.view) return go(t.dataset.view === 'Conceptual' ? 'tree' : 'hdf')
    if (t.id === 'ctx-installed' || t.id === 'ctx-plan') { st.plan = t.id === 'ctx-plan'; return render() }
    if (t.id === 'changes') { st.dock = true; st.dockTab = 'changes'; return render() }
    if (t.id === 'trace-run') { st.traced = true; st.route = 0; litRoute(); return render() }
    if (t.id === 'trace-clear') { st.traced = false; st.route = null; return render() }
    if (t.dataset.route) { st.route = +t.dataset.route; st.tpZoom = null; if (t.hasAttribute('data-tp-one')) st.tpView = 'one'; litRoute(); return render() }
    if (t.dataset.export) { st.toast = t.dataset.export === 'PNG' ? `Downloaded route-SW-B12-03-${ALL_ROUTES[st.route ?? 0].to}.png (demo: nothing is saved). With All routes, every route is in the one picture.` : `Downloaded route-SW-B12-03-${ALL_ROUTES[st.route ?? 0].to}.pdf (demo): the drawing on top, the walk under it, one page.`; return render() }
    if (t.dataset.tz) { if (t.dataset.tz === 'fit') { st.tpZoom = null; zoomTrace() } else zoomBy(t.dataset.tz === 'in' ? 1.25 : 1 / 1.25); return }
    if (t.id === 'tp-pic') { st.tpPicture = !st.tpPicture; st.tpZoom = null; return render() }
    if (t.dataset.tpView) { st.tpView = t.dataset.tpView; st.tpZoom = null; return render() }
    if (t.id === 'tp-back') return go(st.traceBack || 'tree')
    if (t.dataset.rail === 'Trace' && st.screen === 'trace') return
    if (t.id === 'ctx-plan-2') { st.plan = true; return render() }
    if (t.dataset.rail) {
      const tab = { Explore: 'explore', Trace: 'trace', Inspect: 'inspector', Add: 'add' }[t.dataset.rail]
      if (st.dock && st.dockTab === tab) st.dock = null; else { st.dock = true; st.dockTab = tab }
      return render()
    }
    if (t.dataset.tab) { st.dock = true; st.dockTab = t.dataset.tab; return render() }
    if (t.hasAttribute('data-close-dock')) { st.dock = null; st.selJack = null; if (st.screen === 'tree') st.selNode = null; return render() }
    if (t.dataset.node) { st.selNode = t.dataset.node; st.dock = true; st.dockTab = 'details'; return render() }
    if (t.id === 'key') { st.keyOpen = !st.keyOpen; return render() }
    if (t.id === 'more') { st.menu = !st.menu; return render() }
    if (t.dataset.side) { st.hdfSide = t.dataset.side; return render() }
    if (t.dataset.jack) {
      const id = t.dataset.jack
      if (st.screen === 'patching') {
        const isNear = id.startsWith('bb01')
        const madeIds = new Set(st.made.flatMap((m) => [m.aId, m.bId]))
        const j = (isNear ? nearHdf : far()).jacks.find((x) => x.id === id)
        if (!j || j.s || madeIds.has(id)) return
        st.confirmDone = false
        if (isNear) { if (e.shiftKey && st.mode === 'range' && st.nearSel) { const r = nearHdf.jacks, a = r.findIndex((x) => x.id === st.nearSel), b = r.findIndex((x) => x.id === id); if (b >= a) st.count = b - a + 1 } else st.nearSel = id }
        else if (st.mode === 'range') { st.farStart = id; st.skip = false }
        else { st.farPick = id; connect() }
        return render()
      }
      st.menu = false; st.selJack = id; st.dock = true; st.dockTab = 'details'; return render()
    }
    if (t.dataset.mode) { st.mode = t.dataset.mode; st.farStart = null; st.confirmDone = false; return render() }
    if (t.id === 'skip') { st.skip = t.checked; return render() }
    if (t.id === 'connect') { connect(); st.confirmDone = false; return render() }
    if (t.id === 'undo') { const last = st.made.at(-1); if (last) { st.made.pop(); st.nearSel = last.aId } st.confirmDone = false; return render() }
    if (t.id === 'done') {
      if (st.mode === 'range' && pairs().some((p) => !p.problem)) { st.confirmDone = true; return render() }
      return go('hdf')
    }
    if (t.id === 'close-anyway') { st.farStart = null; return go('hdf') }
    if (t.id === 'connect-close') { connect(); return go('hdf') }
    if (t.id === 'picker') { st.pickerOpen = !st.pickerOpen; return render() }
    if (t.id === 'strip') { st.stripOpen = !st.stripOpen; return render() }
  })
  document.addEventListener('change', (e) => {
    if (e.target.id === 'far-eq') { st.farRows = Number(e.target.value); st.farStart = null; st.pickerOpen = false; render() }
  })
  document.addEventListener('input', (e) => {
    if (e.target.id === 'cable-filter') { st.cableFilter = e.target.value; const pos = e.target.selectionStart; render(); const c = $('#cable-filter'); c.focus(); try { c.setSelectionRange(pos, pos) } catch {} return }
    if (e.target.id === 'count') {
      const v = e.target.value.trim()
      if (/^\d+$/.test(v) && +v >= 1 && +v <= 500) { st.count = +v; const pos = e.target.selectionStart; render(); const c = $('#count'); c.focus(); try { c.setSelectionRange(pos, pos) } catch {} }
    }
  })
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && st.screen === 'trace' && st.tpPicture) { st.tpPicture = false; st.tpZoom = null; return render() }
    if (e.key === 'Escape') { if (st.confirmDone || st.pickerOpen || st.menu) { st.confirmDone = st.pickerOpen = st.menu = false; render() } else if (st.dock) { st.dock = null; render() } }
  })
  // ⌘/Ctrl + wheel (and a trackpad pinch, which the browser sends the same way) zooms the trace picture; dragging it pans.
  document.addEventListener('wheel', (e) => {
    if (!(e.ctrlKey || e.metaKey) || !e.target.closest('#tp-canvas')) return
    e.preventDefault(); zoomBy(Math.exp(-Math.max(-50, Math.min(50, e.deltaY)) * 0.005))
  }, { passive: false })
  let drag = null
  document.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('#tp-canvas')
    if (!c || e.button !== 0 || e.target.closest('button')) return
    drag = { c, x: e.clientX, y: e.clientY, l: c.scrollLeft, t: c.scrollTop }; c.classList.add('dragging')
  })
  document.addEventListener('pointermove', (e) => { if (drag) { drag.c.scrollLeft = drag.l - (e.clientX - drag.x); drag.c.scrollTop = drag.t - (e.clientY - drag.y) } })
  document.addEventListener('pointerup', () => { if (drag) { drag.c.classList.remove('dragging'); drag = null } })
  addEventListener('resize', () => { $('#size').textContent = `This window: ${innerWidth} × ${innerHeight}`; if (st.screen === 'tree') renderTree(); if (st.screen === 'trace') zoomTrace() })
  const start = (location.hash || '').slice(1)
  if (SCREENS.some((s) => s[0] === start)) st.screen = start
  render()
})()
</script>
