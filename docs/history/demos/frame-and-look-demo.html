  --steel-0:#090c10;
  --hw-well:#0a0d11; --hw-rim:#64717f;
  --tape:#e6e8e2; --tape-ink:#15202b;
  --socket:#c9d1d9; --socket-ink:#1f2931; --socket-edge:#aab4be; --socket-lip:#b6bfc8;

  --route:#2fb39b; --route-text:#5fd0bb; --route-soft:#10302b; --route-jack:#0b8272;
  --highlight:#e0a526; --highlight-edge:#eab33f; --highlight-soft:#382c10; --warn-text:#f2c766;
  --danger:#ff7a59; --danger-solid:#c8432b; --danger-hover:#d9533a; --danger-soft:#3a1c16; --fault-hatch:#e9b3a6;
  --proposed:#e6bd55; --proposed-soft:#2e2813; --on-proposed:#1a1505;
  --plan-band:#26220f; --plan-edge:#5a4a1c;
  --success:#9ee6a8; --success-soft:#14301f;

  --guide-bg:#1d1a10; --guide-edge:#4d4428; --guide-line:#3a3321;
  --wire-hover:#ffffff0f; --wire-on:#ffffff1f; --swatch-ring:#ffffff40;

  --shadow-1:0 1px 2px #00000066;
  --shadow-2:0 6px 16px -4px #000000a6;

  color-scheme: dark;
}

/* Aliases are declared on every themed element, so they resolve against that element's own greys. */
:root, [data-theme] {
  --surface-page:var(--g3); --surface-sunk:var(--g1); --surface-hover:var(--g2); --surface-pressed:var(--g4);
  --border-subtle:var(--g4); --border:var(--g6); --border-strong:var(--g7); --border-field:var(--g9);
  --text:var(--g12); --text-muted:var(--g11); --text-faint:var(--g10); --text-disabled:var(--g8);
  --on-ink:var(--surface); --focus:var(--g12);
  --line:var(--g9); --dots:var(--g5); --lane:var(--g2);
  --jack-edge:inset 0 0 0 1px var(--socket-edge), inset 0 -3px 0 var(--socket-lip);
  --jack-sel:0 0 0 2px var(--steel-1), 0 0 0 4px var(--focus-on-steel);
  --slot-ink:var(--steel-7);
}

:root {
  --sans:'IBM Plex Sans','IBM Plex Sans Hebrew',system-ui,'Segoe UI',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;

  /* One type scale: six sizes (11 12 13 14 16 20), three weights (400 500 600). */
  --type-page:600 20px/28px var(--sans);
  --type-card:600 16px/22px var(--sans);
  --type-section:600 14px/20px var(--sans);
  --type-body:400 14px/20px var(--sans);
  --type-dense:400 13px/18px var(--sans);
  --type-label:500 12px/16px var(--sans);
  --type-small:400 12px/16px var(--sans);
  --type-code:400 13px/18px var(--mono);
  --type-code-sm:400 12px/16px var(--mono);
  --type-tape:500 12px/16px var(--sans);
  --type-unit:400 12px/16px var(--mono);
  --type-hw:500 11px/14px var(--sans);
  --ls-body:0.01em; --ls-dense:0.015em; --ls-label:0.025em; --ls-tape:0.02em; --ls-hw:0.03em;

  --s-1:2px; --s-2:4px; --s-3:8px; --s-4:12px; --s-5:16px; --s-6:24px; --s-7:32px;
  --r-hw:2px; --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:12px; --r-pill:999px;
  --h-control:32px;
  --dur-instant:80ms; --dur-fast:120ms; --dur-base:160ms; --dur-slow:240ms;
  --ease-standard:cubic-bezier(0.2,0,0.38,0.9); --ease-enter:cubic-bezier(0,0,0.38,0.9); --ease-exit:cubic-bezier(0.2,0,1,0.9);

  --jack-r:var(--r-hw); --jgap:3px;
  --slot-line:#56626f;
}
/* "Today" for faceplates and racks only (the flip on the rack screens). */
.look-old {
  --jack-r:2px; --jgap:2px; --socket:#ffffff; --socket-ink:#1c2b3a;
  --jack-edge:none; --jack-sel:inset 0 0 0 3px #fff, inset 0 0 0 5px #1c2b3a;
  --slot-line:#36414d; --slot-ink:#6f7c8a;
}

* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; }
html { background:var(--surface-page); }

h1, h2, h3, h4, h5, p { margin:0; }
button { font:inherit; color:inherit; letter-spacing:inherit; cursor:pointer; background:none; border:0; padding:0; text-align:inherit; }
input, select { font:inherit; color:inherit; }
bdi { unicode-bidi:isolate; }
svg { flex:none; }
:where(svg[viewBox='0 0 24 24']) { width:16px; height:16px; }
.mono { font-family:var(--mono); font-variant-ligatures:none; }
.muted { color:var(--text-muted); }
.faint { color:var(--text-faint); }
.dense { font:var(--type-dense); letter-spacing:var(--ls-dense); }
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
::selection { background:var(--surface-selected); }
* { scrollbar-width:thin; scrollbar-color:var(--g8) transparent; }

/* ---------- The frame: header, rail | dock | page ---------- */
#app { display:grid; grid-template-rows:44px minmax(0,1fr); grid-template-columns:48px auto minmax(0,1fr); height:100vh; width:100%; overflow:hidden; }
.hdr { grid-column:1 / -1; display:flex; align-items:center; gap:var(--s-4); padding:0 var(--s-4); background:var(--surface); border-bottom:1px solid var(--border); min-width:0; position:relative; z-index:20; }
.brand { display:flex; align-items:center; gap:var(--s-3); font:var(--type-section); letter-spacing:var(--ls-body); margin-right:var(--s-2); }
.brand svg { width:18px; height:18px; }
.seg { display:inline-flex; align-items:center; gap:var(--s-1); padding:var(--s-1); height:var(--h-control); border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface-sunk); flex:none; }
.seg button { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 var(--s-4); border-radius:var(--r-sm); color:var(--text-muted); font:var(--type-dense); letter-spacing:var(--ls-dense); white-space:nowrap; transition:color var(--dur-instant) var(--ease-standard), background-color var(--dur-instant) var(--ease-standard); }
.seg button:hover { color:var(--text); background:var(--surface-hover); }

.seg.sm { height:28px; }
.seg.sm button { height:22px; padding:0 var(--s-3); }
.hlabel { color:var(--text-muted); font:var(--type-dense); letter-spacing:var(--ls-dense); }
.spacer { flex:1; }
.env { font:var(--type-label); letter-spacing:var(--ls-label); font-weight:600; color:var(--warn-text); background:var(--highlight-soft); border:1px solid var(--plan-edge); border-radius:var(--r-sm); padding:1px 6px; }
.netpick { position:relative; }
.netpick > .btn { width:180px; justify-content:space-between; border-color:var(--border-field); }
.netpick > .btn > span { display:inline-flex; align-items:center; gap:var(--s-3); min-width:0; overflow:hidden; text-overflow:ellipsis; }
.menu { position:absolute; z-index:40; min-width:220px; padding:var(--s-2); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-2); }
.netpick .menu { top:36px; left:0; }
.menu button { display:flex; align-items:center; gap:var(--s-3); width:100%; height:32px; padding:0 var(--s-3); border-radius:var(--r-sm); font:var(--type-dense); letter-spacing:var(--ls-dense); white-space:nowrap; }

.menu hr { border:0; border-top:1px solid var(--border-subtle); margin:var(--s-2) 0; }
.theme-seg button svg { width:14px; height:14px; }

.rail { grid-row:2; grid-column:1; display:flex; flex-direction:column; align-items:center; gap:var(--s-2); padding-top:var(--s-4); background:var(--surface); border-right:1px solid var(--border); z-index:5; }
.rail button { position:relative; display:grid; place-items:center; width:36px; height:36px; border-radius:var(--r-md); color:var(--text-muted); transition:background-color var(--dur-instant) var(--ease-standard); }
.rail button:hover { background:var(--surface-hover); color:var(--text); }
.rail button svg { width:20px; height:20px; stroke-width:1.5; }
.rail button[aria-pressed='true'] { background:var(--surface-selected); color:var(--text); }
.rail button[aria-pressed='true']::before { content:''; position:absolute; left:-6px; top:8px; bottom:8px; width:2px; border-radius:2px; background:var(--text); }
.rail .badge { position:absolute; top:1px; right:-3px; min-width:18px; height:18px; padding:0 5px; border-radius:var(--r-pill); background:var(--proposed); color:var(--on-proposed); font:var(--type-label); font-weight:600; line-height:18px; text-align:center; box-shadow:0 0 0 2px var(--surface); }
.rail .sep { width:24px; height:1px; background:var(--border); margin:var(--s-2) 0; }
.rail button[data-tip]:hover::after { content:attr(data-tip); position:absolute; left:44px; top:50%; transform:translateY(-50%); background:var(--g12); color:var(--surface); font:var(--type-small); letter-spacing:var(--ls-label); padding:var(--s-2) var(--s-3); border-radius:var(--r-sm); white-space:nowrap; z-index:60; pointer-events:none; box-shadow:var(--shadow-2); }

.dock { grid-row:2; grid-column:2; width:360px; display:flex; flex-direction:column; min-height:0; background:var(--surface); border-right:1px solid var(--border); }
.dock-b { flex:1; overflow-y:auto; padding:var(--s-5); scrollbar-gutter:stable; }
.page { grid-row:2; grid-column:3; overflow-y:auto; overflow-x:hidden; min-width:0; position:relative; }
.wrap { padding:var(--s-5) var(--s-6) var(--s-6); min-width:0; }

/* ---------- One heading on every page: breadcrumb, title, meta, actions ---------- */
.ph { margin-bottom:var(--s-5); min-width:0; }
.ph-crumbs { display:flex; align-items:center; flex-wrap:wrap; gap:var(--s-2); min-height:24px; font:var(--type-small); letter-spacing:var(--ls-label); color:var(--text-muted); }
.ph-crumbs a { cursor:pointer; border-radius:var(--r-sm); }
.ph-crumbs a:hover { color:var(--text); text-decoration:underline; text-underline-offset:2px; }
.ph-crumbs b { color:var(--text); font-weight:500; }
.ph-crumbs svg { width:12px; height:12px; stroke-width:2; }
.ph-crumbs .back { display:inline-flex; align-items:center; gap:var(--s-1); height:24px; padding:0 var(--s-3) 0 var(--s-1); margin-right:var(--s-2); border-radius:var(--r-sm); color:var(--text); font:var(--type-label); }
.ph-crumbs .back:hover { background:var(--surface-hover); }
.ph-crumbs .back svg { width:14px; height:14px; }
.ph-row { display:flex; align-items:center; flex-wrap:wrap; gap:var(--s-2) var(--s-4); margin-top:var(--s-1); min-width:0; }
.ph h1 { font:var(--type-page); letter-spacing:0; white-space:nowrap; }
.ph-meta { font:var(--type-dense); letter-spacing:var(--ls-dense); color:var(--text-muted); min-width:0; }
.ph-end { margin-left:auto; display:flex; align-items:center; gap:var(--s-3); flex-wrap:wrap; }
.dock .ph { margin:calc(var(--s-5) * -1) calc(var(--s-5) * -1) var(--s-5); padding:var(--s-3) var(--s-3) var(--s-4) var(--s-5); border-bottom:1px solid var(--border-subtle); position:sticky; top:calc(var(--s-5) * -1); background:var(--surface); z-index:2; }
.dock .ph h1 { white-space:normal; }
.dock .ph-row { align-items:flex-start; }
.dock .ph-meta { flex-basis:100%; order:3; }

/* ---------- Controls (the specimen's three kinds and their states) ---------- */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:var(--h-control); padding:0 var(--s-4); border-radius:var(--r-md); font:var(--type-dense); font-weight:500; letter-spacing:var(--ls-body); border:1px solid var(--border); background:var(--surface); color:var(--text); white-space:nowrap; flex:none;
  transition:background-color var(--dur-instant) var(--ease-standard), border-color var(--dur-instant) var(--ease-standard), color var(--dur-instant) var(--ease-standard); }
.btn:hover, .btn.is-hover { border-color:var(--border-strong); background:var(--surface-hover); }
.btn:active, .btn.is-pressed { background:var(--surface-pressed); border-color:var(--border-strong); }
.btn[aria-pressed='true'], .btn.is-selected { background:var(--surface-selected); border-color:var(--g12); }
.btn.is-focus { outline:2px solid var(--focus); outline-offset:2px; }
.btn:disabled { color:var(--text-disabled); border-color:var(--border-subtle); background:var(--surface); cursor:not-allowed; }
.btn svg { width:16px; height:16px; }
.btn.primary { background:var(--g12); border-color:var(--g12); color:var(--on-ink); }
.btn.primary:hover, .btn.primary.is-hover { background:var(--ink-hover); border-color:var(--ink-hover); }
.btn.primary:active, .btn.primary.is-pressed { background:var(--ink-pressed); border-color:var(--ink-pressed); }
.btn.primary:disabled { background:var(--g5); border-color:var(--g5); color:var(--g9); }
.btn.quiet { border-color:transparent; background:transparent; color:var(--text-muted); padding:0 var(--s-3); }
.btn.quiet:hover, .btn.quiet.is-hover { background:var(--surface-hover); color:var(--text); }
.btn.quiet:active, .btn.quiet.is-pressed { background:var(--surface-pressed); color:var(--text); }
.btn.quiet:disabled { color:var(--text-disabled); background:transparent; }
.btn.sm { height:28px; padding:0 var(--s-3); }
.btn.danger { background:var(--danger-solid); border-color:var(--danger-solid); color:#ffffff; }
.btn.danger:hover, .btn.danger.is-hover { background:var(--danger-hover); border-color:var(--danger-hover); }
.btn.danger:active, .btn.danger.is-pressed { background:var(--danger-hover); }
.btn.danger:disabled { background:var(--g5); border-color:var(--g5); color:var(--g9); }
.btn.on { background:var(--surface-selected); border-color:var(--g12); color:var(--text); }
.iconbtn { display:inline-grid; place-items:center; width:28px; height:28px; border-radius:var(--r-md); color:var(--text-muted); flex:none; }
.iconbtn:hover { background:var(--surface-hover); color:var(--text); }
.iconbtn svg { width:16px; height:16px; }
.link { color:var(--text); text-decoration:underline; text-decoration-color:var(--border-strong); text-underline-offset:3px; font-weight:500; }
.link:hover { text-decoration-color:var(--text); }
.field { height:34px; width:100%; padding:0 10px; border:1px solid var(--border-field); border-radius:var(--r-md); background:var(--surface); color:var(--text); font:var(--type-dense); letter-spacing:var(--ls-dense); }
.field::placeholder { color:var(--text-faint); }
.field:hover { border-color:var(--g10); }
.field:focus, .field.is-focus { outline:2px solid var(--focus); outline-offset:0; border-color:var(--focus); }
.field:disabled { background:var(--surface-sunk); border-color:var(--border); color:var(--text-disabled); }
.field.bad { border-color:var(--danger); }
.lbl { display:block; font:var(--type-label); letter-spacing:var(--ls-label); color:var(--text); margin-bottom:var(--s-2); }
.hint { font:var(--type-small); letter-spacing:var(--ls-label); color:var(--text-muted); margin:var(--s-2) 0 0; }
.err { font:var(--type-label); letter-spacing:var(--ls-label); color:var(--danger); margin:var(--s-2) 0 0; }
.chip { display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 var(--s-3); border-radius:var(--r-pill); border:1px solid var(--border); background:var(--surface); color:var(--text); font:var(--type-small); letter-spacing:var(--ls-label); white-space:nowrap; }
.chip.prop { border:1.5px dashed var(--proposed); background:var(--proposed-soft); color:var(--proposed); font-weight:600; }
.chip.route { border-color:var(--route); background:var(--route-soft); color:var(--route-text); font-weight:500; }
.chip.warn { border-color:var(--highlight-edge); background:var(--highlight-soft); color:var(--warn-text); font-weight:500; }
.chip.danger { border-color:var(--danger); background:var(--danger-soft); color:var(--danger); font-weight:500; }
.chip.success { border-color:var(--success); background:var(--success-soft); color:var(--success); font-weight:500; }
.badge { display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 5px; border-radius:var(--r-pill); background:var(--g4); color:var(--text); font:var(--type-label); font-variant-numeric:tabular-nums; }
.badge.warn { background:var(--highlight-soft); color:var(--warn-text); box-shadow:inset 0 0 0 1px var(--highlight-edge); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--c); display:inline-block; flex:none; }
.dot.ring { box-shadow:0 0 0 1px var(--surface), 0 0 0 2px var(--text-muted); }
.warnchip, .flagchip { display:inline-flex; align-items:center; gap:var(--s-2); height:20px; padding:0 7px; border-radius:var(--r-pill); font:var(--type-label); letter-spacing:var(--ls-label); white-space:nowrap; }
.warnchip { background:var(--highlight-soft); color:var(--warn-text); box-shadow:inset 0 0 0 1px var(--highlight-edge); }
.flagchip { background:var(--danger-soft); color:var(--danger); box-shadow:inset 0 0 0 1px var(--danger); }
.warnchip svg, .flagchip svg { width:12px; height:12px; stroke-width:2; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); min-width:0; }
.card-h { display:flex; align-items:center; gap:var(--s-3); min-height:40px; padding:var(--s-2) var(--s-3) var(--s-2) var(--s-5); border-bottom:1px solid var(--border-subtle); min-width:0; }
.card-h h3 { font:var(--type-section); letter-spacing:var(--ls-body); white-space:nowrap; }
.card-h .n { font:var(--type-small); letter-spacing:var(--ls-label); color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.card-h .end { margin-left:auto; display:flex; align-items:center; gap:6px; flex:none; }
.card-b { padding:var(--s-4) var(--s-5); }
.empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:var(--s-6) var(--s-4); color:var(--text-muted); font:var(--type-dense); letter-spacing:var(--ls-dense); text-align:center; }
.empty svg { width:20px; height:20px; stroke-width:1.5; color:var(--text-faint); }
.empty.line { flex-direction:row; padding:var(--s-3) var(--s-5); justify-content:flex-start; }
.well { background:var(--surface-sunk); border:1px solid var(--border-subtle); border-radius:var(--r-lg); padding:var(--s-4); }
.row { display:flex; align-items:center; gap:var(--s-3); flex-wrap:wrap; }
.kv { display:grid; grid-template-columns:96px 1fr; gap:var(--s-2) var(--s-3); margin:0; font:var(--type-dense); letter-spacing:var(--ls-dense); }
.kv dt { color:var(--text-muted); }
.kv dd { margin:0; min-width:0; }
.sect { font:var(--type-section); margin:var(--s-5) 0 var(--s-3); }
.sect:first-child { margin-top:0; }
.planband { display:flex; align-items:center; gap:var(--s-3); height:32px; padding:0 var(--s-6); background:var(--plan-band); border-bottom:1px solid var(--plan-edge); font:var(--type-dense); letter-spacing:var(--ls-dense); color:var(--warn-text); position:sticky; top:0; z-index:6; }
.planband b { font-weight:600; }
.demo-flip { display:inline-flex; align-items:center; gap:var(--s-3); padding:var(--s-1) var(--s-1) var(--s-1) var(--s-3); border:1px dashed var(--guide-edge); background:var(--guide-bg); border-radius:var(--r-lg); font:var(--type-label); letter-spacing:var(--ls-label); color:var(--warn-text); }
.banner { display:flex; align-items:center; gap:var(--s-3); padding:var(--s-3) var(--s-4); background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--highlight-edge); border-radius:var(--r-lg); font:var(--type-dense); margin-bottom:var(--s-5); }
.banner svg { width:16px; height:16px; color:var(--warn-text); }

/* ---------- Faceplates ---------- */
.face { width:100%; display:flex; justify-content:center; --j:40px; }
.plate { display:inline-block; max-width:100%; background:var(--steel-1); border-radius:var(--r-sm); padding:10px var(--s-4) var(--s-4); box-shadow:inset 0 0 0 1px var(--hw-rim); }
.plate-top { display:flex; justify-content:space-between; align-items:center; gap:var(--s-4); margin-bottom:var(--s-3); }
.tape { display:inline-block; background:var(--tape); color:var(--tape-ink); border-radius:var(--r-hw); padding:0 6px; font:var(--type-tape); letter-spacing:var(--ls-tape); line-height:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.plate-count { font:var(--type-small); letter-spacing:var(--ls-label); color:var(--steel-7); white-space:nowrap; }
.groups { display:flex; gap:var(--s-5); align-items:flex-end; }
.face.wrapg .groups { flex-wrap:wrap; }
.glab { font:var(--type-hw); letter-spacing:var(--ls-hw); color:var(--steel-7); margin-bottom:10px; white-space:nowrap; }
.ports { display:grid; grid-auto-flow:column; grid-template-rows:repeat(var(--rows,2), var(--j)); grid-auto-columns:var(--j); gap:var(--jgap); }
.jack { flex:none; position:relative; display:grid; place-items:center; width:var(--j); height:var(--j); font-family:var(--mono); font-weight:500; font-variant-numeric:tabular-nums; font-size:clamp(11px, calc(var(--j) * 0.32), 16px); border-radius:var(--jack-r); background:var(--socket); color:var(--socket-ink); box-shadow:var(--jack-edge); padding:0; }
.jack:hover { filter:brightness(0.94); }
.jack.cab { background:var(--c); color:var(--num, #fff); box-shadow:inset 0 0 0 1px #ffffff2e; }
.look-old .jack.cab { box-shadow:none; }
.jack.route { background:var(--route-jack); color:#fff; box-shadow:inset 0 0 0 1px #ffffff2e; }
.jack.route::after { content:''; position:absolute; left:6px; right:6px; bottom:4px; height:2px; border-radius:1px; background:#fff; }
.jack.fault { background:repeating-linear-gradient(135deg, var(--socket) 0 4px, var(--fault-hatch) 4px 7px); box-shadow:inset 0 0 0 2px #b4361f; color:#8f2a17; }
.jack.prop { background:var(--proposed-steel-bg); color:var(--proposed-on-steel); box-shadow:none; outline:1.5px dashed var(--proposed-on-steel); outline-offset:-1.5px; }
.jack.sel { box-shadow:var(--jack-sel); z-index:1; }
.jack.prop.sel { outline-offset:-1.5px; }
.jack.lit { outline:2px solid var(--halo-on-steel); outline-offset:1px; }
.jack.muted { opacity:0.35; }
.jack:focus-visible { outline:2px solid var(--focus-on-steel); outline-offset:2px; }
.jack .up { position:absolute; top:-6px; right:-5px; width:13px; height:13px; border-radius:50%; background:#fff; color:var(--steel-1); display:grid; place-items:center; box-shadow:0 0 0 1px var(--steel-1); }
.jack .up svg { width:9px; height:9px; stroke-width:3; }
.ports > .jack:nth-child(even) .up { top:auto; bottom:-6px; }
.ports[style*='--rows:1'] > .jack .up { top:-6px; bottom:auto; }
.look-old .jack .up { width:auto; height:auto; background:none; box-shadow:none; color:currentColor; top:0; right:3px; font:600 11px var(--sans); }
.hdf { display:grid; grid-template-columns:18px repeat(4, auto); gap:var(--jgap) 10px; align-items:center; }
.hdf .colh, .hdf .rowh { font:var(--type-hw); color:var(--steel-7); text-align:center; }
.hdf .b6 { display:grid; grid-template-columns:repeat(6, var(--j)); gap:var(--jgap); }
.noports { padding:var(--s-4) var(--s-5); color:var(--steel-7); font:var(--type-dense); }
.legend { display:flex; flex-wrap:wrap; gap:6px var(--s-5); align-items:center; margin-top:var(--s-4); font:var(--type-small); letter-spacing:var(--ls-label); color:var(--text-muted); }
.legend > span { display:inline-flex; align-items:center; gap:6px; }
.legend i { display:inline-block; width:14px; height:14px; border-radius:var(--r-hw); }

/* ---------- The rack ---------- */
.cab { background:var(--steel-1); border-radius:var(--r-sm); padding:6px 6px 6px 0; width:100%; --u:22px; box-shadow:inset 0 0 0 1px var(--hw-rim); }
.urow { display:grid; grid-template-columns:44px minmax(0,1fr); height:var(--u); padding:1px 0; }
.un { font:var(--type-unit); font-variant-numeric:tabular-nums; color:var(--steel-6); text-align:right; padding-right:6px; align-self:center; white-space:nowrap; }
.un.five { color:var(--steel-8); }
.blk { position:relative; height:100%; width:100%; display:flex; align-items:center; gap:6px; padding:0 6px 0 10px; background:var(--steel-2); box-shadow:inset 0 0 0 1px var(--steel-4); border-radius:var(--r-hw); overflow:hidden; min-width:0; }
.blk::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--stripe, var(--steel-5)); }
.blk .tape { line-height:min(18px, calc(var(--u) - 6px)); max-width:calc(100% - 40px); }
.blk .bm { margin-left:auto; font:var(--type-hw); letter-spacing:var(--ls-hw); color:var(--steel-7); white-space:nowrap; }
.blk:hover { box-shadow:inset 0 0 0 1px var(--steel-5); }
.blk.item { background:#252e39; }
.blk.chosen { box-shadow:inset 0 0 0 2px var(--focus-on-steel); }
.blk.prop { background:var(--proposed-steel-bg); box-shadow:none; outline:1.5px dashed var(--proposed-on-steel); outline-offset:-1.5px; }
.blk.prop .bm { color:var(--proposed-on-steel); }
.blk.muted { opacity:0.4; }
.look-old .blk::before { display:none; }
.look-old .blk { padding-left:6px; }
.look-old .blk .bm { display:none; }
.slot { height:100%; border:1px dashed var(--slot-line); border-radius:var(--r-hw); }
.slot.run { display:flex; align-items:center; justify-content:center; font:var(--type-unit); color:var(--slot-ink); }
.slot.drop { border-color:#8a7a4a; cursor:copy; }

/* ---------- Mini racks (node level) ---------- */
.mgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:var(--s-5); align-items:start; }
.mrack { display:block; width:100%; padding:var(--s-4); cursor:pointer; text-align:left; transition:border-color var(--dur-instant) var(--ease-standard); }
.mrack:hover { border-color:var(--border-strong); box-shadow:var(--shadow-1); }
.mrack-h { display:flex; align-items:baseline; justify-content:space-between; gap:var(--s-3); margin-bottom:var(--s-3); }
.mrack-h b { font:var(--type-section); }
.mrack-h span { font:var(--type-small); letter-spacing:var(--ls-label); color:var(--text-muted); }
.mwell { background:var(--hw-well); border-radius:var(--r-md); }
.mcab { background:var(--steel-1); border-radius:var(--r-sm); padding:4px 4px 4px 0; --mu:16px; box-shadow:inset 0 0 0 1px var(--hw-rim); }
.mrow { display:grid; grid-template-columns:40px minmax(0,1fr); height:calc(var(--mu) * var(--h,1)); padding:1px 0; }
.mu { font:var(--type-hw); font-family:var(--mono); color:var(--steel-6); text-align:right; padding-right:5px; align-self:center; white-space:nowrap; }
.mblk { position:relative; display:flex; align-items:center; height:100%; width:100%; padding:0 var(--s-2) 0 9px; background:var(--steel-2); border:1px solid transparent; border-radius:var(--r-hw); overflow:hidden; min-width:0; }
.mblk::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--stripe, var(--steel-5)); }
.mblk:hover { border-color:var(--focus-on-steel); }
.mblk.item { background:#252e39; }
.mblk.prop { background:var(--proposed-steel-bg); border:1px dashed var(--proposed-on-steel); }
.mblk.muted { opacity:0.4; }
.mtape { font:var(--type-hw); letter-spacing:var(--ls-hw); color:var(--steel-hi); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mfree { height:100%; border:1px dashed var(--steel-4); border-radius:var(--r-hw); display:flex; align-items:center; justify-content:center; font:var(--type-hw); color:var(--steel-7); }
.look-old .mcab { --mu:7px; padding:3px; }
.look-old .mrow { grid-template-columns:1fr; }
.look-old .mu, .look-old .mtape, .look-old .mfree span { display:none; }
.look-old .mblk::before { display:none; }
.look-old .mblk { background:#3a4552; }
.look-old .mfree { border:0; border-bottom:1px solid #2c3540; border-radius:0; }

/* ---------- Rack level and equipment page ---------- */
.rk-grid { display:grid; grid-auto-rows:min-content; grid-template-columns:230px minmax(0,1fr) 300px; gap:var(--s-5); align-items:start; }
.rk-grid.narrow { grid-template-columns:210px minmax(0,1fr); }
.rk-grid.narrow > :first-child { grid-row:span 2; }
.rk-grid.narrow .side { grid-column:2; }
.eq-grid { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:var(--s-5); align-items:start; }
.eq-grid.narrow { grid-template-columns:minmax(0,1fr); }
.side { display:grid; gap:var(--s-5); min-width:0; }
.rk-note { margin:var(--s-3) 0 0; font:var(--type-small); letter-spacing:var(--ls-label); color:var(--text-muted); }
.rackwell { background:var(--hw-well); border-radius:var(--r-md); }
.facebox { padding:var(--s-5); background:var(--hw-well); border-radius:0 0 var(--r-lg) var(--r-lg); }
.ct-row { display:flex; align-items:center; gap:var(--s-3); width:100%; padding:var(--s-3) var(--s-5); font:var(--type-dense); letter-spacing:var(--ls-dense); border-top:1px solid var(--border-subtle); }
.ct-row:first-child { border-top:0; }
.ct-row:hover { background:var(--surface-hover); }
.ct-row.on { background:var(--highlight-soft); box-shadow:inset 2px 0 0 var(--highlight-edge); }
.ct-row b { font-weight:600; }
.ct-row .pl { color:var(--text-muted); font:var(--type-small); letter-spacing:var(--ls-label); }
.ct-row .c { margin-left:auto; font:var(--type-code); }
.peer { background:var(--surface-sunk); border:1px solid var(--border-subtle); border-radius:var(--r-md); padding:var(--s-3) var(--s-4); margin:var(--s-4) 0; font:var(--type-dense); }
.peer b { font-weight:600; }
.peer div { color:var(--text-muted); font:var(--type-small); letter-spacing:var(--ls-label); margin-top:2px; }
.actions { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:var(--s-4); }

/* ---------- Path card ---------- */
.pathcard { margin-top:var(--s-5); }
.path-b { padding:var(--s-3) var(--s-4) var(--s-4); }
.path { display:flex; align-items:flex-start; min-width:0; }
.place { background:var(--hw-well); border:1px solid var(--border-subtle); border-radius:var(--r-lg); padding:6px var(--s-3) var(--s-3); min-width:0; }
.place-name { font:var(--type-small); letter-spacing:var(--ls-label); line-height:18px; color:var(--text-muted); margin:0 0 6px 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.place-in { display:flex; align-items:flex-start; min-width:0; }
.pcell { display:flex; flex-direction:column; align-items:center; flex:1 1 0; min-width:0; }
.pplate { display:block; width:100%; max-width:200px; min-width:92px; background:var(--steel-1); border-radius:var(--r-sm); padding:var(--s-3) 10px; color:var(--steel-7); text-align:left; box-shadow:inset 0 0 0 1px var(--hw-rim); }
.pplate:hover { background:#26303b; }
.pplate .prow { display:flex; justify-content:space-between; align-items:center; gap:6px; min-width:0; }
.pplate .kind { font:var(--type-hw); letter-spacing:var(--ls-hw); white-space:nowrap; }
.pplate .pjs { display:flex; justify-content:space-between; align-items:center; gap:6px; margin:var(--s-3) 0 var(--s-2); height:28px; }
.pj { width:28px; height:28px; display:grid; place-items:center; background:var(--steel-3); color:#fff; font:var(--type-code-sm); font-weight:500; border-radius:var(--r-hw); flex:none; }
.pplate .pair { flex:1; border-top:2px dotted var(--steel-6); }
.pplate .sides { display:flex; justify-content:space-between; gap:6px; font:var(--type-hw); letter-spacing:var(--ls-hw); white-space:nowrap; overflow:hidden; }
.pplate.here { box-shadow:0 0 0 2px var(--hw-well), 0 0 0 4px var(--focus); }
.pplate.here .pj.at { background:var(--socket); color:var(--socket-ink); }
.pplate.end { box-shadow:inset 0 0 0 1px var(--hw-rim), 0 0 0 2px var(--route); }
.ptag { margin-top:6px; display:inline-flex; align-items:center; gap:var(--s-2); padding:1px var(--s-3); border-radius:var(--r-pill); font:var(--type-label); letter-spacing:var(--ls-label); font-weight:600; white-space:nowrap; }
.ptag svg { width:12px; height:12px; stroke-width:2; }
.ptag.reach { color:var(--route-text); background:var(--route-soft); }
.wire { position:relative; flex:0 1 56px; min-width:28px; height:28px; margin-top:36px; border-radius:var(--r-sm); }
.wire.between { margin-top:66px; }
.wire i { position:absolute; left:3px; right:3px; top:13px; height:2px; background:var(--c); border-radius:2px; transition:height var(--dur-instant), top var(--dur-instant); }
.wire i::before, .wire i::after { content:''; position:absolute; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--c); }
.wire i::before { left:-3px; } .wire i::after { right:-3px; }
.wire:hover i, .wire.on i { height:4px; top:12px; }
.wire:hover { background:var(--wire-hover); }
.wire.on { background:var(--wire-on); }
.wire.prop i { background:repeating-linear-gradient(90deg, var(--c) 0 5px, transparent 5px 9px); }
.path-end-note { margin:var(--s-3) 0 0 var(--s-1); font:var(--type-small); letter-spacing:var(--ls-label); color:var(--text-muted); }

/* ---------- Cable card (popover) ---------- */
.pop { position:fixed; z-index:70; width:300px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow-2); padding:var(--s-4) var(--s-4) var(--s-4) var(--s-5); }
.pop-h { display:flex; align-items:center; gap:var(--s-3); margin-bottom:var(--s-3); }
.pop-h h3 { font:var(--type-section); }
.pop-h h3.mono { font-family:var(--mono); }
.pop-h .iconbtn { margin-left:auto; }
.pop .kv { grid-template-columns:64px 1fr; margin-bottom:var(--s-4); }

/* ---------- Sites and the site screen ---------- */
.sgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:var(--s-5); }
.scard { display:block; width:100%; padding:var(--s-5); text-align:left; }
.scard:hover { border-color:var(--border-strong); box-shadow:var(--shadow-1); }
.scard b { display:block; font:var(--type-card); margin-bottom:var(--s-1); }
.scard .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--s-4); }
.canvas { position:relative; height:560px; border:1px solid var(--border); border-radius:var(--r-lg); background:var(--surface-page) radial-gradient(var(--dots) 1px, transparent 1px) 0 0 / 16px 16px; overflow:hidden; touch-action:none; }
.canvas svg.lines { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.ncard { position:absolute; width:236px; padding:var(--s-3) var(--s-4) var(--s-4); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); cursor:pointer; user-select:none; touch-action:none; display:flex; flex-direction:column; gap:var(--s-1); }
.ncard:hover { border-color:var(--border-strong); box-shadow:var(--shadow-1); }
.ncard.drag { cursor:grabbing; box-shadow:var(--shadow-2); border-color:var(--text); z-index:5; }
.ncard-h { display:flex; align-items:center; justify-content:space-between; font:var(--type-small); letter-spacing:var(--ls-label); color:var(--text-muted); }
.ncard-h svg { width:14px; height:14px; color:var(--text-faint); cursor:grab; stroke-width:2; }
.ncard b { font:var(--type-card); }
.ncard .dense { color:var(--text-muted); }
.ncard .chips { display:flex; flex-wrap:wrap; gap:var(--s-2); margin:var(--s-2) 0; }
.ltag { font:var(--type-small); letter-spacing:var(--ls-label); fill:var(--text-muted); }

/* ---------- Conceptual ---------- */
.tr-strip { position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:var(--s-5); height:44px; padding:0 var(--s-6); background:var(--surface); border-bottom:1px solid var(--border); font:var(--type-dense); }
.tr-strip b { font-weight:600; }
.tree { position:relative; min-height:600px; background:radial-gradient(var(--dots) 1px, transparent 1px) 0 0 / 16px 16px; }
.lane { position:absolute; top:0; bottom:0; background:var(--lane); border-left:1px solid var(--border-subtle); border-right:1px solid var(--border-subtle); opacity:0.7; }
.lane-h { position:absolute; top:var(--s-4); font:var(--type-label); letter-spacing:var(--ls-label); color:var(--text-muted); }
.hc { position:absolute; display:flex; align-items:center; gap:var(--s-3); height:36px; padding:0 var(--s-4); background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); font:var(--type-dense); letter-spacing:var(--ls-dense); white-space:nowrap; }
.hc b { font-weight:600; }
.hc .end { margin-left:auto; display:flex; gap:6px; align-items:center; }
.hc .n { font:var(--type-code); color:var(--text-muted); }
.hc.click { cursor:pointer; }
.hc.click:hover { border-color:var(--border-strong); background:var(--surface-hover); }
.hc.lit { border:1.5px solid var(--route); background:var(--route-soft); }
.hc.lit b { color:var(--route-text); }
.hc.sel { border:2px solid var(--g12); box-shadow:var(--shadow-1); background:var(--surface-selected); }
.hc.dim { color:var(--text-faint); border-color:var(--border-subtle); background:var(--surface-sunk); }
.hc.dim .warnchip, .hc.dim .flagchip { background:transparent; color:var(--text-faint); box-shadow:inset 0 0 0 1px var(--border); }
.badge2 { font:var(--type-label); letter-spacing:var(--ls-label); padding:0 6px; border:1px solid var(--border); border-radius:var(--r-pill); background:var(--surface-sunk); }
.tree > svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.swrow { display:flex; align-items:center; gap:var(--s-3); padding:var(--s-3); border:1px solid var(--border-subtle); background:var(--surface-sunk); border-radius:var(--r-md); margin-bottom:6px; font:var(--type-dense); }
.swrow b { font-weight:600; white-space:nowrap; }
.swrow .to { flex:1; color:var(--text-muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.swrow .btn { margin-left:auto; }

/* ---------- Dock panels ---------- */
.netlist { list-style:none; margin:0 0 var(--s-4); padding:0; }
.netrow { display:flex; align-items:center; gap:var(--s-3); padding:var(--s-3) 0; border-top:1px solid var(--border-subtle); }
.netlist li:first-child .netrow { border-top:0; }
.netrow .nm { flex:1; min-width:0; }
.netrow .nm b { display:block; font:var(--type-dense); font-weight:600; }
.netrow .nm span { display:block; font:var(--type-small); letter-spacing:var(--ls-label); color:var(--text-muted); }
.swatch { width:28px; height:28px; border-radius:var(--r-md); background:var(--c); box-shadow:inset 0 0 0 1px var(--swatch-ring); flex:none; }
button.swatch:hover { box-shadow:inset 0 0 0 1px var(--swatch-ring), 0 0 0 2px var(--surface), 0 0 0 4px var(--border-strong); }
button.swatch[aria-expanded='true'] { box-shadow:inset 0 0 0 1px var(--swatch-ring), 0 0 0 2px var(--surface), 0 0 0 4px var(--g12); }
.netwell { margin:0 0 var(--s-3); }
.pk-row { display:flex; align-items:center; gap:var(--s-3); }
.pk-row input[type=color] { width:44px; height:34px; padding:2px; border:1px solid var(--border-field); border-radius:var(--r-md); background:var(--surface); cursor:pointer; }
.pk-row .field { width:110px; font-family:var(--mono); }
.pk-sw { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; margin:var(--s-4) 0 var(--s-2); }
.pk-sw button { height:26px; border-radius:var(--r-sm); background:var(--c); box-shadow:inset 0 0 0 1px var(--swatch-ring); display:grid; place-items:center; font:var(--type-code-sm); font-weight:500; color:var(--num); }
.pk-sw button:hover { outline:2px solid var(--focus); outline-offset:1px; }
.pk-try { display:flex; align-items:center; gap:6px; margin:0 0 var(--s-4); font:var(--type-small); letter-spacing:var(--ls-label); color:var(--text-muted); flex-wrap:wrap; }
.pk-try button { display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 8px; border:1px solid var(--border); border-radius:var(--r-pill); font:var(--type-small); letter-spacing:var(--ls-label); color:var(--text); background:var(--surface); }
.pk-try button:hover { border-color:var(--border-strong); background:var(--surface-hover); }
.pk-prev { display:flex; gap:3px; align-items:center; margin-left:auto; padding:4px; border-radius:var(--r-sm); background:var(--steel-1); box-shadow:inset 0 0 0 1px var(--hw-rim); }
.pk-prev i { width:24px; height:24px; border-radius:var(--r-hw); background:var(--c); color:var(--num); display:grid; place-items:center; font:500 11px/1 var(--mono); font-style:normal; box-shadow:inset 0 0 0 1px #ffffff2e; }
.pk-prev i.free { background:var(--socket); color:var(--socket-ink); box-shadow:var(--jack-edge); }
.pk-facts { margin:0 0 var(--s-3); font:var(--type-small); letter-spacing:var(--ls-label); color:var(--text-muted); }
.pk-warn { display:flex; gap:var(--s-3); align-items:flex-start; padding:var(--s-3) var(--s-4); margin-bottom:var(--s-4); border-radius:var(--r-md); background:var(--highlight-soft); color:var(--warn-text); box-shadow:inset 0 0 0 1px var(--highlight-edge); font:var(--type-dense); }
.pk-warn ul { margin:0; padding-left:16px; }
.pk-warn li + li { margin-top:4px; }
.pk-warn svg { width:16px; height:16px; margin-top:1px; }
.pk-ok { display:flex; gap:var(--s-3); align-items:center; margin-bottom:var(--s-4); font:var(--type-small); letter-spacing:var(--ls-label); color:var(--text-muted); }
.pk-ok svg { width:14px; height:14px; color:var(--success); stroke-width:2; }
.refuse { display:flex; gap:var(--s-3); align-items:flex-start; }
.refuse svg { width:16px; height:16px; margin-top:2px; color:var(--danger); }

  const o = OCC[`${eqId}|${j}|${side}`];
  return o && routeVis(o.r) ? o : null;
}
function cableAt(eqId, j, side) {
  const o = occ(eqId, j, side);
  if (!o) return null;
  const h = o.r.hops[o.i];
  if (h.inS === side && o.i > 0) return { cable: CABLES[o.r.cables[o.i - 1]], peer: o.r.hops[o.i - 1], peerSide: o.r.hops[o.i - 1].outS, o };
  if (h.outS === side && o.i < o.r.hops.length - 1) return { cable: CABLES[o.r.cables[o.i]], peer: o.r.hops[o.i + 1], peerSide: o.r.hops[o.i + 1].inS, o };
  return null;
}
const uplinks = (eqId) => ROUTES.filter((r) => r.hops[0].eq === eqId && r.end && routeVis(r));
function rackItems(rid) { return EQ_ORDER.map((id) => EQ[id]).filter((e) => e.rack === rid && visible(e)); }
function rackRows(rid, collapse) {
  const r = RACKS[rid];
  const cover = {};
  rackItems(rid).forEach((e) => { for (let u = e.u; u > e.u - e.h; u--) cover[u] = e; });
  const rows = [];
  let u = r.h;
  while (u >= 1) {
    const e = cover[u];
    if (e) { rows.push({ eq: e, u: e.u, h: e.h }); u = e.u - e.h; continue; }
    const start = u;
    while (u >= 1 && !cover[u]) u--;
    const len = start - u;
    if (collapse && len >= 3) rows.push({ run: [start, u + 1], len, h: 1 });
    else for (let x = start; x > u; x--) rows.push({ free: x, h: 1 });

}
const usedU = (rid) => rackItems(rid).reduce((s, e) => s + e.h, 0);
function connectsTo(eqId) {
  const m = new Map();
  ports(EQ[eqId]).forEach((p) => {
    for (const side of ['front', 'rear']) {

function switchCounts(netId) {

/* The "too close" rule (research §4.4): under ΔE 8 (OKLab × 100) to another network,
   under ΔE 10 to a state colour, or neither white nor ink numbers reaching 4.5:1. Warnings, never refusals. */
function closeness(selfId, hex) {
  const others = S.nets.filter((n) => n.id !== selfId);
  const near = others.map((n) => ({ d: dE(hex, n.color), name: n.name })).sort((a, b) => a.d - b.d)[0];
  const st = stateColors().map((s) => ({ d: dE(hex, s.c), name: s.name, th: s.th })).sort((a, b) => a.d - b.d)[0];
  const num = numColor(hex);
  const nc = contrast(hex, num);
  const warns = [];
  if (near && near.d < 8) warns.push(`Very close to ${esc(near.name)} (ΔE ${near.d.toFixed(1)}, under 8).`);
  if (st.d < 10) warns.push(`Looks like the ${esc(st.name)} colour${st.th === 'light' || st.th === 'dark' ? ` (as drawn in ${st.th})` : ''} (ΔE ${st.d.toFixed(1)}, under 10); people may read it as that state.`);
  if (nc < 4.5) warns.push(`Jack numbers will be hard to read on it (best is ${num === '#ffffff' ? 'white' : 'ink'} at ${fmt(nc)}:1, under 4.5).`);
  return { near, st, num, nc, warns, steel: contrast(hex, '#1f2731') };
}
function warnHtml(selfId, hex) {
  if (!/^#[0-9a-f]{6}$/i.test(hex)) return `<p class="err" style="margin:0 0 12px">Type a colour as # and six hex digits, like #2f6fdb.</p>`;
  const c = closeness(selfId, hex.toLowerCase());
  const facts = `<p class="pk-facts">Numbers in ${c.num === '#ffffff' ? 'white' : 'ink'} ${fmt(c.nc)}:1 · on the steel plate ${fmt(c.steel)}:1 · nearest network ${c.near ? `${esc(c.near.name)} ΔE ${c.near.d.toFixed(1)}` : '—'} · nearest state ${esc(c.st.name)} ΔE ${c.st.d.toFixed(1)}</p>`;
  if (!c.warns.length) return facts + `<div class="pk-ok">${ic('check')}Easy to tell apart from the other networks and the state colours, in light and in dark.</div>`;
  return facts + `<div class="pk-warn" role="status">${ic('alert')}<div><ul>${c.warns.map((w) => `<li>${w}</li>`).join('')}</ul><div style="margin-top:6px">You can still use it.</div></div></div>`;
}

      <div class="fontnote"><div class="big">EDGE-17 <bdi lang="he">מתג קומה 2</bdi> <span class="mono">Gi1/0/1 Il1 0O</span></div>
      <p class="lk-lede">The font question is closed (D33, and the research of 2026-11-26 compared Inter, Geist, Source Sans 3, Noto Sans, Rubik, Assistant and Heebo). Plex stays because its Hebrew is drawn to the same x-height and cap height as its Latin, its serifed I and flagged 1 keep Gi1/0/1 from reading as Gil/0/l, the mono zero has a dot, and its digits line up in columns with no setting. IBM's Carbon type scale is tuned for it, so the sizes and letter-spacing below are Carbon's.</p></div></div></section>

    <section class="card lk-sec" id="lk-type"><div class="card-h"><h3>One type scale: one size per job</h3><span class="n">11 · 12 · 13 · 14 · 16 · 20, weights 400 · 500 · 600</span></div><div class="card-b">
      <p class="lk-lede">Every page uses these and nothing else: the breadcrumb in 12, the page title in 20/600, the meta line in 13, panel headings in 14/600. Letter-spacing is a little looser when small and none from 16px up.</p>${scaleTable}</div></section>

      <p class="lk-lede">All numbers are computed in this page from the theme tokens. In dark, the paper turns into deep neutral greys (the floor is the darkest, cards one step up), text is light, and each state colour is retuned to keep its ratios. The steel, the tape labels and the network colours on jacks are the same in both themes; in dark the hardware sits in a darker well with a lit rim, so it keeps its frame. One value is kept from the specimen with a rule: faint text (g10) is 4.57:1 on a card but 4.06:1 on the light floor, so faint text is used only on cards and panels, never on the floor.</p>
      <h4 class="lk-sub">Twelve greys, each with one job</h4>${themedPair(ramp)}
      <h4 class="lk-sub">Surfaces</h4>${themedPair(surfaces)}
      <h4 class="lk-sub">State colours as solid, text and soft</h4>${themedPair(triples)}
      <h4 class="lk-sub">Steel (racks, faceplates, HDFs only), the same in both themes</h4>${steel}

      <p class="lk-lede">1–6 share one brightness (white numbers 4.7:1 or more, 3:1 against the steel). 7–10 are a lighter row with ink numbers, 11–12 a deep row that relies on the jack's light edge on steel. Every pair is at least ΔE 8 apart. Against the state colours (both themes' values are checked, and the dark ones were tuned so no default falls closer in dark than in light), two defaults sit under 10 in the research's own table: Green is 8.1 from success and Sky 8.7 from unresolved; both are kept, since success never appears on hardware and unresolved is only ever dashed. On paper, a dot under 3:1 against the card gets a thin ring (the light row in light, the deep row in dark). Try the colour vision: blues and purples merge, which is why a network's name is always shown beside its colour.</p>
      <div class="row">${cvdSeg}<span class="hint" style="margin:0">Simulation applies to the cards below.</span></div>

      <p class="hint">Motion: 80ms for hover and press, 120ms for tooltips, 160ms for menus, 240ms for the dock, with Carbon's curves; none when the system asks for reduced motion.</p></div></section>
  </div></div>`;
}

/* =====================================================================
   Render
   ===================================================================== */
function pageHtml() {
  if (S.view === 'look') return lookPage();
  if (S.view === 'conceptual') return conceptualPage();
  if (S.view === 'inventory') return invPage();
  const lv = S.phys.level;
  return lv === 'sites' ? sitesPage() : lv === 'site' ? sitePage() : lv === 'node' ? nodePage() : lv === 'rack' ? rackPage() : eqPage();
}
const pageKey = () => JSON.stringify([S.view, S.view === 'physical' ? S.phys : S.inv.list]);
let lastKey = '';
function render() {
  const pageEl = document.querySelector('.page');
  const keep = pageEl && lastKey === pageKey() ? pageEl.scrollTop : 0;
  const dockEl = document.getElementById('dockb');
  const dockKeep = dockEl ? dockEl.scrollTop : 0;
  const app = document.getElementById('app');
  app.className = `look-${S.view === 'physical' ? S.look : 'new'}${plan() ? ' plan' : ''}`;
  const band = plan() ? `<div class="planband">${ic('branch')}<b>Plan: Expansion</b><span>· ${plural(S.changes.length, 'change')} · proposed items are dashed; nothing here is installed</span></div>` : '';
  app.innerHTML = header() + rail() + dock() + `<main class="page" id="page">${band}${pageHtml()}</main>` + rowMenu();
  const p2 = document.querySelector('.page');
  p2.scrollTop = keep;
  const d2 = document.getElementById('dockb');
  if (d2) d2.scrollTop = dockKeep;
  lastKey = pageKey();
  renderPop();
  fit();
  if (S.netUI.rename) { const i = document.getElementById('renameIn'); if (i) { i.focus(); i.select(); } }
  if (S.netUI.adding) { const i = document.getElementById('newNet'); if (i && document.activeElement !== i) i.focus(); }
}
function fit() {
  const grid = document.getElementById('workgrid');
  if (grid) grid.classList.toggle('narrow', grid.clientWidth < (grid.classList.contains('eq-grid') ? 900 : 1200));
  document.querySelectorAll('.face[data-fit]').forEach(fitFace);
  const cab = document.getElementById('rackfit');
  if (cab) {
    const units = +cab.dataset.units;
    const pc = document.querySelector('.pathcard');
    const pcH = pc ? pc.offsetHeight + 16 : 0;
    const top = cab.getBoundingClientRect().top;
    const avail = window.innerHeight - top - pcH - 24 - 28;
    cab.style.setProperty('--u', Math.max(18, Math.min(28, Math.floor(avail / units))) + 'px');
  }
}
function fitFace(face) {
  const box = face.parentElement;
  const cs = getComputedStyle(box);
  const avail = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2;
  const old = S.look === 'old' && S.view === 'physical';
  const g = old ? 2 : 3;
  const kind = face.dataset.fit;
  let j;
  face.classList.remove('wrapg');
  if (kind === 'switch') {
    const cols = face.dataset.cols.split(',').map(Number);
    const C = cols.reduce((a, b) => a + b, 0), G = cols.length;
    j = (avail - 24 - (G - 1) * 16 + G * g) / C - g;
    if (j < 24 && G > 1) { face.classList.add('wrapg'); j = (avail - 24 + g) / Math.max(...cols) - g; }
    j = Math.min(old ? 56 : 44, j);
  } else if (kind === 'panel') {
    j = Math.min(56, (avail - 24 + g) / +face.dataset.cols - g);
  } else {
    j = Math.min(60, (avail - 24 - 18 - 30 - 10 + 4 * g) / 24 - g);
  }
  face.style.setProperty('--j', Math.max(20, Math.floor(j)) + 'px');
}

/* ---------- Cable card ---------- */
function renderPop() {
  const el = document.getElementById('pop');
  if (!S.pop) { el.innerHTML = ''; return; }
  const c = CABLES[S.pop.cable];
  const end = (x) => `${bdi(x.eq)} <span class="mono">${esc(x.j)}</span>${EQ[x.eq].kind !== 'switch' ? ' ' + x.side : ''}`;
  const left = Math.max(8, Math.min(window.innerWidth - 308, S.pop.x - 150));
  const below = S.pop.y + 16;
  const top = below + 230 > window.innerHeight ? S.pop.y - 240 : below;
  el.innerHTML = `<div class="pop" role="dialog" aria-label="Cable ${c.id}" style="left:${left}px;top:${top}px">
    <div class="pop-h"><h3 class="mono">Cable ${c.id}</h3>${c.prop ? '<span class="chip prop">Proposed</span>' : '<span class="chip">Installed</span>'}<button class="iconbtn" data-act="closepop" aria-label="Close">${ic('x')}</button></div>
    <dl class="kv"><dt>Network</dt><dd>${dot(c.net)} ${bdi(netName(c.net))}</dd><dt>From</dt><dd>${end(c.from)}</dd><dt>To</dt><dd>${end(c.to)}</dd><dt>Notes</dt><dd>${c.notes ? esc(c.notes) : '<span class="faint">None</span>'}</dd></dl>
    <button class="btn sm" data-act="gocable" data-cable="${c.id}">Go to cable ${ic('arrowr')}</button></div>`;
}
let toastT;
function toast(t) {
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="toast" role="status">${esc(t)}</div>`;
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.innerHTML = ''; }, 3200);
}

/* =====================================================================
   Navigation
   ===================================================================== */
const snap = () => JSON.parse(JSON.stringify({ view: S.view, phys: S.phys }));
function go(change) {
  S.back.push(snap());
  if (S.back.length > 40) S.back.shift();
  Object.assign(S, change);
  S.pop = null; S.inv.menu = null; S.netMenu = false;
  render();
}
function goPhys(phys) { go({ view: 'physical', phys: Object.assign({}, S.phys, phys) }); }
function goEqInRack(eqId) {
  const e = EQ[eqId];
  S.chosen[e.rack] = eqId;
  S.inspect = eqId;
  const node = RACKS[e.rack].node;
  goPhys({ level: 'rack', rack: e.rack, node, site: NODES[node].site });
}
function showMap(eqId) {
  const e = EQ[eqId];
  if (e.net) S.net = e.net;
  S.tree.sel = nodeOfEq(eqId);
  S.dock = 'node';
  go({ view: 'conceptual' });
}

/* =====================================================================
   Events
   ===================================================================== */
const ACT = {
  view: (d) => { if (d.v !== S.view) go({ view: d.v }); else render(); },
  mode: (d) => { S.mode = d.m; if (!plan() && (S.dock === 'changes' || S.dock === 'add')) S.dock = null; S.pop = null; render(); },
  theme: (d) => setTheme(d.t),
  look: () => { if (S.view !== 'look') go({ view: 'look' }); },
  lkjump: (d) => { const el = document.getElementById(d.to); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); },
  cvd: (d) => { S.lookCvd = d.k; const w = document.getElementById('cvdwrap'); if (w) w.style.filter = d.k ? `url(#cvd-${d.k})` : 'none'; document.querySelectorAll('[data-act="cvd"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === d.k))); },
  netmenu: () => { S.netMenu = !S.netMenu; render(); },
  setnet: (d) => { S.net = d.n; S.netMenu = false; S.tree.sel = null; if (S.dock === 'node') S.dock = null; render(); },
  managenets: () => { S.netMenu = false; S.dock = 'networks'; render(); },
  rail: (d) => { S.dock = S.dock === d.d ? null : d.d; render(); if (S.dock === 'explore') { const i = document.getElementById('exploreQ'); if (i) i.focus(); } },
  closedock: () => { S.dock = null; render(); },
  flip: (d) => { S.look = d.l; render(); },
  gosites: () => goPhys({ level: 'sites' }),
  gosite: (d) => goPhys({ level: 'site', site: d.site }),
  gonode: (d) => goPhys({ level: 'node', node: d.node, site: NODES[d.node].site }),
  gorack: (d) => { const node = RACKS[d.rack].node; goPhys({ level: 'rack', rack: d.rack, node, site: NODES[node].site }); },
  goeq: (d) => goEqInRack(d.eq),
  mini: (d) => goEqInRack(d.eq),
  choose: (d) => { S.chosen[d.rack] = d.eq; S.inspect = d.eq; S.lit = null; render(); },
  openpage: (d) => { const e = EQ[d.eq]; const node = RACKS[e.rack].node; S.chosen[e.rack] = e.id; S.inspect = e.id; goPhys({ level: 'equipment', eq: e.id, rack: e.rack, node, site: NODES[node].site }); },
  jack: (d) => { S.jack[d.eq] = S.jack[d.eq] === d.j ? undefined : d.j; S.pop = null; render(); },
  clearjack: (d) => { S.jack[d.eq] = undefined; S.pop = null; render(); },
  setside: (d) => { S.side[d.eq] = d.s; render(); },
  flipside: (d) => { S.side[d.eq] = sideOf(d.eq) === 'front' ? 'rear' : 'front'; render(); },
  gopeer: (d) => { const e = EQ[d.eq]; S.jack[d.eq] = d.j; if (e.kind !== 'switch') S.side[d.eq] = d.side; ACT.openpage({ eq: d.eq }); },
  lit: (d) => { S.lit = S.lit && S.lit.eq === d.eq && S.lit.peer === d.peer ? null : { eq: d.eq, peer: d.peer }; render(); },
  cable: (d, ev, el) => { const r = el.getBoundingClientRect(); S.pop = S.pop && S.pop.cable === d.cable ? null : { cable: d.cable, x: r.left + r.width / 2, y: r.top + r.height / 2 }; render(); },
  closepop: () => { S.pop = null; render(); },
  gocable: (d) => { S.inv.list = 'cables'; S.inv.hl = d.cable; S.inv.q = ''; go({ view: 'inventory' }); const row = document.getElementById('row-' + d.cable); if (row) row.scrollIntoView({ block: 'center' }); },
  findagg: () => toast(traceToast),
  back: () => { const s = S.back.pop(); if (!s) return; Object.assign(S, s); S.pop = null; render(); },
  showmap: (d) => showMap(d.eq),
  treesel: (d) => { S.tree.sel = S.tree.sel === d.node ? null : d.node; S.dock = S.tree.sel ? 'node' : S.dock === 'node' ? null : S.dock; render(); },
  inspect: (d) => { S.inspect = d.eq; S.dock = 'inspector'; S.inv.menu = null; render(); },
  openinv: (d) => { S.inv.list = 'equipment'; S.inv.hl = d.eq; S.inv.q = ''; go({ view: 'inventory' }); const row = document.getElementById('row-' + d.eq); if (row) row.scrollIntoView({ block: 'center' }); },
  invlist: (d) => { S.inv.list = d.l; S.inv.hl = null; render(); },
  rowmenu: (d, ev, el) => { const r = el.getBoundingClientRect(); S.inv.menu = S.inv.menu && S.inv.menu.eq === d.eq ? null : { eq: d.eq, x: r.right, y: Math.min(r.bottom + 4, window.innerHeight - 140) }; render(); },
  undo: (d) => {
    const c = S.changes.find((x) => x.id === d.c);
    const dep = S.changes.filter((x) => x.needs === d.c);
    S.changes = S.changes.filter((x) => x.id !== d.c && x.needs !== d.c);
    toast(dep.length ? 'Undid it, and the cable that needed it.' : `Undid: ${c.html.replace(/<[^>]+>/g, '')}`);
    render();
  },
  chggo: (d) => { const c = S.changes.find((x) => x.id === d.c); if (c.cable) ACT.gocable({ cable: c.cable }); else goEqInRack(c.eq); },
  record: () => toast('Record as installed… opens the same review as today.'),
  libitem: () => toast('Adding is shown in the switch models demo; only its place on the rail is new here.'),
  toast: (d) => toast(d.t),
  guide: () => { S.guide = !S.guide; renderGuide(); render(); },
  addnet: () => { S.netUI = { adding: true, err: '' }; render(); },
  addcancel: () => { S.netUI = { adding: false, err: '' }; render(); },
  addok: () => {
    const v = document.getElementById('newNet').value.trim();
    const err = !v ? 'Give the network a name.' : S.nets.some((n) => n.name.toLowerCase() === v.toLowerCase()) ? `A network named ${v} already exists.` : '';
    if (err) { S.netUI.err = err; render(); return; }
    const id = 'N' + Date.now();
    S.nets.push({ id, name: v, color: nextColor() });
    S.netUI = { adding: false, err: '' };
    toast(`Added ${v}.`);
    render();
  },
  ren: (d) => { S.netUI = { rename: d.id, err: '' }; render(); },
  rencancel: () => { S.netUI = {}; render(); },
  renok: (d) => {
    const v = document.getElementById('renameIn').value.trim();
    const err = !v ? 'Give the network a name.' : S.nets.some((n) => n.id !== d.id && n.name.toLowerCase() === v.toLowerCase()) ? `A network named ${v} already exists.` : '';
    if (err) { S.netUI.err = err; render(); return; }
    netOf(d.id).name = v; S.netUI = {}; render();
  },
  rm: (d) => { S.netUI = { remove: S.netUI.remove === d.id ? null : d.id }; render(); },
  rmcancel: () => { S.netUI = {}; render(); },
  rmok: (d) => { const n = netOf(d.id); S.nets = S.nets.filter((x) => x.id !== d.id); if (S.net === d.id) S.net = 'all'; S.netUI = {}; toast(`Removed ${n.name}.`); render(); },
  pick: (d) => { S.netUI = { picker: S.netUI.picker === d.id ? null : d.id }; render(); },
  pkcancel: () => { S.netUI = {}; render(); },
  pkpreset: (d) => setPicker(d.c),
  pkok: () => {
    const id = document.getElementById('picker').dataset.id;
    const v = document.getElementById('pkHex').value.trim();
    if (!/^#[0-9a-f]{6}$/i.test(v)) return;
    netOf(id).color = v.toLowerCase(); S.netUI = {}; toast(`${netName(id)} now uses ${v.toLowerCase()} everywhere.`); render();
  },
};
function setPicker(c) {
  const id = document.getElementById('picker').dataset.id;
  const hex = document.getElementById('pkHex');
  const col = document.getElementById('pkColor');
  hex.value = c;
  if (/^#[0-9a-f]{6}$/i.test(c)) { col.value = c.toLowerCase(); const pv = document.getElementById('pkPrev'); pv.style.setProperty('--c', c); pv.style.setProperty('--num', numColor(c.toLowerCase())); }
  document.getElementById('pkWarn').innerHTML = warnHtml(id, c);
}
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  const inPop = ev.target.closest('.pop, .menu');
  let dirty = false;
  if (!inPop && (!el || !['cable', 'netmenu', 'rowmenu'].includes(el.dataset.act))) {
    if (S.pop || S.netMenu || S.inv.menu) { S.pop = null; S.netMenu = false; S.inv.menu = null; dirty = true; }
  }
  if (el && ev.target.closest('#app, #pop')) {
    const fn = ACT[el.dataset.act];
    if (fn) { ev.stopPropagation(); fn(el.dataset, ev, el); return; }
  }
  if (dirty) render();
});
document.addEventListener('dblclick', (ev) => {
  const b = ev.target.closest('button.blk');
  if (b) ACT.openpage({ eq: b.dataset.eq });
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'exploreQ') { S.exploreQ = t.value; document.getElementById('exploreList').innerHTML = exploreList(t.value); }
  if (t.id === 'invQ') { S.inv.q = t.value; const p = t.selectionStart; render(); const i = document.getElementById('invQ'); i.focus(); i.setSelectionRange(p, p); }
  if (t.id === 'pkColor') setPicker(t.value);
  if (t.id === 'pkHex') { const v = t.value.trim(); const id = document.getElementById('picker').dataset.id; if (/^#[0-9a-f]{6}$/i.test(v)) { document.getElementById('pkColor').value = v.toLowerCase(); const pv = document.getElementById('pkPrev'); pv.style.setProperty('--c', v); pv.style.setProperty('--num', numColor(v.toLowerCase())); } document.getElementById('pkWarn').innerHTML = warnHtml(id, v); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') {
    if (ev.target.id === 'newNet') { ACT.addok(); return; }
    if (ev.target.id === 'renameIn') { ACT.renok({ id: S.netUI.rename }); return; }
    const card = ev.target.closest && ev.target.closest('.ncard');
    if (card) { ACT.gonode({ node: card.dataset.node }); return; }
    if (ev.target.classList && ev.target.classList.contains('mrack')) { ACT.gorack({ rack: ev.target.dataset.rack }); return; }
  }
  if (ev.key !== 'Escape') return;
  if (S.pop) { S.pop = null; render(); return; }
  if (S.inv.menu || S.netMenu) { S.inv.menu = null; S.netMenu = false; render(); return; }
  const U = S.netUI;
  if (U.adding || U.rename || U.remove || U.picker) { S.netUI = {}; render(); return; }
  if (S.dock) { S.dock = null; render(); }
});
/* Site screen: a drag moves a node card, a short move counts as a click. */
let drag = null;
document.addEventListener('pointerdown', (ev) => {
  const card = ev.target.closest('.ncard');
  if (!card || ev.button !== 0) return;
  const n = card.dataset.node;
  drag = { card, n, sx: ev.clientX, sy: ev.clientY, ox: S.site[n][0], oy: S.site[n][1], moved: false };
  card.setPointerCapture(ev.pointerId);
});
document.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) < 5) return;
  drag.moved = true;
  drag.card.classList.add('drag');
  const cv = document.getElementById('canvas');
  const x = Math.max(0, Math.min(cv.clientWidth - drag.card.offsetWidth, drag.ox + dx));
  const y = Math.max(0, Math.min(cv.clientHeight - drag.card.offsetHeight, drag.oy + dy));
  S.site[drag.n] = [x, y];
  drag.card.style.left = x + 'px';
  drag.card.style.top = y + 'px';
  document.getElementById('sitelines').innerHTML = siteLinesSvg(S.phys.site);
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag;
  drag = null;
  d.card.classList.remove('drag');
  if (!d.moved) ACT.gonode({ node: d.n });
  else toast(`Saved the place of ${NODES[d.n].name}.`);
});
window.addEventListener('resize', () => { S.pop = null; renderPop(); fit(); });

/* =====================================================================
   Demo guide
   ===================================================================== */
const RACK_C01 = { view: 'physical', phys: { level: 'rack', site: 'main', node: 'bc', rack: 'C01' } };
const GUIDE = [
  { sec: 'A · The frame on the left', steps: [
    ['Click <b>Inspector</b> on the rail: the panel opens between the rail and the page, and the page narrows. The same icon or Esc closes it.', () => setup({ ...RACK_C01, mode: 'installed', dock: 'inspector' })],
    ['Switch to <b>Plan: Expansion</b>: Add and <b>Changes</b> (with its count) join the rail; open Changes and Undo a line. In Installed they are gone.', () => setup({ mode: 'plan', dock: 'changes' })],
    ['On Rack C01, jack 49 of EDGE-33 is selected: the path card has <b>no cable names</b>. Click a cable line for its card, then <b>Go to cable</b>.', () => { S.jack['EDGE-33'] = 'Gi1/0/49'; S.chosen.C01 = 'EDGE-33'; setup({ ...RACK_C01, mode: 'installed', dock: null }); }],
    ['<b>Find AGG / BB</b> stays a simple entry on the jack’s card; it opens today’s Trace page, unchanged (the trace is designed later).', () => { S.jack['EDGE-33'] = 'Gi1/0/49'; S.chosen.C01 = 'EDGE-33'; setup({ ...RACK_C01, mode: 'installed', dock: null }); toast(traceToast); }],
    ['<b>Building C</b>, the node level: click a mini rack to open it; click a device in one to open the rack with it chosen.', () => setup({ view: 'physical', phys: { level: 'node', site: 'main', node: 'bc' }, dock: null })],
    ['<b>Main Campus</b>, the site: click a node card to open its racks; drag a card to move it. There is no “Open racks →” button.', () => setup({ view: 'physical', phys: { level: 'site', site: 'main' }, dock: null })],
    ['<b>One heading on every page</b>: Inventory, the tree, the rack and the dock panels share the breadcrumb, the 20px title, the meta line and the actions on the right.', () => setup({ view: 'inventory', dock: 'inspector' })],
  ] },
  { sec: 'C · Networks and racks', steps: [
    ['<b>Network ▾ › Manage networks…</b>: click a swatch for the picker (here Network C’s); try the “Try” colours for each warning. The rule is the research’s ΔE.', () => { S.netUI = { picker: 'C' }; setup({ dock: 'networks', keepNetUI: true }); }],
    ['<b>+ Add network</b> starts with the next default colour (Cerulean after the first four).', () => { S.netUI = { adding: true, err: '' }; setup({ dock: 'networks', keepNetUI: true }); }],
    ['<b>Remove…</b> on Network A is refused in words; Network D, unused, can be removed. In Plan, Network C counts the draft.', () => { S.netUI = { remove: 'A' }; setup({ dock: 'networks', keepNetUI: true }); }],
    ['Racks and faceplates: quieter plates, mini racks with names and a network stripe. Flip <b>Demo look: Today | Proposed</b> on a node or rack to compare.', () => setup({ view: 'physical', phys: { level: 'node', site: 'main', node: 'bc' }, dock: null })],
  ] },
  { sec: 'Dark theme', steps: [
    ['<b>Dark</b> in the header: Rack C01 with a jack and its path. The steel keeps its frame in a darker well with a lit rim.', () => { S.jack['EDGE-33'] = 'Gi1/0/49'; S.chosen.C01 = 'EDGE-33'; setup({ ...RACK_C01, mode: 'installed', dock: null, theme: 'dark' }); }],
    ['The tree in dark, with Building C selected and its Node panel open.', () => { S.tree.sel = 'bc'; S.net = 'A'; setup({ view: 'conceptual', dock: 'node', theme: 'dark' }); }],
    ['Inventory in dark, in the plan: proposed rows, the plan band and the Changes count.', () => setup({ view: 'inventory', mode: 'plan', dock: 'changes', theme: 'dark' })],
    ['The colour picker in dark, with a colour that looks like the route: the warning names it.', () => { S.netUI = { picker: 'B' }; setup({ dock: 'networks', keepNetUI: true, theme: 'dark', view: 'physical', phys: { level: 'node', site: 'main', node: 'bc' } }); setPicker('#13907c'); }],
    ['Back to <b>Light</b>. Until you choose, the demo follows the system; the choice is remembered in this browser.', () => setup({ theme: 'light' })],
  ] },
  { sec: 'The Look page', steps: [
    ['<b>Look</b> in the header: the font, the type scale and every colour with its contrast in light and dark.', () => { setup({ view: 'look', dock: null }); }],
    ['The <b>network colours</b> with the colour-vision simulation (here deuteranopia).', () => { S.lookCvd = 'deut'; setup({ view: 'look', dock: null }); jumpTo('lk-nets'); }],
    ['The <b>state colours</b> on a faceplate and a rack, light beside dark.', () => { setup({ view: 'look', dock: null }); jumpTo('lk-hw'); }],
    ['The <b>control states</b>: buttons, fields, rows, chips and focus, light beside dark.', () => { S.lookCvd = ''; setup({ view: 'look', dock: null }); jumpTo('lk-ctl'); }],
  ] },
];
function jumpTo(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({ block: 'start' }); }
function setup(o) {
  clearTimeout(toastT); document.getElementById('toast').innerHTML = '';
  if (o.theme) { document.documentElement.setAttribute('data-theme', o.theme); try { localStorage.setItem('nettop-demo-theme', o.theme); } catch (e) { /* ignore */ } }
  const phys = o.phys ? Object.assign({}, S.phys, o.phys) : null;
  if ('mode' in o) S.mode = o.mode;
  if ('dock' in o) S.dock = o.dock;
  if (o.view && (o.view !== S.view || phys)) { S.back.push(snap()); S.view = o.view; }
  if (phys) S.phys = phys;
  if (!o.keepNetUI) S.netUI = {};
  S.pop = null; S.netMenu = false; S.inv.menu = null;
  if (!plan() && (S.dock === 'changes' || S.dock === 'add')) S.dock = null;
  render();
  renderGuide();
}
function renderGuide() {
  const g = document.getElementById('guide');
  g.className = 'guide' + (S.guide ? '' : ' closed');
  let n = 0;
  const hb = document.querySelector('[data-act="guide"]');
  if (hb) hb.setAttribute('aria-expanded', String(S.guide));
  g.innerHTML = `<div class="guide-h">${ic('book')}<b>Demo guide</b><button class="iconbtn" data-g="toggle" aria-label="Close the guide">${ic('x')}</button></div>
    ${S.guide ? `<div class="guide-b">${GUIDE.map((s) => `<h5>${s.sec}</h5><ol start="${n + 1}">${s.steps.map(([t]) => `<li>${t}<button data-g="${n++}">Show me</button></li>`).join('')}</ol>`).join('')}
      <p class="note">B, the trace by uplink and by rack, is out of this demo: it gets its own deep dive later.</p>
      <p class="note">Esc closes the card, form or panel on top. Data is fictional.</p></div>` : ''}`;
}
document.getElementById('guide').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-g]');
  if (!b) return;
  if (b.dataset.g === 'toggle') { S.guide = false; renderGuide(); render(); return; }
  const steps = GUIDE.flatMap((s) => s.steps);
  steps[+b.dataset.g][1]();
});

render();
renderGuide();
</script>
