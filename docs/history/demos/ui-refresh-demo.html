<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planned UI demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   The proposed look (docs/history/ui-research-2026-11-25.md) and every
   item of "Queue after switch models" (docs/roadmap.md), in one demo.
   Fictional data in the style of docs/acceptance-example.md.
   ===================================================================== */
:root {
  --sans: 'IBM Plex Sans', 'IBM Plex Sans Hebrew', 'Segoe UI', Arial, sans-serif;
  --mono: 'IBM Plex Mono', Consolas, ui-monospace, monospace;

  /* Type: one role per job (research §3). Nothing else is used. */
  --type-page: 600 20px/28px var(--sans);
  --type-section: 600 14px/20px var(--sans);
  --type-body: 400 14px/20px var(--sans);
  --type-dense: 400 13px/18px var(--sans);
  --type-label: 500 12px/16px var(--sans);
  --type-code: 500 12px/16px var(--mono);
  --type-hw: 500 11px/14px var(--mono);      /* hardware only: U numbers, group labels (D33 minimum) */

  /* Spacing and radii (research §5). */
  --s-1: 2px; --s-2: 4px; --s-3: 8px; --s-4: 12px; --s-5: 16px; --s-6: 24px; --s-7: 32px;
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px;
  --shadow-1: 0 1px 2px #1c2b3a14;
  --shadow-2: 0 10px 30px -10px #1c2b3a59;
  --shadow-3: 0 18px 40px -18px #1c2b3a40, 0 2px 6px #1c2b3a12;
  --h-control: 32px;

  /* Neutrals. */
  --surface-page: #f2f4f6; --surface: #ffffff; --surface-sunk: #f7f9fa; --surface-hover: #f1f4f7; --surface-selected: #e8eef5;
  --border-subtle: #e6ebef; --border: #d5dce2; --border-strong: #b6c1cc; --border-field: #7b8794;
  --text: #1c2b3a; --text-muted: #56636f; --text-faint: #6b7782;

  /* State. */
  --route: #0f8b7a; --route-text: #0b7666; --route-soft: #e2f3f0;
  --hl: #d99a0b; --hl-soft: #fdf3dc; --warn-text: #7a5200;
  --proposed: #8a6100; --proposed-soft: #fff6dd; --proposed-edge: #d9b24a;
  --danger: #b4361f; --danger-soft: #fbeae6;
  --plan-band: #fcf4de; --plan-band-edge: #ead6a0;

  /* Hardware. */
  --steel: #1f2731; --steel-2: #2a3440; --steel-edge: #4b5765; --steel-ink: #a8b4c0; --steel-ink-soft: #8d9aa8;
  --stripe-passive: #7d8a98;
  --jack-free: #e8ecf0; --jack-ink: #2a3440; --jack-r: 4px; --jr: 0.32; --jgap: 4px;
  --jack-edge: inset 0 0 0 1px #c5cdd5, inset 0 -3px 0 #d3d9df;
  --jack-sel: 0 0 0 2px var(--steel), 0 0 0 4px #ffffff;
  --slot-line: #56626f; --slot-ink: #a8b4c0;
}
/* "Today" for faceplates and racks only (the flip). */
.look-old {
  --jack-free: #ffffff; --jack-ink: #1c2b3a; --jack-r: 2px; --jr: 0.38; --jgap: 2px;
  --jack-edge: none; --jack-sel: inset 0 0 0 3px #fff, inset 0 0 0 5px #1c2b3a;
  --slot-line: #36414d; --slot-ink: #6f7c8a;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { overflow: hidden; font: var(--type-body); color: var(--text); background: var(--surface-page); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
input, select { font: inherit; color: inherit; }
bdi { unicode-bidi: isolate; }
svg { flex: none; }
:where(svg[viewBox='0 0 24 24']) { width: 16px; height: 16px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.faint { color: var(--text-faint); }
.dense { font: var(--type-dense); }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

/* ---------- The frame: header, rail | dock | page ---------- */
#app { display: grid; grid-template-rows: 44px minmax(0, 1fr); grid-template-columns: 48px auto minmax(0, 1fr); height: 100vh; width: 100%; overflow: hidden; }
.hdr { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--s-4); padding: 0 var(--s-4); background: var(--surface); border-bottom: 1px solid var(--border); min-width: 0; position: relative; z-index: 20; }
.brand { display: flex; align-items: center; gap: var(--s-3); font: var(--type-section); margin-right: var(--s-2); }
.brand svg { width: 18px; height: 18px; }
.seg { display: inline-flex; align-items: center; gap: var(--s-1); padding: var(--s-1); height: var(--h-control); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-sunk); flex: none; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 var(--s-4); border-radius: var(--r-sm); color: var(--text-muted); font: var(--type-dense); white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed='true'] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }
.seg button svg { width: 14px; height: 14px; }
.seg button.plan[aria-pressed='true'] { background: var(--proposed-soft); color: var(--proposed); box-shadow: 0 0 0 1px var(--proposed-edge); }
.hlabel { color: var(--text-muted); font: var(--type-dense); }
.spacer { flex: 1; }
.env { font: var(--type-label); font-weight: 600; color: var(--warn-text); background: var(--hl-soft); border: 1px solid #ecd49a; border-radius: var(--r-sm); padding: 1px 6px; }
.netpick { position: relative; }
.netpick > .btn { width: 180px; justify-content: space-between; border-color: var(--border-strong); }
.netpick > .btn > span { display: inline-flex; align-items: center; gap: var(--s-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.menu { position: absolute; z-index: 40; min-width: 220px; padding: var(--s-2); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-2); }
.netpick .menu { top: 36px; left: 0; }
.menu button { display: flex; align-items: center; gap: var(--s-3); width: 100%; height: 32px; padding: 0 var(--s-3); border-radius: var(--r-sm); font: var(--type-dense); white-space: nowrap; }
.menu button:hover { background: var(--surface-hover); }
.menu button[aria-checked='true'] { font-weight: 600; }
.menu button svg { width: 16px; height: 16px; color: var(--text-muted); }
.menu hr { border: 0; border-top: 1px solid var(--border-subtle); margin: var(--s-2) 0; }

.rail { grid-row: 2; grid-column: 1; display: flex; flex-direction: column; align-items: center; gap: var(--s-2); padding-top: var(--s-4); background: var(--surface); border-right: 1px solid var(--border); z-index: 5; }
.rail button { position: relative; display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r-md); color: var(--text-muted); }
.rail button:hover { background: var(--surface-hover); color: var(--text); }
.rail button svg { width: 18px; height: 18px; }
.rail button[aria-pressed='true'] { background: var(--surface-selected); color: var(--text); }
.rail button[aria-pressed='true']::before { content: ''; position: absolute; left: -6px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--text); }
.rail .badge { position: absolute; top: 1px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--proposed); color: #fff; font: var(--type-label); font-weight: 600; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px var(--surface); }
.rail .sep { width: 24px; height: 1px; background: var(--border); margin: var(--s-2) 0; }
.rail button[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 44px; top: 50%; transform: translateY(-50%); background: var(--text); color: #fff; font: var(--type-label); padding: var(--s-2) var(--s-3); border-radius: var(--r-sm); white-space: nowrap; z-index: 60; pointer-events: none; }

.dock { grid-row: 2; grid-column: 2; width: 360px; display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--border); box-shadow: 1px 0 0 var(--border-subtle); }
.dock-b { flex: 1; overflow-y: auto; padding: var(--s-5); }
.page { grid-row: 2; grid-column: 3; overflow-y: auto; overflow-x: hidden; min-width: 0; position: relative; }
.wrap { padding: var(--s-5) var(--s-6) var(--s-6); min-width: 0; }

/* ---------- One heading pattern: crumbs, title, meta, actions ---------- */
.ph { margin-bottom: var(--s-5); min-width: 0; }
.ph-crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s-2); min-height: 24px; font: var(--type-label); font-weight: 400; color: var(--text-muted); }
.ph-crumbs a { cursor: pointer; border-radius: var(--r-sm); }
.ph-crumbs a:hover { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
.ph-crumbs b { color: var(--text); font-weight: 500; }
.ph-crumbs svg { width: 12px; height: 12px; }
.ph-crumbs .back { display: inline-flex; align-items: center; gap: var(--s-1); height: 24px; padding: 0 var(--s-3) 0 var(--s-1); margin-right: var(--s-2); border-radius: var(--r-sm); color: var(--text); font: var(--type-label); }
.ph-crumbs .back:hover { background: var(--surface-hover); }
.ph-crumbs .back svg { width: 14px; height: 14px; }
.ph-row { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s-2) var(--s-4); margin-top: var(--s-1); min-width: 0; }
.ph h1 { margin: 0; font: var(--type-page); letter-spacing: -0.01em; white-space: nowrap; }
.ph-meta { font: var(--type-dense); color: var(--text-muted); min-width: 0; }
.ph-end { margin-left: auto; display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
.dock .ph { margin: calc(var(--s-5) * -1) calc(var(--s-5) * -1) var(--s-5); padding: var(--s-3) var(--s-3) var(--s-4) var(--s-5); border-bottom: 1px solid var(--border-subtle); position: sticky; top: calc(var(--s-5) * -1); background: var(--surface); z-index: 2; }
.dock .ph h1 { white-space: normal; }
.dock .ph-row { align-items: flex-start; }
.dock .ph-meta { flex-basis: 100%; order: 3; }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--h-control); padding: 0 var(--s-4); border-radius: var(--r-md); font: var(--type-dense); font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--text); white-space: nowrap; flex: none; }
.btn:hover { border-color: var(--border-strong); background: var(--surface-hover); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--text); border-color: var(--text); color: #fff; }
.btn.primary:hover { background: #2c3e50; }
.btn.quiet { border-color: transparent; background: transparent; }
.btn.quiet:hover { background: var(--surface-hover); }
.btn.sm { height: 28px; padding: 0 var(--s-3); }
.btn.danger { color: var(--danger); }
.btn.danger.primary { background: var(--danger); border-color: var(--danger); color: #fff; }
.iconbtn { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: var(--r-md); color: var(--text-muted); flex: none; }
.iconbtn:hover { background: var(--surface-hover); color: var(--text); }
.iconbtn svg { width: 16px; height: 16px; }
.link { color: var(--text); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; font-weight: 500; }
.link:hover { text-decoration-color: var(--text); }
.field { height: 34px; width: 100%; padding: 0 var(--s-3); border: 1px solid var(--border-field); border-radius: var(--r-md); background: #fff; font: var(--type-dense); }
.field:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 2px #1c2b3a33; }
.lbl { display: block; font: var(--type-label); color: var(--text); margin-bottom: var(--s-2); }
.hint { font: var(--type-label); font-weight: 400; color: var(--text-muted); margin: var(--s-2) 0 0; }
.err { font: var(--type-label); color: var(--danger); margin: var(--s-2) 0 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 var(--s-3); border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font: var(--type-label); white-space: nowrap; }
.chip.prop { border-style: dashed; border-color: var(--proposed-edge); background: var(--proposed-soft); color: var(--proposed); }
.chip.route { border-color: transparent; background: var(--route-soft); color: var(--route-text); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; flex: none; }
.warnchip, .flagchip { display: inline-flex; align-items: center; gap: var(--s-2); height: 20px; padding: 0 7px; border-radius: 999px; font: var(--type-label); white-space: nowrap; }
.warnchip { background: var(--hl-soft); color: var(--warn-text); }
.flagchip { background: var(--danger-soft); color: var(--danger); }
.warnchip svg, .flagchip svg { width: 12px; height: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); min-width: 0; }
.card-h { display: flex; align-items: center; gap: var(--s-3); min-height: 40px; padding: var(--s-2) var(--s-3) var(--s-2) var(--s-5); border-bottom: 1px solid var(--border-subtle); min-width: 0; }
.card-h h3 { margin: 0; font: var(--type-section); white-space: nowrap; }
.card-h .n { font: var(--type-label); font-weight: 400; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.card-h .end { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }
.card-b { padding: var(--s-4) var(--s-5); }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: var(--s-6) var(--s-4); color: var(--text-muted); font: var(--type-dense); text-align: center; }
.empty svg { width: 20px; height: 20px; color: var(--text-faint); }
.empty.line { flex-direction: row; padding: var(--s-3) var(--s-5); justify-content: flex-start; }
.well { background: var(--surface-sunk); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); padding: var(--s-4); }
.row { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: var(--s-2) var(--s-3); margin: 0; font: var(--type-dense); }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; min-width: 0; }
.sect { font: var(--type-section); margin: var(--s-5) 0 var(--s-3); }
.sect:first-child { margin-top: 0; }
.planband { display: flex; align-items: center; gap: var(--s-3); height: 32px; padding: 0 var(--s-6); background: var(--plan-band); border-bottom: 1px solid var(--plan-band-edge); font: var(--type-dense); color: var(--warn-text); position: sticky; top: 0; z-index: 6; }
.planband b { font-weight: 600; }
.demo-flip { display: inline-flex; align-items: center; gap: var(--s-3); padding: var(--s-1) var(--s-1) var(--s-1) var(--s-3); border: 1px dashed #9aa6b2; border-radius: var(--r-lg); font: var(--type-label); color: var(--text-muted); }
.demo-flip .seg { height: 28px; }
.demo-flip .seg button { height: 22px; }
.banner { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4); background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--hl); border-radius: var(--r-lg); font: var(--type-dense); margin-bottom: var(--s-5); }
.banner.bad { border-left-color: var(--danger); }
.banner svg { width: 16px; height: 16px; color: var(--warn-text); }

/* ---------- Faceplates ---------- */
.face { width: 100%; display: flex; justify-content: center; --j: 40px; }
.plate { display: inline-block; max-width: 100%; background: var(--steel); border-radius: var(--r-md); padding: 10px var(--s-4) var(--s-4); }
.plate-top { display: flex; justify-content: space-between; align-items: center; gap: var(--s-4); margin-bottom: var(--s-3); }
.tape { display: inline-block; background: #fbfbf8; color: #15202b; border-radius: 2px; padding: 0 6px; font: var(--type-label); line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.plate-count { font: var(--type-hw); color: var(--steel-ink); white-space: nowrap; }
.groups { display: flex; gap: var(--s-5); align-items: flex-end; }
.face.wrapg .groups { flex-wrap: wrap; }
.glab { font: var(--type-hw); color: var(--steel-ink-soft); margin-bottom: 10px; white-space: nowrap; }
.ports { display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--rows, 2), var(--j)); grid-auto-columns: var(--j); gap: var(--jgap); }
.jack { position: relative; display: grid; place-items: center; width: var(--j); height: var(--j); font-family: var(--mono); font-weight: 500; font-size: max(11px, calc(var(--j) * var(--jr))); border-radius: var(--jack-r); background: var(--jack-free); color: var(--jack-ink); box-shadow: var(--jack-edge); }
.jack:hover { filter: brightness(0.96); }
.jack.cab { background: var(--c); color: #fff; box-shadow: inset 0 -3px 0 #00000033; }
.look-old .jack.cab { box-shadow: none; }
.jack.sel { box-shadow: var(--jack-sel); z-index: 1; }
.jack.lit { outline: 2px solid var(--hl); outline-offset: 1px; }
.jack.muted { opacity: 0.35; }
.jack .up { position: absolute; top: -7px; left: 50%; margin-left: -6.5px; width: 13px; height: 13px; border-radius: 50%; background: #fff; color: #1f2731; display: grid; place-items: center; box-shadow: 0 0 0 1.5px #1f2731; }
.jack .up svg { width: 9px; height: 9px; }
.ports > .jack:nth-child(even) .up { top: auto; bottom: -7px; }
.ports[style*='--rows:1'] > .jack .up { top: -7px; bottom: auto; }
.look-old .jack .up { width: auto; height: auto; background: none; box-shadow: none; color: currentColor; top: 0; right: 3px; font: 700 11px var(--sans); }
.hdf { display: grid; grid-template-columns: 18px repeat(4, auto); gap: var(--jgap) 10px; align-items: center; }
.hdf .colh, .hdf .rowh { font: var(--type-hw); color: var(--steel-ink-soft); text-align: center; }
.hdf .b6 { display: grid; grid-template-columns: repeat(6, var(--j)); gap: var(--jgap); }
.noports { padding: var(--s-4) var(--s-5); color: var(--steel-ink); font: var(--type-dense); }
.legend { display: flex; flex-wrap: wrap; gap: 6px var(--s-5); align-items: center; margin-top: var(--s-4); font: var(--type-label); font-weight: 400; color: var(--text-muted); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }

/* ---------- The rack (D50) ---------- */
.cab { background: var(--steel); border-radius: var(--r-md); padding: 6px 6px 6px 0; width: 100%; --u: 22px; }
.urow { display: grid; grid-template-columns: 44px minmax(0, 1fr); height: var(--u); padding: 1px 0; }
.un { font: var(--type-hw); color: var(--steel-ink-soft); text-align: right; padding-right: 6px; align-self: center; white-space: nowrap; }
.blk { position: relative; height: 100%; width: 100%; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; background: var(--steel-2); border: 1px solid var(--steel-edge); border-radius: 3px; overflow: hidden; min-width: 0; }
.blk::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--stripe, var(--stripe-passive)); }
.blk .tape { line-height: min(18px, calc(var(--u) - 6px)); font-size: 12px; }
.blk .bm { margin-left: auto; font: var(--type-hw); color: var(--steel-ink-soft); white-space: nowrap; }
.blk:hover { border-color: #8d9aa8; }
.blk.item { background: #252e39; }
.blk.chosen { outline: 2px solid #fff; outline-offset: -1px; }
.blk.prop { border: 1.5px dashed var(--proposed-edge); background: repeating-linear-gradient(135deg, #2a3440 0 6px, #313c49 6px 12px); }
.blk.muted { opacity: 0.4; }
.look-old .blk::before { display: none; }
.look-old .blk { padding-left: 6px; }
.look-old .blk .bm { display: none; }
.slot { height: 100%; border: 1px dashed var(--slot-line); border-radius: 3px; }
.slot.run { display: flex; align-items: center; justify-content: center; font: var(--type-hw); color: var(--slot-ink); }
.slot.drop { border-color: #8a7a4a; }

/* ---------- Mini racks (node level) ---------- */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--s-5); align-items: start; }
.mrack { display: block; width: 100%; padding: var(--s-4); cursor: pointer; text-align: left; }
.mrack:hover { border-color: var(--border-strong); box-shadow: var(--shadow-1); }
.mrack-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); margin-bottom: var(--s-3); }
.mrack-h b { font: var(--type-section); }
.mrack-h span { font: var(--type-label); font-weight: 400; color: var(--text-muted); }
.mcab { background: var(--steel); border-radius: 5px; padding: 4px 4px 4px 0; --mu: 16px; }
.mrow { display: grid; grid-template-columns: 40px minmax(0, 1fr); height: calc(var(--mu) * var(--h, 1)); padding: 1px 0; }
.mu { font: var(--type-hw); color: var(--steel-ink-soft); text-align: right; padding-right: 5px; align-self: center; white-space: nowrap; }
.mblk { position: relative; display: flex; align-items: center; height: 100%; width: 100%; padding: 0 var(--s-2) 0 9px; background: var(--steel-2); border: 1px solid transparent; border-radius: 2px; overflow: hidden; min-width: 0; }
.mblk::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--stripe, var(--stripe-passive)); }
.mblk:hover { border-color: #fff; }
.mblk.item { background: #252e39; }
.mblk.prop { border: 1px dashed var(--proposed-edge); }
.mblk.muted { opacity: 0.4; }
.mtape { font: var(--type-hw); font-family: var(--sans); color: #e9edf1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mfree { height: 100%; border: 1px dashed #46525f; border-radius: 2px; display: flex; align-items: center; justify-content: center; font: var(--type-hw); color: var(--steel-ink-soft); }
.look-old .mcab { --mu: 7px; padding: 3px; }
.look-old .mrow { grid-template-columns: 1fr; }
.look-old .mu, .look-old .mtape, .look-old .mfree span { display: none; }
.look-old .mblk::before { display: none; }
.look-old .mblk { background: #3a4552; }
.look-old .mfree { border: 0; border-bottom: 1px solid #2c3540; border-radius: 0; }

/* ---------- Rack level and equipment page ---------- */
.rk-grid { display: grid; grid-auto-rows: min-content; grid-template-columns: 230px minmax(0, 1fr) 300px; gap: var(--s-5); align-items: start; }
.rk-grid.narrow { grid-template-columns: 210px minmax(0, 1fr); }
.rk-grid.narrow > :first-child { grid-row: span 2; }
.rk-grid.narrow .side { grid-column: 2; }
.eq-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--s-5); align-items: start; }
.eq-grid.narrow { grid-template-columns: minmax(0, 1fr); }
.side { display: grid; gap: var(--s-5); min-width: 0; }
.rk-note { margin: var(--s-3) 0 0; font: var(--type-label); font-weight: 400; color: var(--text-muted); }
.facebox { padding: var(--s-5); }
.ct-row { display: flex; align-items: center; gap: var(--s-3); width: 100%; padding: var(--s-3) var(--s-5); font: var(--type-dense); border-top: 1px solid var(--border-subtle); }
.ct-row:first-child { border-top: 0; }
.ct-row:hover { background: var(--surface-hover); }
.ct-row.on { background: var(--hl-soft); }
.ct-row b { font-weight: 600; }
.ct-row .pl { color: var(--text-muted); font: var(--type-label); font-weight: 400; }
.ct-row .c { margin-left: auto; font: var(--type-code); }
.peer { background: var(--surface-sunk); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: var(--s-3) var(--s-4); margin: var(--s-4) 0; font: var(--type-dense); }
.peer b { font-weight: 600; }
.peer div { color: var(--text-muted); font: var(--type-label); font-weight: 400; margin-top: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--s-4); }

/* ---------- Path plates (path card and Trace page, shared) ---------- */
.pathcard { margin-top: var(--s-5); }
.path-b { padding: var(--s-3) var(--s-4) var(--s-4); }
.path { display: flex; align-items: flex-start; min-width: 0; }
.place { background: var(--surface-sunk); border-radius: var(--r-lg); padding: 6px var(--s-3) var(--s-3); min-width: 0; }
.place-name { font: var(--type-label); line-height: 18px; color: var(--text-muted); margin: 0 0 6px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.place-in { display: flex; align-items: flex-start; min-width: 0; }
.pcell { display: flex; flex-direction: column; align-items: center; flex: 1 1 0; min-width: 0; }
.pplate { display: block; width: 100%; max-width: 200px; min-width: 92px; background: var(--steel); border-radius: var(--r-md); padding: var(--s-3) 10px; color: var(--steel-ink); text-align: left; }
.pplate:hover { background: #26303b; }
.pplate .prow { display: flex; justify-content: space-between; align-items: center; gap: 6px; min-width: 0; }
.pplate .kind { font: var(--type-hw); white-space: nowrap; }
.pplate .pjs { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin: var(--s-3) 0 var(--s-2); height: 28px; }
.pj { width: 28px; height: 28px; display: grid; place-items: center; background: #3b4756; color: #fff; font: var(--type-code); border-radius: var(--r-sm); flex: none; }
.pplate .pair { flex: 1; border-top: 2px dotted var(--steel-ink-soft); }
.pplate .sides { display: flex; justify-content: space-between; gap: 6px; font: var(--type-hw); white-space: nowrap; overflow: hidden; }
.pplate.here { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--steel); }
.pplate.here .pj.at { background: #fff; color: var(--steel); }
.pplate.end { box-shadow: 0 0 0 2px var(--route); }
.pplate.shared { box-shadow: 0 0 0 2px var(--hl); }
.ptag { margin-top: 6px; display: inline-flex; align-items: center; gap: var(--s-2); padding: 1px var(--s-3); border-radius: 999px; font: var(--type-label); font-weight: 600; white-space: nowrap; }
.ptag svg { width: 12px; height: 12px; }
.ptag.reach { color: var(--route-text); background: var(--route-soft); }
.ptag.both { color: var(--warn-text); background: var(--hl-soft); }
.wire { position: relative; flex: 0 1 56px; min-width: 28px; height: 28px; margin-top: 36px; border-radius: var(--r-sm); }
.wire.between { margin-top: 66px; }
.wire i { position: absolute; left: 3px; right: 3px; top: 13px; height: 2px; background: var(--c); border-radius: 2px; transition: height .1s, top .1s; }
.wire i::before, .wire i::after { content: ''; position: absolute; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.wire i::before { left: -3px; } .wire i::after { right: -3px; }
.wire:hover i, .wire.on i { height: 4px; top: 12px; }
.wire:hover { background: #1c2b3a0d; }
.wire.on { background: #1c2b3a14; }
.wire.prop i { background: repeating-linear-gradient(90deg, var(--c) 0 5px, transparent 5px 9px); }
.path-end-note { margin: var(--s-3) 0 0 var(--s-1); font: var(--type-label); font-weight: 400; color: var(--text-muted); }

/* ---------- Cable card (popover) ---------- */
.pop { position: fixed; z-index: 70; width: 300px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--shadow-2); padding: var(--s-4) var(--s-4) var(--s-4) var(--s-5); }
.pop-h { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-3); }
.pop-h h3 { margin: 0; font: var(--type-section); }
.pop-h .iconbtn { margin-left: auto; }
.pop .kv { grid-template-columns: 64px 1fr; margin-bottom: var(--s-4); }

/* ---------- Sites and the site screen ---------- */
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--s-5); }
.scard { display: block; width: 100%; padding: var(--s-5); text-align: left; }
.scard:hover { border-color: var(--border-strong); box-shadow: var(--shadow-1); }
.scard b { display: block; font: var(--type-section); margin-bottom: var(--s-1); }
.scard .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s-4); }
.canvas { position: relative; height: 560px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface-page) radial-gradient(#dfe4e9 1px, transparent 1px) 0 0 / 16px 16px; overflow: hidden; touch-action: none; }
.canvas svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.ncard { position: absolute; width: 236px; padding: var(--s-3) var(--s-4) var(--s-4); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); cursor: pointer; user-select: none; touch-action: none; display: flex; flex-direction: column; gap: var(--s-1); }
.ncard:hover { border-color: var(--border-strong); box-shadow: var(--shadow-1); }
.ncard.drag { cursor: grabbing; box-shadow: var(--shadow-2); border-color: var(--text); z-index: 5; }
.ncard-h { display: flex; align-items: center; justify-content: space-between; font: var(--type-label); color: var(--text-muted); }
.ncard-h svg { width: 14px; height: 14px; color: var(--text-faint); cursor: grab; }
.ncard b { font: var(--type-section); }
.ncard .dense { color: var(--text-muted); }
.ncard .chips { display: flex; flex-wrap: wrap; gap: var(--s-2); margin: var(--s-2) 0; }
.ltag { font: var(--type-label); fill: var(--text-muted); }

/* ---------- Trace ---------- */
.tr-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--s-5); align-items: start; }
.tr-list { position: sticky; top: var(--s-5); padding: var(--s-2); }
.tr-list button { display: flex; align-items: center; gap: var(--s-3); width: 100%; height: 32px; padding: 0 var(--s-3); border-radius: var(--r-sm); font: var(--type-dense); }
.tr-list button:hover { background: var(--surface-hover); }
.tr-list button .c { margin-left: auto; font: var(--type-code); color: var(--text-muted); }
.tr-list button.flag { color: var(--danger); }
.tr-list h4 { margin: var(--s-2) var(--s-3) var(--s-2); font: var(--type-label); color: var(--text-muted); }
.upl { margin-bottom: var(--s-5); scroll-margin-top: var(--s-5); }
.upl .card-h h3 .mono { font-weight: 500; }
.upl.focus { border-color: var(--text); box-shadow: var(--shadow-1); }
.swsec { margin-bottom: var(--s-6); scroll-margin-top: var(--s-5); }
.swsec-h { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-3); }
.swsec-h h2 { margin: 0; font: var(--type-section); }
.swsec-h .muted { font: var(--type-dense); }
.swsec .upl { margin-bottom: var(--s-3); }
.subh { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4) 0; font: var(--type-dense); }
.subh b { font-weight: 600; }
.noup { border: 1.5px dashed var(--danger); background: var(--danger-soft); border-radius: var(--r-lg); padding: var(--s-4) var(--s-5); font: var(--type-dense); color: var(--text); display: flex; gap: var(--s-3); align-items: flex-start; }
.noup svg { width: 16px; height: 16px; color: var(--danger); margin-top: 1px; }
.opt { display: inline-flex; align-items: center; gap: var(--s-3); }
.g-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--s-5); align-items: start; }
.g-layout.narrow { grid-template-columns: minmax(0, 1fr); }
.graphbox { padding: var(--s-4); }
.graph { position: relative; }
.graph > svg { position: absolute; inset: 0; overflow: visible; }
.gcol { position: absolute; top: 0; font: var(--type-label); color: var(--text-muted); white-space: nowrap; }
.gnode { position: absolute; display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); font: var(--type-dense); white-space: nowrap; overflow: hidden; }
.gnode:hover { border-color: var(--border-strong); }
.gnode b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.gnode .k { font: var(--type-label); font-weight: 400; color: var(--text-muted); }
.gnode .end { margin-left: auto; display: flex; gap: var(--s-2); align-items: center; }
.gnode .n { font: var(--type-code); color: var(--text-muted); }
.gnode.steel { background: var(--steel); border-color: var(--steel); color: #e9edf1; }
.gnode.steel .k, .gnode.steel .n { color: var(--steel-ink); }
.gnode.steel.lit .k, .gnode.steel.lit .n { color: #cfe9e4; }
.gnode.flag { border: 1.5px dashed var(--danger); background: var(--danger-soft); }
.gnode.shared { box-shadow: 0 0 0 2px var(--hl); }
.gnode.lit { border-color: var(--route); background: var(--route-soft); color: var(--text); }
.gnode.steel.lit { background: #0d4f47; border-color: var(--route); color: #fff; }
.gnode.sel { border: 2px solid var(--text); box-shadow: var(--shadow-1); }
.gnode.dim { color: var(--text-faint); border-color: var(--border-subtle); background: var(--surface-sunk); }
.gnode.steel.dim { background: #5d6875; border-color: #5d6875; color: #cfd6dd; }
.gnode.dim.flag { background: var(--danger-soft); }
.gtag { position: absolute; font: var(--type-label); font-weight: 600; color: var(--warn-text); background: var(--hl-soft); border-radius: 999px; padding: 0 var(--s-3); white-space: nowrap; }
.rl { padding: var(--s-3) 0; border-top: 1px solid var(--border-subtle); font: var(--type-dense); }
.rl:first-child { border-top: 0; }
.rl small { display: block; font: var(--type-label); font-weight: 400; color: var(--text-muted); margin-top: 2px; }

/* ---------- Conceptual ---------- */
.tr-strip { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: var(--s-5); height: 44px; padding: 0 var(--s-6); background: var(--surface); border-bottom: 1px solid var(--border); font: var(--type-dense); }
.tr-strip b { font-weight: 600; }
.tree { position: relative; min-height: 600px; background: radial-gradient(#e6ebef 1px, transparent 1px) 0 0 / 16px 16px; }
.lane { position: absolute; top: 0; bottom: 0; background: #eef1f499; border-left: 1px solid var(--border-subtle); border-right: 1px solid var(--border-subtle); }
.lane-h { position: absolute; top: var(--s-4); font: var(--type-label); color: var(--text-muted); }
.hc { position: absolute; display: flex; align-items: center; gap: var(--s-3); height: 36px; padding: 0 var(--s-4); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); font: var(--type-dense); white-space: nowrap; }
.hc b { font-weight: 600; }
.hc .end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.hc .n { font: var(--type-code); color: var(--text-muted); }
.hc.click { cursor: pointer; }
.hc.click:hover { border-color: var(--border-strong); }
.hc.lit { border: 1.5px solid var(--route); background: var(--route-soft); }
.hc.lit b { color: var(--route-text); }
.hc.sel { border: 2px solid var(--text); box-shadow: var(--shadow-1); background: #fff; }
.hc.dim { color: var(--text-faint); border-color: var(--border-subtle); background: var(--surface-sunk); }
.hc.dim .warnchip, .hc.dim .flagchip { background: transparent; color: var(--text-faint); }
.badge2 { font: var(--type-label); padding: 0 6px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-sunk); }
.tree > svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.swrow { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-3); border: 1px solid var(--border-subtle); background: var(--surface-sunk); border-radius: var(--r-md); margin-bottom: 6px; font: var(--type-dense); }
.swrow b { font-weight: 600; white-space: nowrap; }
.swrow .to { flex: 1; color: var(--text-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.swrow .btn { margin-left: auto; }

/* ---------- Dock panels ---------- */
.netlist { list-style: none; margin: 0 0 var(--s-4); padding: 0; }
.netrow { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) 0; border-top: 1px solid var(--border-subtle); }
.netrow:first-child { border-top: 0; }
.netrow .nm { flex: 1; min-width: 0; }
.netrow .nm b { display: block; font: var(--type-dense); font-weight: 600; }
.netrow .nm span { display: block; font: var(--type-label); font-weight: 400; color: var(--text-muted); }
.swatch { width: 28px; height: 28px; border-radius: var(--r-md); background: var(--c); box-shadow: inset 0 0 0 1px #00000026; flex: none; }
button.swatch:hover { box-shadow: inset 0 0 0 1px #00000026, 0 0 0 2px var(--surface), 0 0 0 4px var(--border-strong); }
button.swatch[aria-expanded='true'] { box-shadow: inset 0 0 0 1px #00000026, 0 0 0 2px var(--surface), 0 0 0 4px var(--text); }
.netwell { margin: 0 0 var(--s-3); }
.pk-row { display: flex; align-items: center; gap: var(--s-3); }
.pk-row input[type=color] { width: 44px; height: 34px; padding: 2px; border: 1px solid var(--border-field); border-radius: var(--r-md); background: #fff; cursor: pointer; }
.pk-row .field { width: 110px; font-family: var(--mono); }
.pk-sw { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: var(--s-4) 0; }
.pk-sw button { aspect-ratio: 1; border-radius: var(--r-sm); background: var(--c); box-shadow: inset 0 0 0 1px #00000026; }
.pk-sw button:hover { outline: 2px solid var(--text); outline-offset: 1px; }
.pk-prev { display: flex; gap: var(--s-1); align-items: center; margin-left: auto; }
.pk-prev i { width: 22px; height: 22px; border-radius: var(--r-sm); background: var(--c); box-shadow: inset 0 -3px 0 #00000033; }
.pk-prev i.free { background: var(--jack-free); box-shadow: var(--jack-edge); }
.pk-warn { display: flex; gap: var(--s-3); align-items: flex-start; padding: var(--s-3) var(--s-4); margin-bottom: var(--s-4); border-radius: var(--r-md); background: var(--hl-soft); color: var(--warn-text); font: var(--type-dense); }
.pk-warn svg { width: 16px; height: 16px; margin-top: 1px; }
.pk-ok { display: flex; gap: var(--s-3); align-items: center; margin-bottom: var(--s-4); font: var(--type-label); font-weight: 400; color: var(--text-muted); }
.pk-ok svg { width: 14px; height: 14px; color: var(--route); }
.refuse { display: flex; gap: var(--s-3); align-items: flex-start; }
.refuse svg { width: 16px; height: 16px; margin-top: 2px; color: var(--danger); }
.refuse p { margin: 0 0 var(--s-3); font: var(--type-dense); }
.chg-g { margin-bottom: var(--s-5); }
.chg-g h4 { margin: 0 0 var(--s-2); font: var(--type-label); color: var(--text-muted); display: flex; gap: var(--s-3); }
.chg { display: flex; align-items: flex-start; gap: var(--s-3); padding: var(--s-3) 0; border-top: 1px solid var(--border-subtle); font: var(--type-dense); }
.chg:first-of-type { border-top: 0; }
.chg .t { flex: 1; min-width: 0; }
.chg .t small { display: block; font: var(--type-label); font-weight: 400; color: var(--text-muted); margin-top: 2px; }
.chg .t b { font-weight: 600; }
.libg { margin-bottom: var(--s-5); }
.libg-h { display: flex; align-items: baseline; gap: var(--s-3); margin-bottom: var(--s-3); }
.libg-h h4 { margin: 0; font: var(--type-section); }
.libg-h .link { margin-left: auto; font: var(--type-label); }
.libi { display: flex; align-items: center; gap: 10px; width: 100%; padding: var(--s-3) 10px; margin-bottom: 6px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); cursor: grab; }
.libi:hover { border-color: var(--border-strong); }
.libi .ico { width: 54px; height: 18px; border-radius: 3px; background: var(--steel); display: flex; align-items: center; gap: 1px; padding: 0 3px; flex: none; }
.libi .ico i { flex: 1; height: 8px; background: #e9eef2; border-radius: 1px; }
.libi .ico.pn i { background: #cfd8e0; }
.libi .ico.it { background: #5a6673; }
.libi .t b { display: block; font: var(--type-dense); font-weight: 600; }
.libi .t span { display: block; font: var(--type-label); font-weight: 400; color: var(--text-muted); }
.xtree button { display: flex; align-items: center; gap: var(--s-3); width: 100%; min-height: 30px; padding: 0 var(--s-3); border-radius: var(--r-sm); font: var(--type-dense); }
.xtree button:hover { background: var(--surface-hover); }
.xtree button svg { width: 14px; height: 14px; color: var(--text-muted); }
.xtree button small { margin-left: auto; font: var(--type-label); font-weight: 400; color: var(--text-muted); }
.insp-h { display: flex; gap: var(--s-4); align-items: center; margin-bottom: var(--s-4); }
.insp-h .ic { width: 40px; height: 40px; border-radius: var(--r-lg); background: var(--surface-sunk); border: 1px solid var(--border-subtle); display: grid; place-items: center; }
.insp-h .ic svg { width: 20px; height: 20px; color: var(--text-muted); }
.placeline { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; font: var(--type-dense); margin: var(--s-4) 0; text-align: left; }
.placeline:hover { text-decoration: underline; text-underline-offset: 3px; }
.placeline svg { width: 12px; height: 12px; color: var(--text-muted); }
.meter { margin-bottom: var(--s-4); }
.meter-h { display: flex; justify-content: space-between; font: var(--type-label); color: var(--text-muted); margin-bottom: var(--s-2); }
.meter-h .mono { color: var(--text); }
.bar { height: 6px; border-radius: 3px; background: var(--border-subtle); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c, var(--text)); }

/* ---------- Inventory ---------- */
.iv-grid { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--s-5); }
.lists { padding: var(--s-3); align-self: start; }
.lists h4 { margin: var(--s-1) var(--s-3) var(--s-3); font: var(--type-label); color: var(--text-muted); }

function ports(e) {

}
function cableAt(eqId, j, side) {
  const o = occ(eqId, j, side);
  if (!o) return null;
  const h = o.r.hops[o.i];
  if (h.inS === side && o.i > 0) return { cable: CABLES[o.r.cables[o.i - 1]], peer: o.r.hops[o.i - 1], peerSide: o.r.hops[o.i - 1].outS, o };
  if (h.outS === side && o.i < o.r.hops.length - 1) return { cable: CABLES[o.r.cables[o.i]], peer: o.r.hops[o.i + 1], peerSide: o.r.hops[o.i + 1].inS, o };

function rackRows(rid, collapse) {
  const r = RACKS[rid];
  const cover = {};
  rackItems(rid).forEach((e) => { for (let u = e.u; u > e.u - e.h; u--) cover[u] = e; });
  const rows = [];
  let u = r.h;
  while (u >= 1) {
    const e = cover[u];
    if (e) { rows.push({ eq: e, u: e.u, h: e.h }); u = e.u - e.h; continue; }
    const start = u;
    while (u >= 1 && !cover[u]) u--;

function nodeCardStats(n, net) {

  return { count: sws.length, none: sws.filter((e) => !uplinks(e.id).length).length, two: sws.filter((e) => uplinks(e.id).length >= 2).length };
}
function conceptualPage() {
  const net = treeNet();
  const T = TREES[net];
  const frames = T ? T.frames.filter((f) => f.nodes.some((n) => nodeCardStats(n, net).count)) : [];
  const strip = `<div class="tr-strip">${dot(net)}<b>${bdi(netName(net))}</b><span class="muted">${T ? `${T.bb.length} BB · ${frames.reduce((s, f) => s + f.aggs.length, 0)} AGG · ${frames.reduce((s, f) => s + f.nodes.length, 0)} nodes` : ''}</span><span class="spacer"></span><span class="muted">${S.net === 'all' ? 'The tree shows one network; choose it in the header.' : ''}</span></div>`;
  if (!frames.length) return strip + `<div class="wrap"><div class="empty">${ic('net')}<span>No switches on ${bdi(netName(net))} yet${net === 'C' && !plan() ? ' (the draft Expansion adds one: switch to Plan)' : ''}.</span></div></div>`;
  const X = { bb: 48, agg: 300, node: 720 }, Wd = { bb: 170, agg: 340, node: 320 };
  let y = 64, html = '', lines = '';
  const sel = S.tree.sel;
  const selFrame = frames.find((f) => f.nodes.includes(sel));
  frames.forEach((f) => {
    const lit = selFrame === f;
    const dim = sel && !lit;
    const label = f.aggs.length ? f.aggs.map((a) => `<b>${a}</b>`).join('<span style="width:12px;height:2px;background:currentColor;display:inline-block;opacity:.6"></span>') : `<b>${f.label}</b>`;
    html += `<div class="hc ${lit ? 'lit' : dim ? 'dim' : ''}" style="left:${X.agg}px;top:${y}px;width:${Wd.agg}px">${label}<span class="end">${f.warn ? `<span class="warnchip">${ic('alert')}no BB</span>` : ''}</span></div>`;
    if (f.bb && T.bb.length) {
      const x1 = X.bb + Wd.bb, y1 = 64 + 18, x2 = X.agg, y2 = y + 18, mx = (x1 + x2) / 2;
      lines += `<path d="M${x1} ${y1}H${mx - 6}Q${mx} ${y1} ${mx} ${y1 + 6}V${y2 - 6}Q${mx} ${y2} ${mx + 6} ${y2}H${x2}" stroke="${lit ? '#0f8b7a' : '#c9d1d9'}" stroke-width="${lit ? 2 : 1.5}" fill="none"/>`;
    }
    f.nodes.forEach((n, j) => {
      const st = nodeCardStats(n, net);
      if (!st.count) return;
      const ny = y + j * 46;
      const cls = sel === n ? 'sel' : dim ? 'dim' : '';
      html += `<button class="hc click ${cls}" style="left:${X.node}px;top:${ny}px;width:${Wd.node}px" data-act="treesel" data-node="${n}"><b>${bdi(NODES[n].name)}</b><span class="end">${st.none ? `<span class="flagchip">${ic('alert')}${st.none}</span>` : ''}${st.two ? `<span class="badge2">2↑ ${st.two}</span>` : ''}<span class="n">${st.count}</span></span></button>`;
      const x1 = X.agg + Wd.agg, y1 = y + 18, x2 = X.node, y2 = ny + 18, mx = (x1 + x2) / 2;
      lines += y1 === y2 ? `<path d="M${x1} ${y1}H${x2}" stroke="${sel === n ? '#0f8b7a' : '#c9d1d9'}" stroke-width="${sel === n ? 2 : 1.5}" fill="none"/>` : `<path d="M${x1} ${y1}H${mx - 6}Q${mx} ${y1} ${mx} ${y1 + 6}V${y2 - 6}Q${mx} ${y2} ${mx + 6} ${y2}H${x2}" stroke="#c9d1d9" stroke-width="1.5" fill="none"/>`;
    });
    y += Math.max(1, f.nodes.length) * 46 + 28;
  });
  T.bb.forEach((b) => { html += `<div class="hc ${selFrame && selFrame.bb ? 'lit' : sel ? 'dim' : ''}" style="left:${X.bb}px;top:64px;width:${Wd.bb}px"><b>${b}</b><span class="end"><span class="badge2">BB</span></span></div>`; });
  const lanes = [['bb', 'Backbone'], ['agg', 'Aggregation'], ['node', 'Nodes']].map(([k, l]) => `<div class="lane" style="left:${X[k] - 16}px;width:${Wd[k] + 32}px"></div><span class="lane-h" style="left:${X[k]}px">${l}</span>`).join('');
  return `${strip}<div class="tree" style="height:${Math.max(560, y + 60)}px">${lanes}<svg>${lines}</svg>${html}</div>`;
}

    const rows = cabs.filter((c) => !q || [c.id, c.from.eq, c.to.eq, c.notes].join(' ').toLowerCase().includes(q));
    count = rows.length;

      ${rows.map((c) => `<tr class="${S.inv.hl === c.id ? 'hl' : c.prop ? 'prop' : ''}" id="row-${c.id}"><td class="mono">${c.id}</td><td>${side(c.from)}</td><td>${side(c.to)}</td><td>${dot(c.net)}${bdi(netName(c.net))}</td><td>${c.prop ? '<span class="chip prop">Proposed</span>' : 'Installed'}</td><td>${esc(c.notes || '—')}</td></tr>`).join('')}</tbody></table>`;
  }
  const H = 'calc(100vh - 44px - 120px' + (plan() ? ' - 32px' : '') + ')';
  return `<div class="wrap">${ph({ crumbs: `${ctxCrumb()} ${chev} <b>Inventory</b>`, title: 'Inventory', meta: `${plan() ? 'Plan: Expansion · proposed items are marked' : 'Installed'} · ${eqs.length} equipment · ${cabs.length} cables${S.net !== 'all' ? ' · ' + esc(netName(S.net)) : ''}`, end: `<button class="btn quiet" data-act="toast" data-t="Export to CSV is unchanged.">${ic('download')}Export to CSV</button>` })}
    <div class="iv-grid" style="height:${H}"><div class="card lists"><h4>Lists</h4>${listHtml}</div>
    <div class="card tbl-card"><div class="tb"><label class="search">${ic('search')}<input id="invQ" placeholder="Filter for any field..." value="${esc(S.inv.q)}" autocomplete="off"></label></div>
      <div class="tmeta">Showing 1 to ${count} of ${count} records.</div><div class="tscroll" id="tscroll">${table}</div></div></div></div>`;
}
function rowMenu() {

/* =====================================================================
   Render
   ===================================================================== */
function pageHtml() {
  if (S.view === 'trace') return S.trace.kind === 'rack' ? traceRackPage() : traceUpPage();
  if (S.view === 'conceptual') return conceptualPage();
  if (S.view === 'inventory') return invPage();
  const lv = S.phys.level;
  return lv === 'sites' ? sitesPage() : lv === 'site' ? sitePage() : lv === 'node' ? nodePage() : lv === 'rack' ? rackPage() : eqPage();
}
const pageKey = () => JSON.stringify([S.view, S.view === 'physical' ? S.phys : S.view === 'trace' ? [S.trace.kind, S.trace.eq, S.trace.rack, S.trace.mode] : S.inv.list]);
let lastKey = '';
function render() {
  const pageEl = document.querySelector('.page');
  const keep = pageEl && lastKey === pageKey() ? pageEl.scrollTop : 0;
  const dockEl = document.getElementById('dockb');
  const dockKeep = dockEl ? dockEl.scrollTop : 0;
  const app = document.getElementById('app');
  app.className = `look-${S.look}${plan() ? ' plan' : ''}`;
  const band = plan() ? `<div class="planband">${ic('branch')}<b>Plan: Expansion</b><span>· ${plural(S.changes.length, 'change')} · proposed items are dashed; nothing here is installed</span></div>` : '';
  app.innerHTML = header() + rail() + dock() + `<main class="page" id="page">${band}${pageHtml()}</main>` + rowMenu();
  const p2 = document.querySelector('.page');
  p2.scrollTop = keep;
  const d2 = document.getElementById('dockb');
  if (d2) d2.scrollTop = dockKeep;
  lastKey = pageKey();
  renderPop();
  fit();
  if (S.netUI.rename) { const i = document.getElementById('renameIn'); if (i) { i.focus(); i.select(); } }
  if (S.netUI.adding) { const i = document.getElementById('newNet'); if (i && document.activeElement !== i) i.focus(); }
}
function fit() {
  const grid = document.getElementById('workgrid');
  if (grid) grid.classList.toggle('narrow', grid.clientWidth < (grid.classList.contains('eq-grid') ? 900 : 1200));
  document.querySelectorAll('.face[data-fit]').forEach(fitFace);
  const cab = document.getElementById('rackfit');
  if (cab) {
    const units = +cab.dataset.units;
    const pc = document.querySelector('.pathcard');
    const pcH = pc ? pc.offsetHeight + 16 : 0;
    const top = cab.getBoundingClientRect().top;
    const avail = window.innerHeight - top - pcH - 24 - 28;
    cab.style.setProperty('--u', Math.max(18, Math.min(28, Math.floor(avail / units))) + 'px');
  }
  const gl = document.getElementById('glayout');
  if (gl) gl.classList.toggle('narrow', gl.clientWidth < 1100);
  drawGraph();
}
function fitFace(face) {
  const box = face.parentElement;
  const cs = getComputedStyle(box);
  const avail = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2;
  const old = S.look === 'old';
  const g = old ? 2 : 4;
  const kind = face.dataset.fit;
  let j;
  face.classList.remove('wrapg');
  if (kind === 'switch') {
    const cols = face.dataset.cols.split(',').map(Number);
    const C = cols.reduce((a, b) => a + b, 0), G = cols.length;
    j = (avail - 24 - (G - 1) * 16 + G * g) / C - g;
    if (j < 24 && G > 1) { face.classList.add('wrapg'); j = (avail - 24 + g) / Math.max(...cols) - g; }
    j = Math.min(old ? 56 : 44, j);
  } else if (kind === 'panel') {
    j = Math.min(56, (avail - 24 + g) / +face.dataset.cols - g);
  } else {
    j = Math.min(old ? 60 : 60, (avail - 24 - 18 - 30 - 10 + 4 * g) / 24 - g);
  }
  face.style.setProperty('--j', Math.max(20, Math.floor(j)) + 'px');
}

  if (!S.pop) { el.innerHTML = ''; return; }

  const end = (x) => `${bdi(x.eq)} ${esc(x.j)}${EQ[x.eq].kind !== 'switch' ? ' ' + x.side : ''}`;
  const left = Math.max(8, Math.min(window.innerWidth - 308, S.pop.x - 150));
  const below = S.pop.y + 16;
  const top = below + 230 > window.innerHeight ? S.pop.y - 240 : below;
  el.innerHTML = `<div class="pop" role="dialog" aria-label="Cable ${c.id}" style="left:${left}px;top:${top}px">
    <div class="pop-h"><h3 class="mono">Cable ${c.id}</h3>${c.prop ? '<span class="chip prop">Proposed</span>' : '<span class="chip">Installed</span>'}<button class="iconbtn" data-act="closepop" aria-label="Close">${ic('x')}</button></div>
    <dl class="kv"><dt>Network</dt><dd>${dot(c.net)} ${bdi(netName(c.net))}</dd><dt>From</dt><dd>${end(c.from)}</dd><dt>To</dt><dd>${end(c.to)}</dd><dt>Notes</dt><dd>${c.notes ? esc(c.notes) : '<span class="faint">None</span>'}</dd></dl>

let toastT;
function toast(t) {
  const el = document.getElementById('toast');
  el.innerHTML = `<div class="toast" role="status">${esc(t)}</div>`;
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.innerHTML = ''; }, 2600);

/* =====================================================================
   Navigation
   ===================================================================== */
const snap = () => JSON.parse(JSON.stringify({ view: S.view, phys: S.phys, trace: S.trace }));
function go(change) {
  S.back.push(snap());
  if (S.back.length > 40) S.back.shift();
  Object.assign(S, change);
  S.pop = null; S.inv.menu = null; S.netMenu = false;
  render();
}
function goPhys(phys) { go({ view: 'physical', phys: Object.assign({}, S.phys, phys) }); }
function goEqInRack(eqId) {
  const e = EQ[eqId];
  S.chosen[e.rack] = eqId;
  S.inspect = eqId;
  const node = RACKS[e.rack].node;
  goPhys({ level: 'rack', rack: e.rack, node, site: NODES[node].site });
}
function openTraceUp(eqId, routeId) {
  const from = S.view === 'trace' ? S.trace.fromView : S.view;
  go({ view: 'trace', trace: { kind: 'up', eq: eqId, route: routeId || null, fromView: from } });
  if (routeId) { const el = document.getElementById('upl-' + routeId); if (el) el.scrollIntoView({ block: 'start' }); }
}
function openTraceRack(rid) {
  const from = S.view === 'trace' ? S.trace.fromView : S.view;
  go({ view: 'trace', trace: { kind: 'rack', rack: rid, mode: (S.trace && S.trace.mode) || 'stacked', sel: null, fromView: from } });
}
function showMap(eqId) {
  const e = EQ[eqId];
  if (e.net) S.net = e.net;
  S.tree.sel = nodeOfEq(eqId);
  S.dock = 'node';
  go({ view: 'conceptual' });
}

  managenets: () => { S.netMenu = false; S.dock = 'networks'; render(); },

  closepop: () => { S.pop = null; render(); },

  rm: (d) => { S.netUI = { remove: S.netUI.remove === d.id ? null : d.id }; render(); },
  rmcancel: () => { S.netUI = {}; render(); },
  rmok: (d) => { const n = netOf(d.id); S.nets = S.nets.filter((x) => x.id !== d.id); if (S.net === d.id) S.net = 'all'; S.netUI = {}; toast(`Removed ${n.name}.`); render(); },
  pick: (d) => { S.netUI = { picker: S.netUI.picker === d.id ? null : d.id }; render(); },
  pkcancel: () => { S.netUI = {}; render(); },
  pkpreset: (d) => setPicker(d.c),
  pkok: () => {
    const id = document.getElementById('picker').dataset.id;
    const v = document.getElementById('pkHex').value.trim();
    if (!/^#[0-9a-f]{6}$/i.test(v)) return;
    netOf(id).color = v.toLowerCase(); S.netUI = {}; toast(`${netName(id)} now uses ${v.toLowerCase()} everywhere.`); render();
  },
};
function setPicker(c) {
  const id = document.getElementById('picker').dataset.id;
  const hex = document.getElementById('pkHex');
  const col = document.getElementById('pkColor');
  hex.value = c;
  if (/^#[0-9a-f]{6}$/i.test(c)) { col.value = c.toLowerCase(); document.getElementById('pkPrev').style.setProperty('--c', c); }
  document.getElementById('pkWarn').innerHTML = warnHtml(id, c);
}
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  const inPop = ev.target.closest('.pop, .menu');
  let dirty = false;
  if (!inPop && (!el || !['cable', 'netmenu', 'rowmenu'].includes(el.dataset.act))) {
    if (S.pop || S.netMenu || S.inv.menu) { S.pop = null; S.netMenu = false; S.inv.menu = null; dirty = true; }
  }
  if (el && ev.target.closest('#app, #pop')) {
    const fn = ACT[el.dataset.act];
    if (fn) { ev.stopPropagation(); fn(el.dataset, ev, el); return; }
  }
  if (dirty) render();
});
document.addEventListener('dblclick', (ev) => {
  const b = ev.target.closest('.blk');
  if (b) ACT.openpage({ eq: b.dataset.eq });
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'exploreQ') { S.exploreQ = t.value; document.getElementById('exploreList').innerHTML = exploreList(t.value); }
  if (t.id === 'invQ') { S.inv.q = t.value; const pos = t.selectionStart; render(); const i = document.getElementById('invQ'); i.focus(); i.setSelectionRange(pos, pos); }
  if (t.id === 'pkColor') setPicker(t.value);
  if (t.id === 'pkHex') { const v = t.value.trim(); const id = document.getElementById('picker').dataset.id; if (/^#[0-9a-f]{6}$/i.test(v)) { document.getElementById('pkColor').value = v.toLowerCase(); document.getElementById('pkPrev').style.setProperty('--c', v); } document.getElementById('pkWarn').innerHTML = warnHtml(id, v); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') {
    if (ev.target.id === 'newNet') { ACT.addok(); return; }
    if (ev.target.id === 'renameIn') { ACT.renok({ id: S.netUI.rename }); return; }
    const card = ev.target.closest && ev.target.closest('.ncard');
    if (card) { ACT.gonode({ node: card.dataset.node }); return; }
    if (ev.target.classList && ev.target.classList.contains('mrack')) { ACT.gorack({ rack: ev.target.dataset.rack }); return; }
  }
  if (ev.key !== 'Escape') return;
  if (S.pop) { S.pop = null; render(); return; }
  if (S.inv.menu || S.netMenu) { S.inv.menu = null; S.netMenu = false; render(); return; }
  const U = S.netUI;
  if (U.adding || U.rename || U.remove || U.picker) { S.netUI = {}; render(); return; }
  if (S.dock) { S.dock = null; render(); return; }
  if (S.view === 'trace') ACT.back();
});
/* Site screen: a drag moves a node card, a short move counts as a click. */
let drag = null;
document.addEventListener('pointerdown', (ev) => {
  const card = ev.target.closest('.ncard');
  if (!card || ev.button !== 0) return;
  const n = card.dataset.node;
  drag = { card, n, sx: ev.clientX, sy: ev.clientY, ox: S.site[n][0], oy: S.site[n][1], moved: false };
  card.setPointerCapture(ev.pointerId);
});
document.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) < 5) return;
  drag.moved = true;
  drag.card.classList.add('drag');
  const cv = document.getElementById('canvas');
  const x = Math.max(0, Math.min(cv.clientWidth - drag.card.offsetWidth, drag.ox + dx));
  const y = Math.max(0, Math.min(cv.clientHeight - drag.card.offsetHeight, drag.oy + dy));
  S.site[drag.n] = [x, y];
  drag.card.style.left = x + 'px';
  drag.card.style.top = y + 'px';
  document.getElementById('sitelines').innerHTML = siteLinesSvg(S.phys.site);
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag;
  drag = null;
  d.card.classList.remove('drag');
  if (!d.moved) ACT.gonode({ node: d.n });
  else toast(`Saved the place of ${NODES[d.n].name}.`);
});
window.addEventListener('resize', () => { S.pop = null; renderPop(); fit(); });

/* =====================================================================
   Demo guide
   ===================================================================== */
const GUIDE = [
  { sec: 'A · The frame on the left', steps: [
    ['Click <b>Inspector</b> on the rail: the panel opens between the rail and the page and the page narrows. The same icon or Esc closes it.', () => { setup({ view: 'physical', phys: { level: 'rack', site: 'main', node: 'bc', rack: 'C01' }, mode: 'installed', dock: 'inspector' }); }],
    ['Switch to <b>Plan: Expansion</b>: Add and <b>Changes</b> (with its count) join the rail; open Changes and Undo a line.', () => { setup({ mode: 'plan', dock: 'changes' }); }],
    ['On Rack C01, jack 49 of EDGE-33 is selected: the path card has no cable names. Click a cable line for its card, then <b>Go to cable</b>.', () => { S.jack['EDGE-33'] = 'Gi1/0/49'; S.chosen.C01 = 'EDGE-33'; setup({ view: 'physical', phys: { level: 'rack', site: 'main', node: 'bc', rack: 'C01' }, dock: null }); }],
    ['<b>Building C</b>, the node level: click a mini rack to open it; click a device in one to open the rack with it chosen.', () => { setup({ view: 'physical', phys: { level: 'node', site: 'main', node: 'bc' }, dock: null }); }],
    ['<b>Main Campus</b>, the site: click a node card to open its racks; drag a card to move it.', () => { setup({ view: 'physical', phys: { level: 'site', site: 'main' }, dock: null }); }],
  ] },
  { sec: 'B · Trace', steps: [
    ['<b>Trace uplinks</b> on EDGE-33: one drawing per uplink, HDF-11 marked “on both”. (Also from the jack card, the tree’s Node panel and Inventory’s ⋯.)', () => { setup({ view: 'physical', phys: { level: 'rack', site: 'main', node: 'bc', rack: 'C01' }, dock: null }); openTraceUp('EDGE-33'); }],
    ['<b>Trace rack</b> on Rack C01, option 1: every switch’s uplinks stacked, all open; EDGE-40 has none.', () => { setup({ view: 'physical', phys: { level: 'rack', site: 'main', node: 'bc', rack: 'C01' }, dock: null }); S.trace = null; openTraceRack('C01'); S.trace.mode = 'stacked'; render(); }],
    ['Option 2, <b>One graph</b>: each panel, HDF and AGG drawn once; click a switch to light its routes.', () => { setup({ view: 'physical', phys: { level: 'rack', site: 'main', node: 'bc', rack: 'C01' }, dock: null }); openTraceRack('C01'); S.trace.mode = 'graph'; render(); }],
  ] },
  { sec: 'C · Networks and racks', steps: [
    ['<b>Network ▾ › Manage networks…</b>: + Add network starts with the next colour; click a swatch to pick any colour (try red or a blue for a warning).', () => { setup({ dock: 'networks' }); }],
    ['<b>Remove…</b> on Network A is refused in words; Network D, unused, can be removed. In Plan, Network C counts the draft.', () => { S.netUI = { remove: 'A' }; setup({ dock: 'networks' }); }],
    ['Racks and faceplates: flip <b>Demo look: Today | Proposed</b> on a node or rack to compare.', () => { setup({ view: 'physical', phys: { level: 'rack', site: 'main', node: 'bc', rack: 'C01' }, dock: null }); }],
  ] },
];
function setup(o) {
  const phys = o.phys ? Object.assign({}, S.phys, o.phys) : null;
  if ('mode' in o) S.mode = o.mode;
  if ('dock' in o) S.dock = o.dock;
  if (o.view) { S.back.push(snap()); S.view = o.view; }
  if (phys) S.phys = phys;
  if (o.dock !== 'networks') S.netUI = {};
  S.pop = null; S.netMenu = false; S.inv.menu = null;
  render();
}
function renderGuide() {
  const g = document.getElementById('guide');
  g.className = 'guide' + (S.guide ? '' : ' closed');
  let n = 0;
  const hb = document.querySelector('.guide-btn');
  if (hb) hb.setAttribute('aria-expanded', String(S.guide));
  g.innerHTML = `<div class="guide-h">${ic('book')}<b>Demo guide</b><button class="iconbtn" data-g="toggle" aria-label="Close the guide">${ic('x')}</button></div>
    ${S.guide ? `<div class="guide-b">${GUIDE.map((s) => `<h5>${s.sec}</h5><ol start="${n + 1}">${s.steps.map(([t]) => `<li>${t}<button data-g="${n++}">Show me</button></li>`).join('')}</ol>`).join('')}
      <p class="note">Every page uses the same heading and type sizes: a breadcrumb above in 12, the title in 20/600, a quiet 13 meta line, actions on the right; dock panels too.</p>
      <p class="note">Esc closes the card, form or panel on top. Data is fictional.</p></div>` : ''}`;
}
document.getElementById('guide').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-g]');
  if (!b) return;
  if (b.dataset.g === 'toggle') { S.guide = !S.guide; renderGuide(); return; }
  const steps = GUIDE.flatMap((s) => s.steps);
  steps[+b.dataset.g][1]();
});

render();
renderGuide();
</script>
