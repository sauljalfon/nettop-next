<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI refresh demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ The demo's own chrome (not part of either look) ============ */
:root {
  --demo-bg: #dfe4e9; --demo-ink: #1c2b3a; --demo-soft: #56636f;
  --sans: 'IBM Plex Sans', 'IBM Plex Sans Hebrew', 'Segoe UI', Arial, sans-serif;
  --mono: 'IBM Plex Mono', Consolas, ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--demo-bg); color: var(--demo-ink); font: 13px/1.45 var(--sans); }
button { font: inherit; color: inherit; cursor: pointer; }
.demo-bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #c9d1d9; }
.demo-bar h1 { margin: 0; font-size: 15px; font-weight: 600; }
.demo-bar .grp { display: inline-flex; gap: 2px; padding: 2px; background: #f1f4f6; border: 1px solid #d5dce2; border-radius: 6px; }
.demo-bar .grp button { border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 4px; color: var(--demo-soft); }
.demo-bar .grp button[aria-pressed='true'] { background: #fff; color: var(--demo-ink); font-weight: 600; box-shadow: 0 0 0 1px #d5dce2; }
.demo-bar .note { color: var(--demo-soft); font-size: 12px; flex: 1 1 260px; }
.demo-bar kbd { font: 500 11px var(--mono); padding: 1px 5px; border: 1px solid #c9d1d9; border-radius: 4px; background: #f7f9fa; }
.stage { padding: 16px; display: grid; gap: 16px; }
.stage.side { grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .stage.side { grid-template-columns: 1fr; } }
.shot-wrap h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.shot-wrap h2 span { font-weight: 400; color: var(--demo-soft); }
.tag { font: 600 11px var(--sans); padding: 1px 8px; border-radius: 999px; }
.tag.old { background: #e7ebef; color: #3a4552; }
.tag.new { background: #e2f3f0; color: #0b7666; }
.viewport { position: relative; width: 100%; overflow: hidden; border-radius: 8px; box-shadow: 0 1px 2px #1c2b3a22, 0 8px 24px -12px #1c2b3a44; }
.viewport > .app { position: absolute; top: 0; left: 0; width: 1536px; height: 864px; transform-origin: 0 0; }
.findings { max-width: 1100px; margin: 0 auto; padding: 4px 16px 40px; color: var(--demo-soft); }
.findings h3 { color: var(--demo-ink); font-size: 14px; margin: 16px 0 6px; }
.findings ul { margin: 0; padding-left: 18px; }
.findings li { margin: 3px 0; }

/* ============ Shared structure for both looks (sizes come from each look's tokens) ============ */
.app { font-family: var(--sans); color: var(--text); background: var(--page); font-size: var(--fs-body); line-height: 1.45; display: grid; grid-template-rows: 44px 1fr; grid-template-columns: 48px 1fr auto; overflow: hidden; }
.app * { box-sizing: border-box; }
.app bdi { unicode-bidi: isolate; }
.app .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.hdr { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; margin-right: 6px; }
.brand svg { width: 18px; height: 18px; }
.hseg { display: inline-flex; padding: 2px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-sunk); }
.hseg span { display: inline-flex; align-items: center; gap: 6px; height: var(--seg-h); padding: 0 12px; border-radius: 4px; color: var(--text-muted); font-size: 13px; }
.hseg span.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }
.hlabel { color: var(--text-muted); font-size: 13px; }
.hsel { display: inline-flex; align-items: center; justify-content: space-between; gap: 10px; width: 170px; height: var(--sel-h); padding: 0 10px 0 12px; border: 1px solid var(--sel-border); border-radius: var(--r-md); background: var(--surface); font-size: 13px; }
.hsel svg { width: 14px; height: 14px; color: var(--text-muted); }
.hspace { flex: 1; }
.hbtn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: var(--r-md); color: var(--text); font-size: 13px; font-weight: 500; }
.hbtn svg { width: 16px; height: 16px; }
.env { font: 600 12px var(--sans); color: #7a5200; background: #fdf3dc; border: 1px solid #ecd49a; border-radius: 4px; padding: 2px 6px; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 12px; background: var(--surface); border-right: 1px solid var(--border); }
.rail i { position: relative; display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r-md); color: var(--rail-ink); }
.rail i svg { width: 18px; height: 18px; }
.page { position: relative; overflow: hidden; min-width: 0; }
.dock { width: 380px; background: var(--surface); border-left: 1px solid var(--border); display: grid; grid-template-rows: 40px 1fr; min-height: 0; }
.dock-tabs { display: flex; align-items: stretch; gap: 2px; padding: 0 6px; border-bottom: 1px solid var(--border); }
.dock-tabs span { display: flex; align-items: center; padding: 0 8px; font-size: 13px; color: var(--text-muted); border-bottom: 2px solid transparent; }
.dock-tabs span.on { color: var(--text); font-weight: 600; border-bottom-color: var(--text); }
.dock-tabs .x { margin-left: auto; color: var(--text-muted); }
.dock-body { padding: 16px; overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; white-space: nowrap; }
.dot { width: var(--dot); height: var(--dot); border-radius: 50%; flex: none; display: inline-block; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-md); font-size: 13px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); white-space: nowrap; }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--text); color: #fff; border-color: var(--text); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--text-muted); padding: 0 8px; }
.ico { width: 14px; height: 14px; vertical-align: -2px; }

/* ---------- Steel and jacks (shared) ---------- */
.plate { display: inline-block; background: var(--steel); border-radius: 6px; padding: var(--plate-pad); }
.plate-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.tape { background: #fbfbf8; color: #15202b; border-radius: 2px; padding: 0 6px; font: 500 12px/20px var(--sans); white-space: nowrap; }
.plate-count { font: 12px var(--mono); color: var(--steel-ink); }
.ports { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, var(--j)); grid-auto-columns: var(--j); gap: var(--jgap); }
.jack { position: relative; display: grid; place-items: center; font-family: var(--mono); font-weight: var(--jack-weight); font-size: calc(var(--j) * var(--jack-ratio)); border-radius: var(--jack-r); background: var(--jack-free); color: var(--jack-ink); box-shadow: var(--jack-edge); }
.jack.cab { background: var(--net-1); color: #fff; box-shadow: var(--jack-edge-cab); }
.jack.sel { box-shadow: var(--jack-sel); z-index: 1; }
.jack .up { position: absolute; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 12px; font-size: 12px; color: var(--text-muted); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; }

/* Rack */
.rack { background: var(--steel); border-radius: 6px; padding: 6px 6px 6px 0; display: grid; grid-template-columns: 26px 1fr 6px; }
.u { height: var(--u); display: contents; }
.ulab { font: 11px/var(--u) var(--mono); color: var(--steel-ink-soft); text-align: right; padding-right: 6px; height: var(--u); line-height: var(--u); }
.ucell { height: var(--u); padding: 1px 0; }
.rail-n { background: repeating-linear-gradient(#11171e 0 2px, transparent 2px 7px); margin: 3px 0 3px 2px; border-radius: 1px; }
.blk { height: 100%; border-radius: 3px; display: flex; align-items: center; gap: 6px; padding: 0 6px; background: var(--steel-2); border: 1px solid var(--steel-edge); overflow: hidden; position: relative; }
.blk .tape { line-height: 18px; font-size: 12px; }
.blk.chosen { outline: 2px solid #fff; outline-offset: -1px; }
.free { height: 100%; border: 1px dashed var(--steel-free-line); border-radius: 3px; font: 11px var(--mono); color: var(--steel-free-ink); display: flex; align-items: center; justify-content: center; }

/* Path plates (shared) */
.path-row { display: flex; align-items: flex-start; gap: 0; }
.place { padding: 6px 8px 8px; border-radius: 6px; }
.place-name { font-size: 12px; color: var(--text-muted); margin: 0 0 6px 4px; white-space: nowrap; }
.pplate { background: var(--steel); border-radius: 6px; padding: 10px 12px; min-width: 150px; color: var(--steel-ink); }
.pplate .row { display: flex; justify-content: space-between; align-items: center; }
.pplate .kind { font: 12px var(--mono); }
.pj { width: 34px; height: 34px; display: grid; place-items: center; background: var(--net-1); color: #fff; font: 500 13px var(--mono); border-radius: 3px; }
.pplate .jacks { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 6px; gap: 8px; }
.pplate .pair-line { flex: 1; border-top: 2px dotted var(--steel-ink-soft); }
.pplate .sides { display: flex; justify-content: space-between; font: 12px var(--mono); }
.cable { width: 120px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 44px; }
.cable .id { font: 12px var(--mono); color: var(--text-muted); margin-bottom: 4px; }
.cable .line { width: 100%; height: 2px; background: var(--net-1); position: relative; }

/* ============ Today: the current theme.css values ============ */
.app.old {
  --page: #eef1f3; --surface: #ffffff; --surface-sunk: #f6f8f9; --border: #d3dae1; --border-strong: #b6c1cc;
  --text: #1c2b3a; --text-muted: #56636f; --text-faint: #56636f;
  --sel-border: #d3dae1; --sel-h: 30px; --seg-h: 32px; --rail-ink: #56636f;
  --steel: #1f2731; --steel-2: #2a3440; --steel-edge: #4b5765; --steel-ink: #a8b4c0; --steel-ink-soft: #8d9aa8;
  --steel-free-line: #36414d; --steel-free-ink: #6f7c8a;
  --net-1: #2f6fdb; --net-2: #9a4fc7; --route: #0f8b7a; --route-soft: #e2f3f0;
  --r-md: 6px; --fs-body: 14px; --dot: 5px;
  --j: 56px; --jgap: 2px; --jack-ratio: 0.38; --jack-weight: 500; --jack-r: 2px;
  --jack-free: #ffffff; --jack-ink: #1c2b3a; --jack-edge: none; --jack-edge-cab: none;
  --jack-sel: inset 0 0 0 3px #fff, inset 0 0 0 5px #1c2b3a;
  --plate-pad: 12px 14px 14px; --u: 26px;
}
.old .page { background-image: radial-gradient(#c6ced6 1px, transparent 1px); background-size: 16px 16px; }
.old .page.flat { background-image: none; }
.old .rail i.on { background: #1c2b3a; color: #fff; }
.old .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.old .jack .up { top: 1px; right: 3px; font: 700 11px var(--sans); color: currentColor; }

/* ============ Proposed: the tokens of ui-research-2026-11-25.md ============ */
.app.new {
  --page: #f2f4f6; --surface: #ffffff; --surface-sunk: #f7f9fa; --surface-hover: #f1f4f7; --surface-selected: #e8eef5;
  --border-subtle: #e6ebef; --border: #d5dce2; --border-strong: #b6c1cc; --border-field: #7b8794;
  --text: #1c2b3a; --text-muted: #56636f; --text-faint: #6b7782;
  --sel-border: #b6c1cc; --sel-h: 32px; --seg-h: 26px; --rail-ink: #56636f;
  --steel: #1f2731; --steel-2: #2a3440; --steel-edge: #4b5765; --steel-ink: #a8b4c0; --steel-ink-soft: #8d9aa8;
  --steel-free-line: #56626f; --steel-free-ink: #a8b4c0;
  --net-1: #2f6fdb; --net-2: #8b55c9; --route: #0f8b7a; --route-text: #0b7666; --route-soft: #e2f3f0;
  --warn-text: #7a5200; --highlight-soft: #fdf3dc;
  --r-md: 6px; --fs-body: 14px; --dot: 8px;
  --j: 44px; --jgap: 4px; --jack-ratio: 0.32; --jack-weight: 500; --jack-r: 4px;
  --jack-free: #e8ecf0; --jack-ink: #2a3440;
  --jack-edge: inset 0 0 0 1px #c5cdd5, inset 0 -3px 0 #d3d9df;
  --jack-edge-cab: inset 0 -3px 0 #2558b3;
  --jack-sel: 0 0 0 2px #1f2731, 0 0 0 4px #ffffff;
  --plate-pad: 10px 12px 12px; --u: 26px;
  --shadow-1: 0 1px 2px #1c2b3a14;
}
.new .page { background-image: radial-gradient(#dfe4e9 1px, transparent 1px); background-size: 16px 16px; }
.new .page.flat { background-image: none; }
.new .rail i.on { background: var(--surface-selected); color: var(--text); }
.new .rail i.on::before { content: ''; position: absolute; left: -6px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--text); }
.new .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.new .card-h { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-bottom: 1px solid var(--border-subtle); }
.new .card-h h3 { margin: 0; font: 600 14px/20px var(--sans); }
.new .card-h .n { color: var(--text-muted); font-size: 12px; }
.new .card-h .end { margin-left: auto; display: flex; gap: 4px; }
.new .jack .up { top: 3px; right: 3px; width: 13px; height: 13px; border-radius: 50%; background: #fff; color: #1f2731; display: grid; place-items: center; box-shadow: 0 0 0 1.5px #1f2731; }
.new .jack .up svg { width: 9px; height: 9px; }
.new .blk { padding-left: 10px; }
.new .blk::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--stripe, #7d8a98); }
.new .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 18px 12px; color: var(--text-muted); font-size: 13px; text-align: center; }
.new .empty svg { width: 20px; height: 20px; color: var(--text-faint); }
.new .page-h { display: flex; align-items: flex-end; gap: 16px; }
.new .page-h h1 { margin: 0; font: 600 20px/28px var(--sans); letter-spacing: -0.01em; }
.new .page-h .meta { color: var(--text-muted); font-size: 13px; padding-bottom: 3px; }
.new .crumbs { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
.new .crumbs svg { width: 12px; height: 12px; }
.new .crumbs b { color: var(--text); font-weight: 500; }

/* ============ Screen: rack level ============ */
.rk-wrap { padding: 20px 28px 20px 100px; height: 100%; display: grid; grid-template-rows: auto auto auto 1fr; gap: 0; }
.old .rk-crumbs { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.old .rk-crumbs .back { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px; background: #fff; border: 1px solid var(--border); border-radius: 6px; font-weight: 500; }
.old .rk-crumbs a { color: var(--text-muted); }
.old .rk-scope { margin: 8px 0 22px; font-size: 13px; color: var(--text-muted); }
.rk-grid { display: grid; grid-template-columns: 200px minmax(0, 1fr) minmax(0, 340px); gap: 16px; align-items: start; }
.old .rk-grid { gap: 18px 16px; }
.rk-rack h2 { margin: 0; font-size: 16px; font-weight: 600; }
.rk-rack p { margin: 0 0 8px; font-size: 13px; color: var(--text-muted); }
.unit-h { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.unit-h h2 { margin: 0; font-size: 20px; font-weight: 600; }
.unit-h p { margin: 0; color: var(--text-muted); font-size: 13px; }
.unit-h .btn { margin-left: auto; }
.facebox { padding: 16px 18px; }
.old .facebox { text-align: center; }
.old .side-c { border-radius: 8px; background: #fff; border: 1px solid var(--border); }
.old .side-c .hd { display: flex; align-items: baseline; gap: 8px; padding: 8px 10px; background: var(--surface-sunk); border-bottom: 1px solid var(--border); font-weight: 600; }
.old .side-c .hd span { font-weight: 400; font-size: 12px; color: var(--text-muted); }
.ct-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px; }
.ct-row b { font-weight: 600; }
.ct-row .pl { margin-left: auto; color: var(--text-muted); font-size: 12px; }
.jc { padding: 14px 16px; }
.jc h3 { margin: 0; font-size: 16px; font-weight: 600; }
.jc .sub { color: var(--text-muted); font-size: 13px; }
.peer { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin: 10px 0; }
.peer b { font-weight: 600; }
.peer div { font-size: 12px; color: var(--text-muted); }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 8px; font-size: 12px; }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; }
.pathcard { margin-top: 16px; }
.old .pathcard { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px 14px; }
.old .path-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
.old .path-h b { font-weight: 600; font-size: 14px; }
.old .place { background: var(--surface-sunk); }
.old .pplate.here { box-shadow: 0 0 0 2px #fff, 0 0 0 3px #1f2731; }
.old .pplate.end { box-shadow: 0 0 0 2px #0f8b7a; }
.old .cable .id { border: 1px solid var(--border); background: #fff; border-radius: 3px; padding: 0 4px; }
.old .cable .line::before, .old .cable .line::after { content: ''; position: absolute; top: -5px; width: 3px; height: 12px; background: var(--net-1); }
.old .cable .line::before { left: 0; } .old .cable .line::after { right: 0; }
.new .place { background: var(--surface-sunk); }
.new .pplate { padding: 8px 10px; min-width: 136px; }
.new .pplate.here { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #1f2731; }
.new .pplate.end { box-shadow: 0 0 0 2px var(--route); }
.new .cable { width: 104px; }
.new .cable .line::before, .new .cable .line::after { content: ''; position: absolute; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--net-1); }
.new .cable .line::before { left: -2px; } .new .cable .line::after { right: -2px; }
.new .pj { width: 30px; height: 30px; font-size: 12px; border-radius: 4px; }
.reach { display: inline-flex; align-items: center; gap: 4px; margin: 6px 0 0 4px; font-size: 12px; font-weight: 600; color: #0b7666; background: var(--route-soft); border-radius: 999px; padding: 1px 8px; }

/* ============ Screen: tree ============ */
.tr-col-h { position: absolute; font-size: 11px; font-weight: 500; color: var(--text-muted); }
.hc { position: absolute; display: flex; align-items: center; gap: 6px; padding: 0 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; white-space: nowrap; }
.hc b { font-weight: 600; }
.hc .end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.hc .n { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.badge { font-size: 11px; padding: 0 5px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-sunk); }
.old .hc { height: 30px; }
.old .hc.lit { border: 1.5px solid var(--route); color: var(--route); }
.old .hc.sel { border: 3px solid var(--route); }
.old .hc.dim { opacity: 0.35; }
.old .warn { color: #7a5200; font-weight: 600; font-size: 12px; }
.old .warn::before { content: '⚠ '; }
.old .panel { position: absolute; left: 100px; top: 12px; width: 280px; padding: 14px 12px; }
.old .panel h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
.old .panel p { margin: 0 0 8px; font-size: 12px; color: var(--text-muted); }
.new .tr-strip { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 13px; z-index: 2; }
.new .tr-strip b { font-weight: 600; }
.new .tr-strip .muted { color: var(--text-muted); }
.new .tr-strip label { display: inline-flex; align-items: center; gap: 6px; }
.new .tr-strip .cbx { width: 16px; height: 16px; border: 1px solid var(--border-field); border-radius: 4px; background: #fff; display: inline-block; }
.new .lane { position: absolute; top: 44px; bottom: 0; background: #eef1f499; border-left: 1px solid var(--border-subtle); border-right: 1px solid var(--border-subtle); }
.new .lane-h { position: absolute; top: 56px; font-size: 12px; font-weight: 500; color: var(--text-muted); }

const ic = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------- Frame ---------- */
function header(v, view, net) {
  const views = ['Conceptual', 'Physical', 'Inventory'].map((x) => `<span class="${x === view ? 'on' : ''}">${x}</span>`).join('');
  const sel = v === 'old'
    ? `<span class="hsel" style="border-radius:4px">${net}<svg viewBox="0 0 24 24" fill="none" stroke="#1c2b3a" stroke-width="2.4">${P.down}</svg></span>`

  return `<header class="hdr">
    <span class="brand">${ic('net')}nettop</span>
    <span class="hseg">${views}</span>
    <span class="hlabel">Network</span>${sel}
    <span class="hspace"></span>
    <span class="hseg"><span class="on">Installed</span><span>${ic('branch', 'ico')}Plan: Expansion</span></span>
    <span class="hbtn">${ic('layers')}Changes</span>

function rail(on) {
  return `<nav class="rail" aria-label="Tools">${['plus', 'search', 'sliders'].map((n) => `<i class="${n === on ? 'on' : ''}">${ic(n)}</i>`).join('')}</nav>`;
}

/* ---------- Rack level: Rack A03, EDGE-17 chosen, port 1 selected ---------- */
const cabled = new Set([1, 2, 3]);
function face(v) {
  let cells = '';
  for (let c = 0; c < 12; c++) for (const r of [0, 1]) {
    const n = c * 2 + r + 1;
    const cls = ['jack', cabled.has(n) ? 'cab' : '', n === 1 ? 'sel' : ''].join(' ');
    const up = cabled.has(n) ? (v === 'old' ? '<span class="up">↑</span>' : `<span class="up">${ic('up')}</span>`) : '';
    cells += `<span class="${cls}">${n}${up}</span>`;
  }

}
function legend(v) {
  if (v === 'old') return `<div class="legend"><span><i style="background:#fff;border:1px solid #d3dae1"></i>free</span><span><i style="background:#2f6fdb"></i>Network A</span><span><i style="background:#0f8b7a"></i>on the selected route</span><span><b style="font-size:11px">↑</b> reaches an AGG or BB</span><span><i style="border:2px solid #1c2b3a;border-radius:3px;width:14px;height:14px"></i>selected</span></div>`;

}
function rack(v) {
  const rows = [];
  const blk = (u, h, name, cls = '', stripe = '') => ({ u, h, html: `<div class="blk ${cls}" style="--stripe:${stripe}"><span class="tape">${name}</span></div>` });
  const items = [
    blk(12, 1, 'CM-A03', '', '#7d8a98'),
    blk(11, 1, 'PANEL-A', '', '#7d8a98'),
    { u: 10, h: 1, html: `<div class="free">${v === 'old' ? '' : ''}</div>` },
    { u: 9, h: 1, html: `<div class="free"></div>` },
    blk(8, 1, 'EDGE-17', 'chosen', '#2f6fdb'),
    { u: 7, h: 5, html: `<div class="free">7–3 · 5U free</div>` },
    blk(2, 2, 'UPS-A03', '', '#7d8a98'),

  for (const it of items) {
    const lab = it.h > 1 ? `${it.u}–${it.u - it.h + 1}` : it.u;
    rows.push(`<div class="ulab" style="height:calc(var(--u) * ${it.h});line-height:calc(var(--u) * ${it.h})">${lab}</div><div class="ucell" style="height:calc(var(--u) * ${it.h})">${it.html}</div><div class="rail-n" style="height:calc(var(--u) * ${it.h} - 6px)"></div>`);

  return `<div class="rack">${rows.join('')}</div>`;
}

}

  if (v === 'old') return `${header(v, 'Physical', 'All networks')}${rail('')}

function treeScreen(v) {

    f.nodes.forEach((ni, j) => {

      const sw = n.lit === 'sel' ? 2 : (o ? 1 : 1.5);
      const x1 = x.agg + w.agg, x2 = x.node, y1 = fy + h / 2, y2 = ny + h / 2, mx = (x1 + x2) / 2;

  const panel = o

  const dock = o ? `

    <div class="sw-port" style="margin-left:24px"><span class="mono">Port 1 → AGG-03 Port 1</span><small>via PANEL-A 1 › HDF-01 3C/5 › HDF-02 2B/3</small></div>

    <div class="sw-port" style="margin-left:24px"><span class="mono">Port 3 → BB-01 Port 1</span><small>via PANEL-A 3 › HDF-01 2D/4 › HDF-02 3A/1</small></div>`
    : `

    <div class="sw-port"><span>Port 1 → <b style="font-weight:500">AGG-03</b> Port 1</span><small>via PANEL-A 1 › HDF-01 3C/5 › HDF-02 2B/3</small></div>

  return `${header(v, 'Conceptual', 'Network A')}${rail('')}

function shot(v) {
  return `<div class="shot-wrap"><h2><span class="tag ${v}">${v === 'old' ? 'Today' : 'Proposed'}</span><span>${v === 'old' ? 'theme.css as it is' : 'tokens from the research'} · 1536 × 864</span></h2>
    <div class="viewport"><div class="app ${v}">${SCREENS[screen](v)}</div></div></div>`;
}
function render() {
  const st = document.getElementById('stage');
  st.className = 'stage' + (look === 'both' ? ' side' : '');
  st.innerHTML = look === 'both' ? shot('old') + shot('new') : shot(look);
  document.getElementById('findings').innerHTML = `<h3>What changes on this screen</h3><ul>${NOTES[screen].map((n) => `<li>${n}</li>`).join('')}</ul>`;
  document.querySelectorAll('[data-screen]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.screen === screen)));
  document.querySelectorAll('[data-look]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.look === look)));
  fit();
}
function fit() {
  document.querySelectorAll('.viewport').forEach((vp) => {
    const s = vp.clientWidth / 1536;
    vp.style.height = 864 * s + 'px';
    vp.firstElementChild.style.transform = `scale(${s})`;
  });
}
document.querySelectorAll('[data-screen]').forEach((b) => b.addEventListener('click', () => { screen = b.dataset.screen; render(); }));
document.querySelectorAll('[data-look]').forEach((b) => b.addEventListener('click', () => { look = b.dataset.look; render(); }));
document.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 't' && !e.metaKey && !e.ctrlKey) { look = look === 'new' ? 'old' : 'new'; render(); }
});
window.addEventListener('resize', fit);
render();
</script>
</body>
</html>
